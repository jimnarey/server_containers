; Sparse override source for the GPU and CPU llama.cpp routers.  Generate the
; separate runtime presets under /mnt/work with generate-models-preset.py.
; Do not add a section merely to make a model visible: the generator discovers
; every model under MODEL_ROOT and supplies a basic entry for those models.
version = 1

[*]
; A single interactive client gets the complete context. Compose supplies the
; common CUDA and fit settings. Keeping cache defaults here permits deliberate
; per-model cache overrides below.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; Embedding models have smaller native contexts and are intended for
; /v1/embeddings.
[Qwen3-Embedding-0.6B-Q8_0]
model = /models/Qwen--Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
ctx-size = 32768

[embeddinggemma-300M-Q8_0]
model = /models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
ctx-size = 2048

; Older coding models were trained for 16K rather than the catalogue default.
[codellama-13b-instruct.Q4_0]
model = /models/TheBloke--CodeLlama-13B-Instruct-GGUF/codellama-13b-instruct.Q4_0.gguf
ctx-size = 16384

[magicoder-s-ds-6.7b.Q4_0]
model = /models/TheBloke--Magicoder-S-DS-6.7B-GGUF/magicoder-s-ds-6.7b.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_0]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_K_M]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_K_M.gguf
ctx-size = 16384

[starcoder2-15b-instruct.Q4_0]
model = /models/bartowski--starcoder2-15b-instruct-GGUF/starcoder2-15b-instruct-Q4_0.gguf
ctx-size = 16384

; Large dense models need VRAM headroom for CUDA workspaces and KV cache.
; Let --fit choose their partial GPU placement and begin at a short context.
[Llama-3.3-70B-Instruct-Q3_K_M]
model = /models/bartowski--Llama-3.3-70B-Instruct-GGUF/Llama-3.3-70B-Instruct-Q3_K_M.gguf
ctx-size = 8192
n-gpu-layers = auto

[Qwen2.5-72B-Instruct-Q3_K_S]
model = /models/second-state--Qwen2.5-72B-Instruct-GGUF/Qwen2.5-72B-Instruct-Q3_K_S.gguf
ctx-size = 8192
n-gpu-layers = auto

; Earlier Qwen coder releases have a 32K native context.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 32768

; These two 46 GiB sparse models run CPU-only. Q4 V reduces cache bandwidth
; and memory pressure while retaining Q8 keys for long-context quality.
[Qwen3-Coder-Next-Q4_K_M]
model = /models/Qwen--Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q4_0

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q4_0

; Nemotron 3.5 Lightning uses its published MTP sidecar for speculative decode.
[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-draft-model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/mtp-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-type = draft-mtp

; At 64K, this dense 70B model's Q8 K/V cache is about 10 GiB. Retain Q8 K
; but use Q4 V to recover headroom for the host and interactive desktop.
[DeepSeek-R1-Distill-Llama-70B-Q4_K_M]
model = /models/unsloth--DeepSeek-R1-Distill-Llama-70B-GGUF/DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0
reasoning = off
reasoning-budget = 0

# 2026-09-15 reliability review: applied the same reasoning-budget fix used
# on the generel-schwerz 16gb/32gb services (see their config.ini) to all
# three 27B variants, for consistency -- the runaway-reasoning failure mode
# it guards against (a session_analysis.py-confirmed real risk: 246,060
# reasoning characters against 606 characters of actual answer text in one
# 2026-09-15 Flash Next turn) is a property of the chat template/sampling
# behaviour, not specific to one model or fork.
[Qwen3.8-27B-UD-Q4_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072
split-mode = tensor

[Qwen3.8-27B-UD-Q5_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072
split-mode = tensor

[Qwen3.8-27B-UD-Q6_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_M.gguf
reasoning-effort = low
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 163840
split-mode = tensor

[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

# 2026-09-17: added for amiga-ui coding-agent use, split across both GPUs.
# NOT split-mode=tensor like the 27B entries above -- tried that first and it
# fails outright: "LLAMA_SPLIT_MODE_TENSOR not implemented for architecture
# 'deepseek2'" (confirmed via a real load attempt, not assumed). This is a
# hard architecture limitation in this stock llama.cpp build, not a
# resource/context problem -- deepseek2 (which GLM-4.7-Flash uses) simply
# doesn't support tensor-split here. split-mode=layer is the real mechanism
# for spreading this specific model across both GPUs; `--fit on` (this
# service's own compose-level default) handles the actual per-GPU layer
# balancing. GLM-4.7-Flash is reasoning-capable (confirmed via its own chat
# template: real reasoning_content/enable_thinking support, same as Flash
# Next) and has an unusually cheap KV cache for its size
# (attention.head_count_kv = 1). ctx-size below is confirmed by a real load
# + request, not a guess -- see performance-findings.md for the test that
# established it.
[GLM-4.7-Flash-Q4_K_M]
model = /models/unsloth--GLM-4.7-Flash-GGUF/GLM-4.7-Flash-Q4_K_M.gguf
reasoning-effort = low
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 202752
split-mode = layer
