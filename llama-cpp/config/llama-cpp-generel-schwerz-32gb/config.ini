# Copy to /mnt/work/llama/llama-cpp-generel-schwerz-32gb/config.ini.
# This is a system-level llama.cpp configuration for every model in the
# explicit models-preset-32gb.ini catalogue. Per-model placement, context, and
# load settings belong in that preset because system settings take precedence
# over model-specific settings in router mode.
#
# 2026-09-16: this service now builds from codex/moe-grouped-multigpu, not
# qwen4exp-mtp -- see docker-compose.yml and models-preset-32gb.ini for why.
# This is the first config for this profile expected to actually work:
# nothing before today's pin change ever ran successfully on two GPUs here
# (GenerelSchwerz/llama.cpp#90 -- the old pin's cache is hardcoded to CUDA
# device 0). Every setting below reflects that new pin's real, documented
# constraints, not a fresh guess -- see models-preset-32gb.ini's header for
# the source (that fork's own docs/moe-grouped-multigpu.md).
[*]
threads               = 8
threads-batch         = 8
batch-size            = 8192
ubatch-size           = 512
split-mode            = layer
tensor-split          = 1,1
kv-offload            = true
cache-type-k          = q8_0
cache-type-v          = q8_0
flash-attn            = on
# REQUIRED by codex/moe-grouped-multigpu, not a preference: mmap-based pinning
# is rejected before inference ("read-only auxiliary registration is
# unsupported"). No model in models-preset-32gb.ini may override this to
# mmap -- that's exactly why Flash Next (which needs mmap for its PLE table)
# is excluded from that catalogue rather than given an override here.
load-mode             = none
# Layer-split placement needs every ordinary layer eligible for GPU
# placement -- the 16GB single-device service's per-model mix of
# n-gpu-layers=0 (host-resident, cache-only-for-experts) and n-gpu-layers=all
# (dense core on GPU) doesn't apply here; assigning whole layers to specific
# devices is the entire mechanism this profile relies on.
n-gpu-layers          = all
fit                   = off
# Routes MoE expert tensors to host memory (functionally similar to this
# repo's existing override-tensor=exps=CPU pattern, but the dedicated flag
# this branch's own example uses); the grouped cache then promotes hot
# experts back onto each layer's assigned GPU. "Cache enabled overrides
# --cpu-moe for matched expert tensors" per the fork's own doc.
cpu-moe               = true
# Bounds MoE pinned source/staging memory, NOT total RSS (per the fork's own
# doc). 2048 MiB matches their own conservative reference example; unverified
# against any model in this catalogue.
moe-expert-cache-host-pinned-mb = 2048
# Per-model override in models-preset-32gb.ini; no safe single default given
# how much expert_used_count varies across this catalogue (4 to 10). Left
# unset here deliberately -- every model entry sets its own.
# moe-expert-cache-size = <see models-preset-32gb.ini>
# See the matching comment in 16gb.ini: caps runaway reasoning at 8,000
# thinking tokens instead of letting a stuck turn run to maxTokens with no
# work done.
reasoning-budget         = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
