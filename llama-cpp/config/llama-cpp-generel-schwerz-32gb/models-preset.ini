; Canonical catalogue for the GenerelSchwerz MoE-cache 32GB (two-GPU) router.
; Same last-resort rule as models-preset-16gb.ini: a model belongs here only
; if it's a genuine MoE that does NOT fit within this host's combined 32 GiB
; of VRAM (so an ordinary dual-GPU split on the plain llama-cpp service
; can't hold it), and only if this fork can actually place its experts.
; Anything that fits within 32 GiB belongs on the plain llama-cpp service
; with an ordinary GPU split instead -- simpler, no host-RAM dependency.
;
; This service builds from codex/moe-grouped-multigpu (0ed73d1c9), NOT the
; 16GB service's qwen4exp-mtp pin (see docker-compose.yml, issue #90). Real
; constraints that commit imposes, reflected below:
;
; 1. `load-mode = none` is REQUIRED, not mmap -- the fork's own doc: "Bounded
;    pinning with the default mmap load was rejected before inference
;    because read-only auxiliary registration is unsupported." Every model
;    here uses the [*] default; none may override to mmap.
; 2. Because of (1), Qwen3.8-Flash-Next is NOT in this catalogue -- its PLE
;    table depends on mmap + lazy-mode to stay off host RAM (see
;    models-preset-16gb.ini); without mmap it would eagerly load its full
;    ~84 GiB, which this host cannot absorb regardless of the multi-GPU
;    cache. Use the 16GB service for Flash Next instead -- this branch's
;    benefit is layer-split placement, not a shared cross-GPU pool, so it
;    gains nothing here anyway.
; 3. Decode-only benefit at this stage ("Stage A") -- prefill still runs the
;    fork's older single-device path regardless of this config.
; 4. moe-expert-cache-size below is NOT tuned -- this whole profile has
;    never been run successfully. Each value is ~2x the model's real
;    expert_used_count (gguf metadata unless noted), mirroring the fork's
;    own conservative reference ratio (16 slots for Gemma-4-26B-A4B's 8
;    active) -- the fork author's own doc calls that example "a
;    conservative starting configuration, not a measured optimum or a fit
;    guarantee." Treat every number here the same way.
;
; Unlike models-preset-16gb.ini, n-gpu-layers/fit/cpu-moe are NOT set per
; model here -- they're global in config.ini, because grouped layer-split
; placement needs every layer eligible for GPU placement, not the mixed
; host/GPU split the 16GB single-device cache uses.
version = 1

[*]
ctx-size = 65536
parallel = 1

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
; 512 experts, 10 active.
moe-expert-cache-size = 20

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
; Same base architecture as Coder-Next: 512 experts, 10 active.
moe-expert-cache-size = 20

[gpt-oss-120b-Q4_K_M]
model = /models/unsloth--gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf
; 128 experts, 4 active (gguf metadata).
; Explicitly retain the embedded Harmony Jinja template and use OpenAI's
; high-effort, full-distribution sampling configuration.
jinja = true
reasoning-format = auto
reasoning-effort = high
temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
moe-expert-cache-size = 8

[Llama-4-Scout-17B-16E-Instruct-Q4_K_M]
model = /models/unsloth--Llama-4-Scout-17B-16E-Instruct-GGUF/Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf
; Only 16 total experts, 1 routed + 1 shared active -- large experts
; (~3.7 GiB each, estimated). The fork's doc names this model explicitly as
; unvalidated for real multi-GPU throughput ("no throughput improvement or
; optimal split ratio is claimed without measurement") -- the most
; speculative entry in this file.
moe-expert-cache-size = 3

[GLM-4.5-Air-UD-Q4_K_XL]
model = /models/unsloth--GLM-4.5-Air-GGUF/UD-Q4_K_XL/GLM-4.5-Air-UD-Q4_K_XL-00001-of-00002.gguf
; 128 experts, 8 active + 1 shared (published config; not yet confirmed
; against gguf metadata).
moe-expert-cache-size = 16
