; Sparse override source for the GPU llama.cpp router (compose service
; llama-cpp, port 11436, gpus: all). Generate the runtime preset under
; /mnt/work/llama/llama-cpp with generate-models-preset.py. See the CPU template
; for the CPU-only router's counterpart -- the two diverged 2026-09-17 and
; and fork service templates in their own config directories.
; Do not add a section merely to make a model visible: the generator discovers
; every model under MODEL_ROOT and supplies a basic entry for those models.
version = 1

[*]
; A single interactive client gets the complete context. Compose supplies the
; common CUDA and fit settings. Keeping cache defaults here permits deliberate
; per-model cache overrides below.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; Embedding models have smaller native contexts and are intended for
; /v1/embeddings.
[Qwen3-Embedding-0.6B-Q8_0]
model = /models/Qwen--Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
ctx-size = 32768

[embeddinggemma-300M-Q8_0]
model = /models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
ctx-size = 2048

; Older coding models were trained for 16K rather than the catalogue default.
[codellama-13b-instruct.Q4_0]
model = /models/TheBloke--CodeLlama-13B-Instruct-GGUF/codellama-13b-instruct.Q4_0.gguf
ctx-size = 16384

[magicoder-s-ds-6.7b.Q4_0]
model = /models/TheBloke--Magicoder-S-DS-6.7B-GGUF/magicoder-s-ds-6.7b.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_0]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_K_M]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_K_M.gguf
ctx-size = 16384

[starcoder2-15b-instruct.Q4_0]
model = /models/bartowski--starcoder2-15b-instruct-GGUF/starcoder2-15b-instruct-Q4_0.gguf
ctx-size = 16384

; Large dense models need VRAM headroom for CUDA workspaces and KV cache.
; Let --fit choose their partial GPU placement and begin at a short context.
[Llama-3.3-70B-Instruct-Q3_K_M]
model = /models/bartowski--Llama-3.3-70B-Instruct-GGUF/Llama-3.3-70B-Instruct-Q3_K_M.gguf
ctx-size = 8192
n-gpu-layers = auto

[Qwen2.5-72B-Instruct-Q3_K_S]
model = /models/second-state--Qwen2.5-72B-Instruct-GGUF/Qwen2.5-72B-Instruct-Q3_K_S.gguf
ctx-size = 8192
n-gpu-layers = auto

; Earlier Qwen coder releases have a 32K native context.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 32768

; These two 46 GiB sparse models run CPU-only. Q4 V reduces cache bandwidth
; and memory pressure while retaining Q8 keys for long-context quality.
[Qwen3-Coder-Next-Q4_K_M]
model = /models/Qwen--Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q4_0

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q4_0

; Nemotron 3.5 Lightning uses its published MTP sidecar for speculative decode.
[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-draft-model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/mtp-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-type = draft-mtp
ctx-size = 262144

; At 64K, this dense 70B model's Q8 K/V cache is about 10 GiB. Retain Q8 K
; but use Q4 V to recover headroom for the host and interactive desktop.
[DeepSeek-R1-Distill-Llama-70B-Q4_K_M]
model = /models/unsloth--DeepSeek-R1-Distill-Llama-70B-GGUF/DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0
reasoning = off
reasoning-budget = 0

# 2026-09-15 reliability review: applied the same reasoning-budget fix used
# on the generel-schwerz 16gb/32gb services (see their config.ini) to all
# three 27B variants, for consistency -- the runaway-reasoning failure mode
# it guards against (a session_analysis.py-confirmed real risk: 246,060
# reasoning characters against 606 characters of actual answer text in one
# 2026-09-15 Flash Next turn) is a property of the chat template/sampling
# behaviour, not specific to one model or fork.
[Qwen3.8-27B-UD-Q4_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072
split-mode = tensor

[Qwen3.8-27B-UD-Q5_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072
split-mode = tensor

[Qwen3.8-27B-UD-Q6_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_M.gguf
reasoning-effort = low
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 163840
split-mode = tensor

[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

# 2026-09-17: added for amiga-ui coding-agent use, split across both GPUs.
# NOT split-mode=tensor like the 27B entries above -- tried that first and it
# fails outright: "LLAMA_SPLIT_MODE_TENSOR not implemented for architecture
# 'deepseek2'" (confirmed via a real load attempt, not assumed). This is a
# hard architecture limitation in this stock llama.cpp build, not a
# resource/context problem -- deepseek2 (which GLM-4.7-Flash uses) simply
# doesn't support tensor-split here. split-mode=layer is the real mechanism
# for spreading this specific model across both GPUs; `--fit on` (this
# service's own compose-level default) handles the actual per-GPU layer
# balancing. GLM-4.7-Flash is reasoning-capable (confirmed via its own chat
# template: real reasoning_content/enable_thinking support, same as Flash
# Next) and has an unusually cheap KV cache for its size
# (attention.head_count_kv = 1). ctx-size below is confirmed by a real load
# + request, not a guess -- see performance-findings.md for the test that
# established it.
[GLM-4.7-Flash-Q4_K_M]
model = /models/unsloth--GLM-4.7-Flash-GGUF/GLM-4.7-Flash-Q4_K_M.gguf
reasoning-effort = low
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 202752
split-mode = layer

# 2026-09-17: single-GPU-pinned variant at 128K, for running alongside the
# 16GB schwerz service without VRAM contention -- pinned here to GPU 0.
# split-mode=none + main-gpu is the real mechanism (this router exposes both
# cards via `gpus: all`; without this, stock llama.cpp's default split-mode
# spreads a model across every visible GPU, which is what the un-pinned
# gpt-oss-20b-F16 entry above actually does despite not looking dual-GPU at
# a glance). Distinct alias since a model section can't be both split and
# single-GPU-pinned at once.
#
# 2026-09-17, corrected same day: originally pinned to GPU 1 on the
# assumption that the schwerz service occupies GPU 0 (the compose file's
# *default* for GS_LLAMA_CPP_16GB_CUDA_VISIBLE_DEVICES). That default is
# overridden in this deployment's untracked .env to `1` -- schwerz actually
# runs on GPU 1, confirmed via `docker exec llama-cpp-generel-schwerz-16gb-c
# env`. The wrong assumption went unnoticed until real contention surfaced:
# an orphaned Qwen3-Coder-Next process from a disrupted schwerz session sat
# on GPU 1 for 28 minutes after its session ended and blocked unrelated
# loads pinned there. Check the actual running container's env, not the
# compose file's default, before pinning anything "to avoid" another
# service again.
[gpt-oss-20b-F16-1gpu]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072
split-mode = none
main-gpu = 0

# No single-GPU Qwen3.8-27B variant: tried Q4_K_M (the smallest of the three
# quants) at both 131072 and 32768 ctx, pinned to one card -- both failed
# with a genuine CUDA OOM allocating the KV buffer (1088 MiB at 32768 ctx),
# meaning the dense weights alone consume at least ~15.2 GiB of the 16 GiB
# card before any context is allocated at all. This is a real capacity
# ceiling, not a context-size tuning problem: no quant of this model fits
# solo on one 16 GiB card, Q4_K_M included. The three dual-GPU entries above
# remain the only way to run this model family here.

# 2026-09-17: four MoE models moved here from the 16GB/32GB schwerz services
# after they were trimmed to a strict >32 GiB last-resort catalogue -- these
# four (17.3-20.5 GiB) fit within 32 GiB combined but not on one 16 GiB card
# whole, so `--n-cpu-moe N` (this build's stock offload flag, confirmed via
# `llama-server --help` -- NOT the schwerz fork's CUDA expert-cache, this is
# the plain llama-cpp service) keeps the first N layers' expert tensors on
# host RAM while everything else -- attention, embeddings, norms, and every
# other layer's experts -- stays GPU-resident. All four pinned to GPU 1
# (split-mode=none), same convention as gpt-oss-20b-F16-1gpu above, so they
# can run alongside the 16GB schwerz service without VRAM contention.
#
# n-cpu-moe values below were corrected after a real load test: the first
# pass targeted a ~13.25 GiB GPU-resident weight budget, and every one of
# the four failed with a genuine CUDA OOM trying to allocate that weight
# buffer alone (~13.2-13.3 GiB requested, device already too full) -- 2.5-
# 3 GiB left for KV cache + CUDA workspace was not enough margin in
# practice. Retargeted to an ~11.5 GiB GPU-resident weight budget instead
# (still calculated the same way: (file size - target) / file size, applied
# to each model's real block_count, rounded up), and ctx-size dropped to
# 16384 to shrink the KV/workspace demand further for this retest.
#
# 2026-09-17: all four confirmed working with real load + request at these
# values (Ornith-1.5-35B, the largest, used 11,357/16,311 MiB on GPU 0 --
# ~5 GiB real headroom, more than the conservative target predicted). Also
# corrected the pin from GPU 1 to GPU 0 for the real reason -- see the
# gpt-oss-20b-F16-1gpu comment above and performance-findings.md. Native
# context is 262144 (confirmed via GGUF metadata) for all four, so there is
# real, now-verified headroom to raise ctx-size above 16384 -- not yet done.

[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
model = /models/unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
; 17.3 GiB, 48 layers, 128 experts/8 active. Smallest of the four -- also
; the weakest on independent benchmarks (Artificial Analysis Intelligence
; Index 10, "below average for the current field"); kept for completeness,
; not a first choice for agentic work.
ctx-size = 16384
split-mode = none
main-gpu = 0
n-gpu-layers = all
n-cpu-moe = 18

[Qwen3.6-35B-A3B-Q4_K_M]
model = /models/infatoshi--Qwen3.6-35B-A3B--Q4_K_M/Qwen3.6-35B-A3B-Q4_K_M.gguf
; 19.7 GiB, 40 layers, 256 experts/8 active. Real benchmarks: 73.4%
; SWE-bench Verified, Terminal-Bench 2.0 51.5 -- a real generation ahead of
; Qwen3-Coder-30B-A3B above despite the unversioned/3.6 naming similarity.
ctx-size = 16384
split-mode = none
main-gpu = 0
n-gpu-layers = all
n-cpu-moe = 19

[Qwen3.5-35B-A3B-Q4_K_M]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-Q4_K_M.gguf
; 20.5 GiB, 40 layers, 256 experts/8 active. Natively multimodal
; (text/image/video); reported "comparable to Qwen3.5-27B" -- the
; predecessor generation to Qwen3.6 above for text/coding work.
ctx-size = 16384
split-mode = none
main-gpu = 0
n-gpu-layers = all
n-cpu-moe = 20

[Ornith-1.5-35B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
; 20.2 GiB, 41 layers, 256 experts/8 active. Self-improving training loop
; (generates its own tasks/scaffolds/rollouts); independently benchmarked
; ahead of Qwen3.6-35B-A3B on coding/agentic tasks -- the best first choice
; of these four for agentic coding/code review. Also the model the schwerz
; fork's own multi-GPU doc validated on real hardware (39.6 tok/s
; equal-split), a real external reference point if compared against.
ctx-size = 16384
split-mode = none
main-gpu = 0
n-gpu-layers = all
n-cpu-moe = 20
