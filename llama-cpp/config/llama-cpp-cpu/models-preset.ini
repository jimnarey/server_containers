; Sparse override source for the CPU-only llama.cpp router (compose service
; llama-cpp-cpu, no `gpus:` key, --n-gpu-layers 0 --fit on --fit-target
; ${LLAMA_CPP_CPU_FIT_TARGET:-1024} at the container level). Generate the
; deployed preset under /mnt/work/llama/llama-cpp-cpu with generate-models-preset.py.
; Do not add a section merely to make a model visible: the generator discovers
; every model under MODEL_ROOT and supplies a basic entry for those models.
;
; 2026-09-17: split out of the formerly-shared models-preset.ini (see
; the llama-cpp template for the GPU-service counterpart).
; Until this date, the CPU service ran an untracked, generated-only preset
; that had silently drifted out of sync with the GPU source -- it still had
; split-mode=tensor on the 27B Qwen entries (meaningless on a service with no
; CUDA devices passed through) and predated the reasoning-budget fix applied
; to those entries. This file is the real, tracked CPU template; the deployed
; copy under /mnt/work/llama/llama-cpp-cpu must be regenerated from it, not hand-
; edited. GPU-only directives (split-mode, main-gpu, tensor-split, n-gpu-
; layers=auto for partial GPU offload) do not belong here. Both source files
; now live together in this directory, same pattern as generel-schwerz-
; llama-cpp/config's models-preset-16gb.ini/models-preset-32gb.ini pair.
version = 1

[*]
; Explicit even though the compose-level --n-gpu-layers 0 already forces
; this: self-documents the file's intent and does not depend on that compose
; flag continuing to be set the same way in future.
ctx-size = 65536
parallel = 1
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q8_0

; Embedding models have smaller native contexts and are intended for
; /v1/embeddings.
[Qwen3-Embedding-0.6B-Q8_0]
model = /models/Qwen--Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
ctx-size = 32768

[embeddinggemma-300M-Q8_0]
model = /models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
ctx-size = 2048

; Older coding models were trained for 16K rather than the catalogue default.
[codellama-13b-instruct.Q4_0]
model = /models/TheBloke--CodeLlama-13B-Instruct-GGUF/codellama-13b-instruct.Q4_0.gguf
ctx-size = 16384

[magicoder-s-ds-6.7b.Q4_0]
model = /models/TheBloke--Magicoder-S-DS-6.7B-GGUF/magicoder-s-ds-6.7b.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_0]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_K_M]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_K_M.gguf
ctx-size = 16384

[starcoder2-15b-instruct.Q4_0]
model = /models/bartowski--starcoder2-15b-instruct-GGUF/starcoder2-15b-instruct-Q4_0.gguf
ctx-size = 16384

; These two dense models get partial GPU offload (n-gpu-layers=auto) on the
; GPU service. No GPU is passed through here, so there is nothing to offload
; to -- a short context is the only real lever on this host for a 70B/72B
; dense model running fully on CPU.
[Llama-3.3-70B-Instruct-Q3_K_M]
model = /models/bartowski--Llama-3.3-70B-Instruct-GGUF/Llama-3.3-70B-Instruct-Q3_K_M.gguf
ctx-size = 8192

[Qwen2.5-72B-Instruct-Q3_K_S]
model = /models/second-state--Qwen2.5-72B-Instruct-GGUF/Qwen2.5-72B-Instruct-Q3_K_S.gguf
ctx-size = 8192

; Earlier Qwen coder releases have a 32K native context.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 32768

; These two 46 GiB sparse models were always intended to run here rather
; than the GPU service. Q4 V reduces cache bandwidth and memory pressure
; while retaining Q8 keys for long-context quality.
[Qwen3-Coder-Next-Q4_K_M]
model = /models/Qwen--Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

; CPU-specific Nemotron 3.5 Lightning config -- deliberately different from
; the dual-GPU entry in ../llama-cpp/models-preset.ini, not a copy of it:
;
; - No spec-draft-model/spec-type here. The published MTP sidecar buys a
;   free second forward pass per candidate token on a GPU with slack compute;
;   on CPU that second pass has real, non-negligible cost, and there's no
;   measurement yet of the acceptance rate for this hybrid SSM/attention
;   architecture (nemotron_h_moe) under CPU threading to say it nets out
;   positive. Start without it; treat re-adding it as a follow-up experiment
;   once the base config is confirmed working, not a default.
;
; - ctx-size = 131072 is a reasoned starting point, NOT a tested figure like
;   the GPU service's 262144 (that one was verified against real nvidia-smi
;   headroom). Reasoning: the model file itself is only ~18 GiB (vs. the
;   46 GiB Qwen3-Coder-Next/Qwen3-Next-80B entries above, which run at
;   65536 on this same host), and most of this model's layers are Mamba/SSM
;   with fixed-size state rather than full attention, so its KV cache should
;   grow with context far more slowly than a comparable dense transformer's.
;   ~55 GiB was free (via `free -h`) at the time this was written, well
;   above weights + a generous cache allowance at this context. Verify with
;   a real load + request before trusting this, per this repo's established
;   practice -- raise it incrementally (native context is 1,048,576) rather
;   than jumping straight to the max on an untested config.
[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q4_0

; At 64K, this dense 70B model's Q8 K/V cache is about 10 GiB. Retain Q8 K
; but use Q4 V to recover headroom for the host and interactive desktop.
[DeepSeek-R1-Distill-Llama-70B-Q4_K_M]
model = /models/unsloth--DeepSeek-R1-Distill-Llama-70B-GGUF/DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0
reasoning = off
reasoning-budget = 0

; 2026-09-15 reliability review: same reasoning-budget fix as the GPU
; service's matching entries -- the runaway-reasoning failure mode it guards
; against is a property of the chat template/sampling behaviour, not
; specific to one model, fork, or hardware placement. No split-mode here:
; that directive only means something with CUDA devices passed through.
[Qwen3.8-27B-UD-Q4_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072

[Qwen3.8-27B-UD-Q5_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072

[Qwen3.8-27B-UD-Q6_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_M.gguf
reasoning-effort = low
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 163840

[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

; GLM-4.7-Flash and the two single-GPU-pinned aliases from the GPU service
; are deliberately absent here: the pinned aliases only mean something with
; CUDA devices, and GLM-4.7-Flash's dual-GPU split entry doesn't apply on a
; CPU-only router either -- it falls through to a plain default entry via
; the generator's catch-all, same as any other undiscovered-override model.
;
; Qwen3.8-Flash-Next-UD-Q3_K_XL (84 GiB on disk) is also deliberately absent:
; it does not fit in this host's ~55 GiB available RAM at any context size,
; unlike the MoE-cache services which page routed experts through CUDA. An
; entry for it here would just be a config that can never actually load.
