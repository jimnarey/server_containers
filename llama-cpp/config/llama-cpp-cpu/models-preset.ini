; Explicit catalogue for the CPU-only llama.cpp router (compose service
; llama-cpp-cpu, no `gpus:` key, --n-gpu-layers 0 --fit on --fit-target
; ${LLAMA_CPP_CPU_FIT_TARGET:-1024} at the container level). Generate the
; deployed preset under /mnt/work/llama/llama-cpp-cpu with
; generate-models-preset.py --preset-only, which validates the /models
; paths referenced below but does NOT discover or add any other model on
; disk -- this service is curated-only, not full-catalogue, same pattern
; as the schwerz/csantiago78 fork services.
;
; 2026-09-18: switched from full-discovery mode to --preset-only and
; trimmed to just the small models below plus the two real, CPU-tested
; >32 GiB MoE models documented in performance-findings.md, after a real
; near-miss: full-discovery mode had silently made an 84 GiB model
; selectable despite a comment claiming it was absent (the tool has no
; exclude mechanism -- omitting a model from this file does not stop
; discovery from adding it back as a catch-all), and a live test of one of
; the then-included dense 70B entries drove host swap to 7.7/8 GiB before
; being stopped manually. Every dense 70B-class entry that was here
; (Qwen2.5-72B-Instruct-Q3_K_S, Llama-3.3-70B-Instruct-Q3_K_M,
; DeepSeek-R1-Distill-Llama-70B-Q4_K_M), the untested Nemotron 3.5
; Lightning entry, the non-MoE gpt-oss-20b-F16 entry, and the CPU-unsafe
; Qwen3.8-Flash-Next-UD-Q3_K_XL entry (see performance-findings.md for the
; full incident writeup) are removed rather than carried forward -- add
; something back here only once it has a real, documented CPU test result,
; not a size estimate.
;
; This file used to be a sparse override source for full-discovery mode
; (see git history / performance-findings.md for that era); GPU-only
; directives (split-mode, main-gpu, tensor-split, n-gpu-layers=auto for
; partial GPU offload) still do not belong here.
version = 1

[*]
; Explicit even though the compose-level --n-gpu-layers 0 already forces
; this: self-documents the file's intent and does not depend on that compose
; flag continuing to be set the same way in future.
ctx-size = 65536
parallel = 1
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q8_0

; The two real, CPU-tested >32 GiB MoE models -- see performance-findings.md
; ("Resource usage by model/service" table and the CPU-only section) for
; the actual measured RAM/decode figures (37 GiB RAM, 9.17-13.33 and
; 9.98-13.24 tok/s decode respectively). Both real MoE architectures, where
; only a small fraction of experts activate per token -- the reason these
; work at all on CPU despite their size, unlike a dense model of comparable
; weight.
[Qwen3-Coder-Next-Q4_K_M]
model = /models/Qwen--Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

; Five small chat-capable models added for CPU testing -- real on-disk
; sizes (2.8-5.4 GiB) are an order of magnitude smaller than anything else
; in this file, so RAM is not a real concern for any of them; ctx-size
; left at a generous, not-yet-tested value given the large margin, cache
; types left at the [*] q8_0/q8_0 default rather than the q4_0-V trims
; used above (no bandwidth/memory pressure to trade away here).
; gemma-3n-E2B-it confirmed working with a real request.
[gemma-3n-E2B-it]
model = /models/unsloth--gemma-3n-E2B-it-GGUF/gemma-3n-E2B-it-Q4_K_M.gguf
ctx-size = 32768

[gemma-3n-E4B-it]
model = /models/unsloth--gemma-3n-E4B-it-GGUF/gemma-3n-E4B-it-Q4_K_M.gguf
ctx-size = 32768

[NVIDIA-Nemotron-3-Nano-4B]
model = /models/unsloth--NVIDIA-Nemotron-3-Nano-4B-GGUF/NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
ctx-size = 32768

[Qwen3.5-9B]
model = /models/unsloth--Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 32768

[Ornith-1.5-9B]
model = /models/ornith-ai--Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 32768
