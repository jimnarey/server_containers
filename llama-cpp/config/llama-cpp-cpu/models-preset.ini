; Explicit catalogue for the CPU-only llama.cpp router (compose service
; llama-cpp-cpu, no `gpus:` key, --n-gpu-layers 0 --fit on --fit-target
; ${LLAMA_CPP_CPU_FIT_TARGET:-1024} at the container level). Generate the
; directly mounted by the CPU profile with
; generate-models-preset.py --preset-only, which validates the /models
; paths referenced below but does NOT discover or add any other model on
; disk -- this service is curated-only, same pattern as the schwerz/
; csantiago78 fork services.
;
; Kept to --preset-only rather than full-discovery deliberately: discovery
; mode has no exclude mechanism, so omitting a model here does not stop it
; being added back as a catch-all -- full-discovery once silently made an
; 84 GiB model selectable this way, and a live test of a dense 70B entry
; drove host swap to 7.7/8 GiB before being stopped manually. Add a model
; back here only once it has a real, documented CPU test result, not a
; size estimate. GPU-only directives (split-mode, main-gpu, tensor-split,
; n-gpu-layers=auto for partial offload) don't belong in this file.
version = 1

[*]
; Explicit even though the compose-level --n-gpu-layers 0 already forces
; this: self-documents the file's intent independent of that compose flag.
ctx-size = 65536
parallel = 1
; Kept in the preset rather than the server command so a model-specific
; Harmony `reasoning-format = auto` can override it where needed.
reasoning-format = deepseek
n-gpu-layers = 0
cache-type-k = q8_0
cache-type-v = q8_0

; Two real, CPU-tested >32 GiB MoE models -- 9.17-13.33 and 9.98-13.24
; tok/s decode, 37 GiB RAM each (see performance-findings.md). Real MoE
; architectures, where only a small fraction of experts activate per
; token -- the reason these work at all on CPU despite their size, unlike
; a dense model of comparable weight.
[Qwen3-Coder-Next-Q4_K_M]
model = /models/Qwen--Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q4_0

; Dense (not MoE), 13.35 GiB each. On llama-cpp-16gb this model needs a
; second GPU's worth of headroom to reach a useful context -- CPU is the
; other real option, since RAM here (50+ GiB free) isn't the constraint
; dense weights + KV at 65536 would face on one card. Not yet load-tested
; on this service.
[Devstral-Small-2-24B-Instruct-2512-Q4_K_M]
model = /models/unsloth--Devstral-Small-2-24B-Instruct-2512-GGUF/Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
; Same Mistral 55c5b41 override as the dual-GPU variants: the GGUF's
; embedded template rejects valid agentic tool-result conversation turns.
chat-template-file = /opt/llama-cpp/chat-templates/devstral-small-2-24b-instruct-2512.jinja
ctx-size = 65536

[Devstral-Small-2505-Q4_K_M]
model = /models/unsloth--Devstral-Small-2505-GGUF/Devstral-Small-2505-Q4_K_M.gguf
ctx-size = 65536

; Five small chat-capable models -- real sizes (2.8-5.4 GiB) are an order
; of magnitude smaller than anything else in this file, so RAM is not a
; real concern; cache types left at the [*] q8_0/q8_0 default rather than
; the q4_0-V trims above (no bandwidth/memory pressure to trade away
; here). Gemma uses its real 32768-token training ceiling -- a 65536
; request is silently capped by llama.cpp.
[gemma-3n-E2B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E2B-it-GGUF/gemma-3n-E2B-it-Q4_K_M.gguf
ctx-size = 32768

[gemma-3n-E4B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E4B-it-GGUF/gemma-3n-E4B-it-Q4_K_M.gguf
ctx-size = 32768

[NVIDIA-Nemotron-3-Nano-4B-Q4_K_M]
model = /models/unsloth--NVIDIA-Nemotron-3-Nano-4B-GGUF/NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
ctx-size = 65536

[Qwen3.5-9B-Q4_K_M]
model = /models/unsloth--Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 65536

[Ornith-1.5-9B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 65536
