; Explicit catalogue for the two one-physical-GPU upstream-llama.cpp
; services: llama-cpp-gpu-0 (port 11441) and llama-cpp-gpu-1 (port 11442).
; Generate the deployed preset with generate-models-preset.py --preset-only,
; which validates the /models paths referenced below but does NOT discover
; or add any other model on disk -- this service is curated-only, not
; full-catalogue. This is intentionally separate from the all-GPU service's
; 32GB catalogue -- see ../llama-cpp-32gb/models-preset.ini.
;
; Each service reserves exactly one physical GPU at the Docker level
; (`gpus.device_ids`, confirmed via `docker exec <container> nvidia-smi`).
; Exactly one GPU is visible inside either container, so model sections do
; not need split-mode/main-gpu pinning: CUDA device 0 is always its sole card.
;
; 2026-09-18: pruned to only models proven to work on one card (real load
; test this session) or known to (small enough that it was never in
; question -- the older, small coding/embedding models below, downloaded
; before the second GPU existed and never re-tested since, but 0.3-8.4 GiB
; each against a 16.3 GiB card leaves no real doubt). Six entries removed,
; every one for a clear, specific reason, not a judgement call:
;   - Llama-3.3-70B-Instruct-Q3_K_M (32 GiB), Qwen2.5-72B-Instruct-Q3_K_S
;     (32 GiB), DeepSeek-R1-Distill-Llama-70B-Q4_K_M (39.6 GiB) -- dense,
;     nowhere close to fitting one 16 GiB card; the DeepSeek entry also
;     actually failed a real load test on the CPU service at a similar
;     scale (see performance-findings.md), reinforcing this is a real risk
;     class, not a theoretical one.
;   - Qwen3-Coder-Next-Q4_K_M, Qwen3-Next-80B-A3B-Instruct-Q4_K_M (45 GiB
;     each) -- real, CPU-tested MoE models (see llama-cpp-cpu's preset and
;     performance-findings.md), but their `n-gpu-layers=0` here meant they
;     ran 100% CPU-bound even on this GPU-locked service -- wasteful of a
;     scarce single-GPU-locked slot for a model that never touches the GPU
;     regardless of which service hosts it. Already correctly present in
;     llama-cpp-cpu; not duplicated here.
;   - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0 (17.6 GiB weight alone) --
;     never tested single-GPU (only proven on llama-cpp-all-gpus, both
;     cards), and its own weight size already exceeds one card's 16.3 GiB
;     capacity before any KV cache -- the same failure pattern already
;     proven for Qwen3.8-27B-UD-Q4_K_M below (15.2+ GiB weight alone left
;     under 1 GiB free). Not a borderline case: 17.6 > 16.3 outright.
; No genuinely borderline *capacity* cases -- every remaining entry below
; either fits with real headroom or is real-load-confirmed working. But
; the size-only argument for the untested "older, small" group was not
; sufficient on its own: a follow-up pass that actually sent a real
; request to every entry (not just checked file size/discovery) found two
; further problems in that group, both fixed in place --
; magicoder-s-ds-6.7b.Q4_0 removed entirely (unsupported tokenizer,
; unfixable by config) and embeddings=true added to both embedding
; entries (missing, causing one to reject every request and the other to
; crash outright). See performance-findings.md for the full writeup.
version = 1

[*]
; A single interactive client gets the complete context. Compose supplies the
; common CUDA and fit settings. Keeping cache defaults here permits deliberate
; per-model cache overrides below.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; 2026-09-18: `embeddings = true` added to both entries below after a real
; load test -- without it, Qwen3-Embedding-0.6B-Q8_0 loaded but rejected
; every /v1/embeddings request ("This server does not support embeddings.
; Start it with `--embeddings`"), and embeddinggemma-300M-Q8_0 crashed
; outright (`GGML_ASSERT(n_outputs_max <= cparams.n_outputs_max) failed`
; during encode) -- both are consequences of loading an embedding-only
; model in the server's default generative/causal mode. This was a real
; gap in the pre-existing config, not introduced by this pass -- caught
; only because this pass did a live request against every kept entry
; instead of trusting the discovery-time size/architecture check.
[Qwen3-Embedding-0.6B-Q8_0]
model = /models/Qwen--Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
ctx-size = 32768
embeddings = true

[embeddinggemma-300M-Q8_0]
model = /models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
ctx-size = 2048
embeddings = true

; Older coding models were trained for 16K rather than the catalogue default.
; Downloaded before the second GPU existed; small enough (3.6-8.4 GiB) that
; single-card fit was never in question, though none has a real load test
; from this session specifically.
[codellama-13b-instruct.Q4_0]
model = /models/TheBloke--CodeLlama-13B-Instruct-GGUF/codellama-13b-instruct.Q4_0.gguf
ctx-size = 16384

; 2026-09-18: removed -- real load test failed with "error loading model
; vocabulary: unknown tokenizer: 'deepseek_coder'". This build's llama.cpp
; does not support this old GGUF's tokenizer format; not a config problem,
; not fixable by any preset setting. Was in the "older, small, assumed
; safe by size" group this pass was specifically supposed to stop trusting
; without a real test -- the assumption held for every other model in that
; group (see the load tests recorded on each remaining entry below) except
; this one.

[wizardcoder-python-13b-v1.0.Q4_0]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_0.gguf
ctx-size = 16384

[wizardcoder-python-13b-v1.0.Q4_K_M]
model = /models/TheBloke--WizardCoder-Python-13B-V1.0-GGUF/wizardcoder-python-13b-v1.0.Q4_K_M.gguf
ctx-size = 16384

[starcoder2-15b-instruct.Q4_0]
model = /models/bartowski--starcoder2-15b-instruct-GGUF/starcoder2-15b-instruct-Q4_0.gguf
ctx-size = 16384

; Earlier Qwen coder releases have a 32K native context. Same "older, small,
; never re-tested but obviously fits" category as above (4.4-8.4 GiB).
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 32768

# 2026-09-15 reliability review: applied the same reasoning-budget fix used
# on the generel-schwerz 16gb/32gb services (see their config.ini) to all
# three 27B variants, for consistency -- the runaway-reasoning failure mode
# it guards against (a session_analysis.py-confirmed real risk: 246,060
# reasoning characters against 606 characters of actual answer text in one
# 2026-09-15 Flash Next turn) is a property of the chat template/sampling
# behaviour, not specific to one model or fork.
[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

# 2026-09-18: removed `gpt-oss-20b-F16-1gpu`, a split-mode=none/main-gpu=0
# duplicate of `gpt-oss-20b-F16` above, added back when GPU placement had to
# be pinned per-model on the single all-gpus-only service. Now that
# llama-cpp-gpu-0/llama-cpp-gpu-1 exist and enforce single-GPU placement at
# the Docker level (see the header comment), the same result -- this model
# alone on one specific physical GPU -- comes from choosing which service to
# deploy to, not from a separate pinned catalog entry. Use plain
# `gpt-oss-20b-F16` via whichever of gpu-0/gpu-1/all-gpus fits.
#
# (History: this entry was originally pinned to GPU 1 on the wrong
# assumption that the 16GB schwerz service occupies GPU 0 -- it's actually
# on GPU 1 per this deployment's .env. That mistake caused a real VRAM
# collision, found via an orphaned schwerz subprocess still holding GPU 1
# 28 minutes after its session ended; see performance-findings.md.)

# Q4_K_M/Q5_K_M/Q6_K_M (the three dense Unsloth Dynamic quants) do not fit
# solo on one 16 GiB card at any context -- confirmed by a real CUDA OOM
# allocating just the KV buffer for Q4_K_M, meaning the dense weights alone
# consume at least ~15.2 GiB before any context is allocated. The three
# dual-GPU entries in ../llama-cpp-32gb/models-preset.ini remain the only
# way to run those three quants.
#
# 2026-09-18: two real 3-bit Unsloth Dynamic v3.0 quants instead -- there is
# no literal "Q3_K_M" for this model; Unsloth ships UD-IQ3_XXS/UD-IQ3_S/
# UD-Q3_K_XL in that tier. Sized for single-GPU services (llama-cpp-gpu-0/
# llama-cpp-gpu-1), which enforce one physical GPU via Docker's own
# `gpus.device_ids` -- confirmed only one GPU is visible inside those
# containers, so no split-mode/main-gpu pinning is needed.
[Qwen3.8-27B-UD-IQ3_S]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 2026-09-18: 65536 confirmed working with 13,610 MiB used (2.7 GiB headroom
; on a 16,311 MiB card). 131072 (the KV-rate extrapolation's target) FAILED
; a real load: "allocating 720.28 MiB on device 0: cudaMalloc failed: out of
; memory" -- a small buffer late in loading, not the weights, so the flat
; ~600 MiB overhead assumed in that extrapolation undercounted something
; (likely a compute/graph buffer with its own context-dependent cost).
; Backed off by 32768 tokens and confirmed working by a real load: 14,858
; MiB used, 1,453 MiB headroom. Room may exist between here and 131072 but
; is unverified -- test incrementally rather than jump back to the failed
; value.
ctx-size = 98304

[Qwen3.8-27B-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 2026-09-18: 65536 confirmed working with 14,664 MiB used (1.6 GiB headroom
; on a 16,311 MiB card). 98304 (the KV-rate extrapolation's target) FAILED a
; real load: "allocating 560.28 MiB on device 0: cudaMalloc failed: out of
; memory" -- same class of shortfall as IQ3_S's failure at 131072 (a small
; late buffer, not the weights). Backed off to the already-confirmed-safe
; 65536, re-confirmed by a real load: 14,664 MiB used, 1,647 MiB headroom
; (unchanged from the original 65536 test). Room may exist between here and
; 98304 but is unverified -- test incrementally rather than jump back.
ctx-size = 65536

# 2026-09-17: four MoE models moved here from the 16GB/32GB schwerz services
# after they were trimmed to a strict >32 GiB last-resort catalogue -- these
# four (17.3-20.5 GiB) fit within 32 GiB combined but not on one 16 GiB card
# whole, so `--n-cpu-moe N` (this build's stock offload flag, confirmed via
# `llama-server --help` -- NOT the schwerz fork's CUDA expert-cache, this is
# the plain llama-cpp service) keeps the first N layers' expert tensors on
# host RAM while everything else -- attention, embeddings, norms, and every
# other layer's experts -- stays GPU-resident.
#
# n-cpu-moe values below were corrected after a real load test: the first
# pass targeted a ~13.25 GiB GPU-resident weight budget, and every one of
# the four failed with a genuine CUDA OOM trying to allocate that weight
# buffer alone (~13.2-13.3 GiB requested, device already too full) -- 2.5-
# 3 GiB left for KV cache + CUDA workspace was not enough margin in
# practice. Retargeted to an ~11.5 GiB GPU-resident weight budget instead
# (still calculated the same way: (file size - target) / file size, applied
# to each model's real block_count, rounded up), and ctx-size dropped to
# 16384 to shrink the KV/workspace demand further for this retest. All four
# confirmed working with real load + request at these values (Ornith-1.5-35B,
# the largest, used 11,357/16,311 MiB -- ~5 GiB real headroom, more than the
# conservative target predicted). Native context is 262144 (confirmed via
# GGUF metadata) for all four, so there is real, now-verified headroom to
# raise ctx-size above 16384 -- not yet done.
#
# 2026-09-18: removed each entry's split-mode=none/main-gpu=0 pin. These were
# needed only to force single-GPU placement on the single all-gpus-only
# service that existed at the time (17-18 Sept, before this refactor); since
# llama-cpp-gpu-0/llama-cpp-gpu-1 now exist and are single-GPU by Docker
# construction (see the header comment), the pin duplicated what the choice
# of service already guarantees.

[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
model = /models/unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
; 17.3 GiB, 48 layers, 128 experts/8 active. Smallest of the four -- also
; the weakest on independent benchmarks (Artificial Analysis Intelligence
; Index 10, "below average for the current field"); kept for completeness,
; not a first choice for agentic work.
ctx-size = 16384
n-gpu-layers = all
n-cpu-moe = 18

[Qwen3.6-35B-A3B-Q4_K_M]
model = /models/infatoshi--Qwen3.6-35B-A3B--Q4_K_M/Qwen3.6-35B-A3B-Q4_K_M.gguf
; 19.7 GiB, 40 layers, 256 experts/8 active. Real benchmarks: 73.4%
; SWE-bench Verified, Terminal-Bench 2.0 51.5 -- a real generation ahead of
; Qwen3-Coder-30B-A3B above despite the unversioned/3.6 naming similarity.
ctx-size = 16384
n-gpu-layers = all
n-cpu-moe = 19

[Qwen3.5-35B-A3B-Q4_K_M]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-Q4_K_M.gguf
; 20.5 GiB, 40 layers, 256 experts/8 active. Natively multimodal
; (text/image/video); reported "comparable to Qwen3.5-27B" -- the
; predecessor generation to Qwen3.6 above for text/coding work.
ctx-size = 16384
n-gpu-layers = all
n-cpu-moe = 20

[Ornith-1.5-35B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
; 20.2 GiB, 41 layers, 256 experts/8 active. Self-improving training loop
; (generates its own tasks/scaffolds/rollouts); independently benchmarked
; ahead of Qwen3.6-35B-A3B on coding/agentic tasks -- the best first choice
; of these four for agentic coding/code review. Also the model the schwerz
; fork's own multi-GPU doc validated on real hardware (39.6 tok/s
; equal-split), a real external reference point if compared against.
ctx-size = 16384
n-gpu-layers = all
n-cpu-moe = 20
