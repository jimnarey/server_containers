# free on a 16,311 MiB card), and 16384 -- while it works -- was judged too
# small a context to be useful. Since this model needs both this file's
# weight-splitting AND the extra headroom of a second card to reach a
# worthwhile context, it's a dual-GPU model on this hardware, not a
# single-GPU one -- moved to llama-cpp-32gb (split-mode=tensor, matching
# this file's own established bandwidth-doubling pattern for dense models)
# and llama-cpp-cpu instead. See performance-findings.md for the full
