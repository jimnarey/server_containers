; Explicit catalogue for the two one-physical-GPU upstream-llama.cpp
; services: llama-cpp-gpu-0 (port 11441) and llama-cpp-gpu-1 (port 11442).
; Generate the deployed preset with generate-models-preset.py --preset-only,
; which validates the /models paths referenced below but does NOT discover
; or add any other model on disk -- this service is curated-only, not
; full-catalogue. This is intentionally separate from the all-GPU service's
; 32GB catalogue -- see ../llama-cpp-32gb/models-preset.ini.
;
; Each service reserves exactly one physical GPU at the Docker level
; (`gpus.device_ids`, confirmed via `docker exec <container> nvidia-smi`).
; Exactly one GPU is visible inside either container, so model sections do
; not need split-mode/main-gpu pinning: CUDA device 0 is always its sole card.
;
; 2026-09-18: pruned to only models proven to work on one card (real load
; test this session) or known to (small enough that it was never in
; question -- the older, small coding/embedding models below, downloaded
; before the second GPU existed and never re-tested since, but 0.3-8.4 GiB
; each against a 16.3 GiB card leaves no real doubt). Six entries removed,
; every one for a clear, specific reason, not a judgement call:
;   - Llama-3.3-70B-Instruct-Q3_K_M (32 GiB), Qwen2.5-72B-Instruct-Q3_K_S
;     (32 GiB), DeepSeek-R1-Distill-Llama-70B-Q4_K_M (39.6 GiB) -- dense,
;     nowhere close to fitting one 16 GiB card; the DeepSeek entry also
;     actually failed a real load test on the CPU service at a similar
;     scale (see performance-findings.md), reinforcing this is a real risk
;     class, not a theoretical one.
;   - Qwen3-Coder-Next-Q4_K_M, Qwen3-Next-80B-A3B-Instruct-Q4_K_M (45 GiB
;     each) -- real, CPU-tested MoE models (see llama-cpp-cpu's preset and
;     performance-findings.md), but their `n-gpu-layers=0` here meant they
;     ran 100% CPU-bound even on this GPU-locked service -- wasteful of a
;     scarce single-GPU-locked slot for a model that never touches the GPU
;     regardless of which service hosts it. Already correctly present in
;     llama-cpp-cpu; not duplicated here.
;   - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0 (17.6 GiB weight alone) --
;     never tested single-GPU (only proven on llama-cpp-all-gpus, both
;     cards), and its own weight size already exceeds one card's 16.3 GiB
;     capacity before any KV cache -- the same failure pattern already
;     proven for Qwen3.8-27B-UD-Q4_K_M below (15.2+ GiB weight alone left
;     under 1 GiB free). Not a borderline case: 17.6 > 16.3 outright.
; No genuinely borderline *capacity* cases -- every remaining entry below
; either fits with real headroom or is real-load-confirmed working. But
; the size-only argument for the untested "older, small" group was not
; sufficient on its own: a follow-up pass that actually sent a real
; request to every entry (not just checked file size/discovery) found two
; further problems in that group, both fixed in place --
; magicoder-s-ds-6.7b.Q4_0 removed entirely (unsupported tokenizer,
; unfixable by config) and embeddings=true added to both embedding
; entries (missing, causing one to reject every request and the other to
; crash outright). See performance-findings.md for the full writeup.
;
; 2026-09-18, later the same day: both embedding entries (Qwen3-Embedding-
; 0.6B-Q8_0, embeddinggemma-300M-Q8_0) and the remaining 2023-era coding
; models (codellama-13b-instruct.Q4_0, both wizardcoder-python-13b-v1.0
; quants, starcoder2-15b-instruct.Q4_0) removed at the user's request, and
; their weight files deleted from disk entirely (~53 GiB freed) -- not
; just unlisted. Rationale: this service no longer offers any embeddings
; capability at all (there was no other embeddings-capable service in this
; deployment either), and the legacy coders were judged clearly outclassed
; by qwen2.5-coder-14b-instruct-q4_k_m and Qwen3-Coder-30B-A3B-Instruct
; already in this same preset on every modern coding benchmark -- kept
; only as unused disk space and a preset slot, not a real option. Two real
; Devstral quants added in their place -- see their own entries below.
version = 1

[*]
; A single interactive client gets the complete context. Compose supplies the
; common CUDA and fit settings. Keeping cache defaults here permits deliberate
; per-model cache overrides below.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; 2026-09-18: this file used to carry Qwen3-Embedding-0.6B-Q8_0 and
; embeddinggemma-300M-Q8_0 (with `embeddings = true`, fixed the same day
; after a real load test caught both rejecting/crashing on
; /v1/embeddings) and four 2023-era coding models (codellama-13b-
; instruct.Q4_0, magicoder-s-ds-6.7b.Q4_0 -- removed earlier the same day
; for an unfixable tokenizer incompatibility, both wizardcoder-
; python-13b-v1.0 quants, starcoder2-15b-instruct.Q4_0). All removed at
; the user's request later the same day, weight files deleted from disk
; entirely (~53 GiB) -- this service now has no embeddings capability at
; all, and the remaining coding models below (qwen2.5-coder-*, Devstral,
; Qwen3-Coder-30B-A3B-Instruct) are judged to outclass what was removed on
; every modern coding benchmark. See the header comment and
; performance-findings.md for the full history.
;
; Earlier Qwen coder releases have a 32K native context.
;
; 2026-09-19: confirmed via the real upstream HF config.json (Qwen2.5-Coder-
; 14B-Instruct): max_position_embeddings=32768, no rope_scaling block. The
; GGUF's own embedded context_length metadata (131072) is NOT authoritative
; here -- it does not match the real trained window. ctx-size on every
; entry below had been raised to 65536 (2x native) with no rope-scaling
; configured; the real load tests that passed only sent trivial short
; prompts (a few tokens), which says nothing about coherence once actual
; usage reaches past position 32768 -- llama.cpp's undocumented implicit
; default in that situation is a plain linear RoPE scale, a materially
; worse extrapolation than YaRN. rope-scaling=yarn + yarn-orig-ctx=32768
; added to every entry below to make the extension explicit and use the
; better-supported method instead of relying on an implicit default.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

