; Explicit catalogue for the two one-physical-GPU upstream-llama.cpp
; services: llama-cpp-gpu-0 (port 11441) and llama-cpp-gpu-1 (port 11442).
; Deploy with generate-models-preset.py --preset-only (validates paths only,
; no full-catalogue discovery). Separate from the all-GPU service's 32GB
; catalogue -- see ../llama-cpp-32gb/models-preset.ini.
;
; Each service is pinned to one physical GPU at the Docker level
; (gpus.device_ids); model sections don't need split-mode/main-gpu pinning.
;
; Models kept off this catalogue, and why:
;   - Llama-3.3-70B-Instruct-Q3_K_M, Qwen2.5-72B-Instruct-Q3_K_S,
;     DeepSeek-R1-Distill-Llama-70B-Q4_K_M -- dense, 32-40 GiB, nowhere
;     close to fitting one 16 GiB card.
;   - Qwen3-Coder-Next-Q4_K_M, Qwen3-Next-80B-A3B-Instruct-Q4_K_M -- CPU-only
;     (n-gpu-layers=0); belong on llama-cpp-cpu, not a GPU-locked slot.
;   - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0 -- 17.6 GiB weight alone
;     exceeds one card's 16.3 GiB before any KV cache.
;   - magicoder-s-ds-6.7b.Q4_0 -- unsupported tokenizer, unfixable by config.
;   - Embeddings (Qwen3-Embedding-0.6B-Q8_0, embeddinggemma-300M-Q8_0) and
;     four 2023-era coding models (codellama-13b, wizardcoder-python-13b x2,
;     starcoder2-15b) -- removed at the user's request, weight files deleted
;     (~53 GiB); the qwen2.5-coder/Devstral/Qwen3-Coder-30B-A3B entries below
;     outclass them, and this service no longer offers embeddings at all.
version = 1

[*]
; A single interactive client gets the complete context.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; Qwen2.5-Coder's real native context is 32768 (HF config.json:
; max_position_embeddings, no rope_scaling) -- the GGUF's own
; context_length=131072 metadata is not authoritative. rope-scaling=yarn +
; yarn-orig-ctx=32768 set explicitly below rather than relying on
; llama.cpp's implicit (and worse) linear-scale default.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

; Higher quants of the two entries above, using the headroom Q4_K_M leaves.
; Q6_K is the largest 14b quant that fits solo on one card; Q8_0 (14.62 GiB)
; needs both cards -- see llama-cpp-32gb.
[qwen2.5-coder-7b-instruct-q8_0]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q8_0.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q5_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q5_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q6_k]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q6_k.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

; Small enough to run wholly on one GPU. Gemma capped at 32768 (its trained
; limit, llama.cpp clamps any higher request); the rest run at 65536.
[gemma-3n-E2B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E2B-it-GGUF/gemma-3n-E2B-it-Q4_K_M.gguf
ctx-size = 32768

[gemma-3n-E4B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E4B-it-GGUF/gemma-3n-E4B-it-Q4_K_M.gguf
ctx-size = 32768

[NVIDIA-Nemotron-3-Nano-4B-Q4_K_M]
model = /models/unsloth--NVIDIA-Nemotron-3-Nano-4B-GGUF/NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
ctx-size = 65536

[Ornith-1.5-9B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 65536

[Qwen3.5-9B-Q4_K_M]
model = /models/unsloth--Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 65536

; DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M removed -- needs more context than
; one 16 GiB card can give with real margin (65536 fails outright; 32768 is
; the safe single-card ceiling, under the 64K coding-use floor). Moved to
; llama-cpp-32gb, now at 163840 there (its real native ceiling).

# Devstral-Small-2-24B-Instruct-2512-Q4_K_M / Devstral-Small-2505-Q4_K_M
# removed -- ctx-size=32768 OOMs on one card (13.35 GiB weight leaves only
# ~2.6 GiB free); 16384 works but is too small to be useful. Needs a second
# card's headroom -- see llama-cpp-32gb (split-mode=tensor) and
# llama-cpp-cpu instead.

# reasoning-budget below matches the generel-schwerz services -- guards
# against runaway reasoning, a property of the chat template/sampling
# behaviour, not specific to one model or fork.
[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

# Dense Q4_K_M/Q5_K_M/Q6_K_M quants of Qwen3.8-27B don't fit solo on one
# 16 GiB card at any context (weights alone are ~15.2+ GiB) -- see
# llama-cpp-32gb. The two entries below are real 3-bit Unsloth Dynamic
# v3.0 quants instead (there is no literal "Q3_K_M" for this model; Unsloth
# ships IQ3_XXS/IQ3_S/Q3_K_XL in that tier), sized for one card.
[Qwen3.8-27B-UD-IQ3_S]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 131072 OOMs (a small late buffer, not the weights). 98304 confirmed
; working: 14,858 MiB used, ~1.4 GiB headroom. Untested between the two.
ctx-size = 98304

[Qwen3.8-27B-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 131072 confirmed working: 14,607 MiB used, ~1.7 GiB headroom.
ctx-size = 131072

# Eight MoE models too large for one 16 GiB card whole (17.3-20.5 GiB) but
# under the 32 GiB combined budget -- kept here via --n-cpu-moe N (this
# build's stock offload flag: first N layers' expert tensors stay on host
# RAM, everything else -- attention, embeddings, norms, other layers'
# experts -- stays GPU-resident). n-cpu-moe values below are each tuned to
# leave enough headroom for ctx-size=131072 plus workspace; all eight
# confirmed working at these values with real headroom to spare. The four
# with an "-Expert-Offload" suffix are the ones added later in the same
# tuning pass -- the suffix makes the offload explicit in the name, not
# just this comment.

[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
model = /models/unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
; 17.3 GiB, 48 layers, 128 experts/8 active. Weakest of the eight on
; independent benchmarks (Artificial Analysis Intelligence Index 10,
; "below average for the current field"); kept for completeness, not a
; first choice for agentic work. Tight fit at 131072 (~0.6 GiB headroom).
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 26

[Qwen3.6-35B-A3B-Q4_K_M]
model = /models/infatoshi--Qwen3.6-35B-A3B--Q4_K_M/Qwen3.6-35B-A3B-Q4_K_M.gguf
; 19.7 GiB, 40 layers, 256 experts/8 active. Real benchmarks: 73.4%
; SWE-bench Verified, Terminal-Bench 2.0 51.5 -- a real generation ahead of
; Qwen3-Coder-30B-A3B above despite the unversioned/3.6 naming similarity.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 19

[Qwen3.5-35B-A3B-Q4_K_M]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-Q4_K_M.gguf
; 20.5 GiB, 40 layers, 256 experts/8 active. Natively multimodal
; (text/image/video); reported "comparable to Qwen3.5-27B" -- the
; predecessor generation to Qwen3.6 above for text/coding work.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 20

[Ornith-1.5-35B-A3B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
; 20.2 GiB, 41 layers, 256 experts/8 active. Self-improving training loop
; (generates its own tasks/scaffolds/rollouts); independently benchmarked
; ahead of Qwen3.6-35B-A3B on coding/agentic tasks -- the best first choice
; of these eight for agentic coding/code review.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 20

[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0-Expert-Offload]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
; 17.60 GiB, 52 layers, 128 experts/6 active. Real dual-GPU DSH evidence
; (performance-findings.md): 42.2-101.2 tok/s decode, the fastest of any
; model tested under that workload. Its own MTP speculative-decode sidecar
; is used on the llama-cpp-32gb entry but deliberately not here, to keep
; this cluster's comparison to one variable (offload) at a time.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 19

[Laguna-XS-2.1-Q4_K_M-Expert-Offload]
model = /models/poolside--Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf
; 18.88 GiB, 40 layers, 256 experts/8 active. Real benchmarks (poolside's
; own published figures): 68.2% SWE-bench Verified, 62.4% Multilingual,
; 44.5% Pro -- competitive with, though slightly behind, Qwen3.6-35B-A3B
; (73.4%) above.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 22

[North-Mini-Code-1.0-UD-Q4_K_M-Expert-Offload]
model = /models/unsloth--North-Mini-Code-1.0-GGUF/North-Mini-Code-1.0-UD-Q4_K_M.gguf
; 17.88 GiB, 49 layers, 128 experts/8 active (cohere2moe architecture --
; Cohere's first coding-specific model). Real benchmarks: Artificial
; Analysis Coding Index 33.4, SciCode 40.0, LiveCodeBench 77.1, but its
; own published SWE-bench score is notably lower -- the headline
; agentic-coding metric is its weak point. Real throughput edge though:
; 2.8x Devstral Small 2's output throughput per Cohere's own benchmark.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 18

[granite-4.0-h-small-Q4_K_M-Expert-Offload]
model = /models/ibm-granite--granite-4.0-h-small-GGUF/granite-4.0-h-small-Q4_K_M.gguf
; 18.14 GiB, 40 layers (hybrid: 36 Mamba-2 + 4 attention per IBM's
; published architecture), 72 experts/10 active -- more than 3x the
; active-expert count of every other model in this cluster (6-8 elsewhere),
; so CPU-offloaded expert compute is proportionally heavier per token here;
; runs slower than its peers despite the similar file size. The Mamba-2-
; heavy design also means KV cache barely grows with context, unlike the
; transformer-only models in this cluster.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 15
