# 2026-09-18: Devstral-Small-2-24B-Instruct-2512-Q4_K_M and
# Devstral-Small-2505-Q4_K_M were added here, then removed the same day.
# Real load testing found ctx-size=32768 fails (real CUDA OOM allocating
