; Explicit catalogue for the two one-physical-GPU upstream-llama.cpp
; services: llama-cpp-gpu-0 (port 11441) and llama-cpp-gpu-1 (port 11442).
; Deploy with generate-models-preset.py --preset-only (validates paths only,
; no full-catalogue discovery). Separate from the all-GPU service's 32GB
; catalogue -- see ../llama-cpp-32gb/models-preset.ini.
;
; Each service is pinned to one physical GPU at the Docker level
; (gpus.device_ids); model sections don't need split-mode/main-gpu pinning.
;
; Models kept off this catalogue, and why:
;   - Llama-3.3-70B-Instruct-Q3_K_M, Qwen2.5-72B-Instruct-Q3_K_S,
;     DeepSeek-R1-Distill-Llama-70B-Q4_K_M -- dense, 32-40 GiB, nowhere
;     close to fitting one 16 GiB card.
;   - Qwen3-Coder-Next-Q4_K_M, Qwen3-Next-80B-A3B-Instruct-Q4_K_M -- CPU-only
;     (n-gpu-layers=0); belong on llama-cpp-cpu, not a GPU-locked slot.
;   - NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0 -- 17.6 GiB weight alone
;     exceeds one card's 16.3 GiB before any KV cache.
;   - magicoder-s-ds-6.7b.Q4_0 -- unsupported tokenizer, unfixable by config.
;   - Embeddings (Qwen3-Embedding-0.6B-Q8_0, embeddinggemma-300M-Q8_0) and
;     four 2023-era coding models (codellama-13b, wizardcoder-python-13b x2,
;     starcoder2-15b) -- removed at the user's request, weight files deleted
;     (~53 GiB); the qwen2.5-coder/Devstral/Qwen3-Coder-30B-A3B entries below
;     outclass them, and this service no longer offers embeddings at all.
version = 1

[*]
; A single interactive client gets the complete context.
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; Qwen2.5-Coder's real native context is 32768 (HF config.json:
; max_position_embeddings, no rope_scaling) -- the GGUF's own
; context_length=131072 metadata is not authoritative. rope-scaling=yarn +
; yarn-orig-ctx=32768 set explicitly below rather than relying on
; llama.cpp's implicit (and worse) linear-scale default.
[qwen2.5-coder-7b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q4_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
; KNOWN REGRESSION, 2026-09-21, not yet root-caused or fixed: real decode
; at this config dropped from a documented 40.92-41.02 tok/s to 10.5-11.0
; tok/s after the 2026-09-20/21 GGML_CUDA_FA_ALL_QUANTS/GGML_CUDA_GRAPHS
; rebuild. Graphs ruled out (both on and off equally slow). Backing off to
; ctx-size=65536 with no rope-scaling recovers most but not all of it
; (30.33-31.34 tok/s, still ~24% below baseline). Neither
; NVIDIA-Nemotron-3-Nano-4B nor Qwen3.8-27B-UD-Q6_K_M regressed on the same
; rebuilt image, so this isn't a blanket rebuild-wide problem -- see
; performance-findings.md for the full investigation and its open
; questions (untested: the two Qwen3.8-27B 3-bit quants, whether VRAM
; headroom rather than the compile flags is the real variable, an explicit
; yarn scale factor).
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

; Higher quants of the two entries above, using the headroom Q4_K_M leaves.
; Q6_K is the largest 14b quant that fits solo on one card; Q8_0 (14.62 GiB)
; needs both cards -- see llama-cpp-32gb.
[qwen2.5-coder-7b-instruct-q8_0]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q8_0.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q5_k_m]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q5_k_m.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

[qwen2.5-coder-14b-instruct-q6_k]
model = /models/Qwen--Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q6_k.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

; Small enough to run wholly on one GPU. Gemma capped at 32768 (its trained
; limit, llama.cpp clamps any higher request); the rest run at 65536.
[gemma-3n-E2B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E2B-it-GGUF/gemma-3n-E2B-it-Q4_K_M.gguf
ctx-size = 32768

[gemma-3n-E4B-it-Q4_K_M]
model = /models/unsloth--gemma-3n-E4B-it-GGUF/gemma-3n-E4B-it-Q4_K_M.gguf
ctx-size = 32768

[NVIDIA-Nemotron-3-Nano-4B-Q4_K_M]
model = /models/unsloth--NVIDIA-Nemotron-3-Nano-4B-GGUF/NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
ctx-size = 65536

[Ornith-1.5-9B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-9B-GGUF/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 65536

[Qwen3.5-9B-Q4_K_M]
model = /models/unsloth--Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 65536

; DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M removed -- needs more context than
; one 16 GiB card can give with real margin (65536 fails outright; 32768 is
; the safe single-card ceiling, under the 64K coding-use floor). Moved to
; llama-cpp-32gb, now at 163840 there (its real native ceiling).

# Devstral-Small-2-24B-Instruct-2512-Q4_K_M / Devstral-Small-2505-Q4_K_M
# removed -- ctx-size=32768 OOMs on one card (13.35 GiB weight leaves only
# ~2.6 GiB free); 16384 works but is too small to be useful. Needs a second
# card's headroom -- see llama-cpp-32gb (split-mode=tensor) and
# llama-cpp-cpu instead.

# reasoning-budget below matches the generel-schwerz services -- guards
# against runaway reasoning, a property of the chat template/sampling
# behaviour, not specific to one model or fork.
[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072

# Dense Q4_K_M/Q5_K_M/Q6_K_M quants of Qwen3.8-27B don't fit solo on one
# 16 GiB card at any context (weights alone are ~15.2+ GiB) -- see
# llama-cpp-32gb. The two entries below are real 3-bit Unsloth Dynamic
# v3.0 quants instead (there is no literal "Q3_K_M" for this model; Unsloth
# ships IQ3_XXS/IQ3_S/Q3_K_XL in that tier), sized for one card.
[Qwen3.8-27B-UD-IQ3_S]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 2026-09-20: lowered from 98304 -- real decode-at-depth sweep found this
; model's usable headroom runs out well before that ceiling (see
; performance-findings.md, "Maximising performance on a single card").
; 65536 is the confirmed-good ceiling; the previous 98304 value already
; cost real decode throughput at ordinary (8K+) prompt depths.
ctx-size = 65536

[Qwen3.8-27B-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
; 2026-09-20: lowered from 131072 -- real decode-at-depth sweep found a
; sharp cliff, not a gradual falloff: decode is good up to ~65536 and
; collapses to roughly a third of that by 94208, staying collapsed all the
; way to the old 131072 ceiling (see performance-findings.md, "Maximising
; performance on a single card"). 65536 is the confirmed-good ceiling.
ctx-size = 65536

# Eight MoE models too large for one 16 GiB card whole (17.3-20.5 GiB) but
# under the 32 GiB combined budget -- kept here via --n-cpu-moe N (this
# build's stock offload flag: first N layers' expert tensors stay on host
# RAM, everything else -- attention, embeddings, norms, other layers'
# experts -- stays GPU-resident). n-cpu-moe values below are each tuned to
# leave enough headroom for ctx-size=131072 plus workspace; all eight
# confirmed working at these values with real headroom to spare. The four
# with an "-Expert-Offload" suffix are the ones added later in the same
# tuning pass -- the suffix makes the offload explicit in the name, not
# just this comment.

[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
model = /models/unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
; 17.3 GiB, 48 layers, 128 experts/8 active. Weakest of the eight on
; independent benchmarks (Artificial Analysis Intelligence Index 10,
; "below average for the current field"); kept for completeness, not a
; first choice for agentic work. Tight fit at 131072 (~0.6 GiB headroom).
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 26

[Qwen3.6-35B-A3B-Q4_K_M]
model = /models/infatoshi--Qwen3.6-35B-A3B--Q4_K_M/Qwen3.6-35B-A3B-Q4_K_M.gguf
; 19.7 GiB, 40 layers, 256 experts/8 active. Real benchmarks: 73.4%
; SWE-bench Verified, Terminal-Bench 2.0 51.5 -- a real generation ahead of
; Qwen3-Coder-30B-A3B above despite the unversioned/3.6 naming similarity.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 19

[Qwen3.5-35B-A3B-Q4_K_M]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-Q4_K_M.gguf
; 20.5 GiB, 40 layers, 256 experts/8 active. Natively multimodal
; (text/image/video); reported "comparable to Qwen3.5-27B" -- the
; predecessor generation to Qwen3.6 above for text/coding work.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 20

[Ornith-1.5-35B-A3B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
; 20.2 GiB, 41 layers, 256 experts/8 active. Self-improving training loop
; (generates its own tasks/scaffolds/rollouts); independently benchmarked
; ahead of Qwen3.6-35B-A3B on coding/agentic tasks -- the best first choice
; of these eight for agentic coding/code review.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 20

[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0-Expert-Offload]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
; 17.60 GiB, 52 layers, 128 experts/6 active. Real dual-GPU DSH evidence
; (performance-findings.md): 42.2-101.2 tok/s decode, the fastest of any
; model tested under that workload. Its own MTP speculative-decode sidecar
; is used on the llama-cpp-32gb entry but deliberately not here, to keep
; this cluster's comparison to one variable (offload) at a time.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 19

[Laguna-XS-2.1-Q4_K_M-Expert-Offload]
model = /models/poolside--Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf
; 18.88 GiB, 40 layers, 256 experts/8 active. Real benchmarks (poolside's
; own published figures): 68.2% SWE-bench Verified, 62.4% Multilingual,
; 44.5% Pro -- competitive with, though slightly behind, Qwen3.6-35B-A3B
; (73.4%) above.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 22

[North-Mini-Code-1.0-UD-Q4_K_M-Expert-Offload]
model = /models/unsloth--North-Mini-Code-1.0-GGUF/North-Mini-Code-1.0-UD-Q4_K_M.gguf
; 17.88 GiB, 49 layers, 128 experts/8 active (cohere2moe architecture --
; Cohere's first coding-specific model). Real benchmarks: Artificial
; Analysis Coding Index 33.4, SciCode 40.0, LiveCodeBench 77.1, but its
; own published SWE-bench score is notably lower -- the headline
; agentic-coding metric is its weak point. Real throughput edge though:
; 2.8x Devstral Small 2's output throughput per Cohere's own benchmark.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 18

[granite-4.0-h-small-Q4_K_M-Expert-Offload]
model = /models/ibm-granite--granite-4.0-h-small-GGUF/granite-4.0-h-small-Q4_K_M.gguf
; 18.14 GiB, 40 layers (hybrid: 36 Mamba-2 + 4 attention per IBM's
; published architecture), 72 experts/10 active -- more than 3x the
; active-expert count of every other model in this cluster (6-8 elsewhere),
; so CPU-offloaded expert compute is proportionally heavier per token here;
; runs slower than its peers despite the similar file size. The Mamba-2-
; heavy design also means KV cache barely grows with context, unlike the
; transformer-only models in this cluster.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 15

# 2026-09-20: gpt-oss-120b added -- a much bigger model than the eight-model
# n-cpu-moe cluster above (58.44 GiB file vs. 17.3-20.5 GiB there), so it
# needs a much heavier offload and gets its own comment rather than joining
# that cluster's shared header. Previously this model was only available on
# the schwerz-16gb service, where its own CUDA expert-cache manages the
# host/GPU split automatically -- real comparison at matched settings found
# plain --n-cpu-moe here decisively faster for this model: 18.73-20.59 tok/s
# decode (2K-16K populated tokens, ctx-size=65536) vs. schwerz-16gb's
# 8.11-9.10 tok/s at the same depths. Not true for every model on schwerz
# (Flash Next's own tuned config is real and separately verified), but true
# for this one -- confirmed by a real load-and-decode comparison, not
# assumed from the general pattern.
#
# n-cpu-moe=29 was the working single-GPU value found by real testing
# (14,758 MiB used at ctx-size=65536, ~1.5 GiB headroom) -- raised to 31 to
# reach the ctx-size below: 29 left only ~731 MiB short trying to allocate a
# late compute buffer at ctx-size=131072, the same small-late-buffer OOM
# class already seen elsewhere in this file. 31 confirmed working at
# 131072: 12,812 MiB used, ~3.5 GiB headroom. Real depth sweep at that
# ctx-size found a gradual decline, not a cliff: 15.61 tok/s decode at
# 49,243 populated tokens, 14.52 tok/s at 114,779 -- see
# performance-findings.md, "gpt-oss-120b: plain n-cpu-moe vs. schwerz
# expert-cache" for the full figures.
[gpt-oss-120b-Q4_K_M]
model = /models/unsloth--gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 31

# 2026-09-21: batch of large single-GPU MoE entries added following the
# gpt-oss-120b result above -- same method (real load test, `n-cpu-moe`
# raised only as far as needed for ctx-size=131072, one depth point around
# 49K populated tokens as the headline decode figure). Two names below
# (`Llama-4-Scout`, `GLM-4.5-Air`) previously existed only on
# `llama-cpp-generel-schwerz-16gb`, where they either failed to load
# (Llama-4-Scout, every condition tried) or ran much slower (GLM-4.5-Air,
# 2.4-3.25 tok/s there vs. 2.4-8.8 tok/s here, worse at short context but
# comparable at 128K since both need the same KV quant there). The other
# three (Qwen3-Coder-Next, Qwen3-Next-80B-A3B-Instruct, Qwen3.8-Flash-Next)
# already ran on schwerz-16gb; plain `n-cpu-moe` beat that for the first
# two by a real margin (29.94-37.36 vs. schwerz's ~31-32 tok/s) and roughly
# tied it for Flash Next (11-18 vs. schwerz's 12.67-18.38 tok/s) -- Flash
# Next is the one model here with real prior tuning work on schwerz
# (batch/ubatch), so parity rather than a clean win is expected. Full
# tables: performance-findings.md, "Second batch: five more models via
# plain n-cpu-moe, all validated to 128K".

[Llama-4-Scout-17B-16E-Instruct-Q4_K_M]
model = /models/unsloth--Llama-4-Scout-17B-16E-Instruct-GGUF/Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf
; Was completely non-functional on schwerz-16gb (every cache/ctx-size
; combination tried there failed). n-cpu-moe=46 confirmed working here at
; both ctx-size values with real headroom (~4.1 GiB free at 65536).
; Decode: 8.42-8.80 tok/s @ 65536 (flat with depth), 8.09 tok/s @ 128K/49K.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 46

[GLM-4.5-Air-UD-Q4_K_XL]
model = /models/unsloth--GLM-4.5-Air-GGUF/UD-Q4_K_XL/GLM-4.5-Air-UD-Q4_K_XL-00001-of-00002.gguf
; n-cpu-moe alone is not enough at 131072 -- this model's KV cache alone
; wants ~12.5 GiB at that ctx-size (confirmed via a real "failed to
; allocate buffer for kv cache" OOM), independent of expert offload, so
; cache-type-k/v=q4_0 is required too (same fix already used on
; schwerz-16gb for this model). Decode: 7.15-7.31 tok/s @ 65536 (q8_0/q8_0,
; no quant needed there), 2.41 tok/s @ 128K/49K (with the quant).
ctx-size = 131072
n-gpu-layers = all
split-mode = layer
n-cpu-moe = 46
cache-type-k = q4_0
cache-type-v = q4_0

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
; Beats its existing schwerz-16gb entry by a real margin at every depth
; tested (35.32-37.19 vs. schwerz's 31.12-31.29 tok/s). n-cpu-moe raised
; from 40 to 42 to reach ctx-size=131072 with real headroom.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 42

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
; Same pattern as Qwen3-Coder-Next just above (same architecture family):
; beats its existing schwerz-16gb entry (35.21-37.36 vs. 31.81-32.00 tok/s)
; and CPU entry (9.98-13.24 tok/s) by a wide margin. n-cpu-moe raised from
; 40 to 42 to reach ctx-size=131072.
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 42

[Qwen3.8-Flash-Next-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-Flash-Next--UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
; The one model in this batch with real prior tuning work on its
; schwerz-16gb entry (batch/ubatch, +125% prefill/+9% decode documented
; there) -- plain n-cpu-moe here roughly ties it (14.97-16.06 vs.
; schwerz's 12.67-18.38 tok/s) rather than clearly beating it, unlike the
; other four models in this batch. Kept as a real alternative, not a
; replacement -- schwerz-16gb's entry is unchanged. n-cpu-moe raised from
; 46 to 50 to reach ctx-size=131072; needs mmap given its 84 GiB file size.
ctx-size = 131072
n-gpu-layers = all
load-mode = mmap
lazy-mode = on
n-cpu-moe = 50

[Ling-3.0-flash-Q4_K_M]
model = /models/bartowski--Ling-3.0-flash-GGUF/Ling-3.0-flash-Q4_K_M/Ling-3.0-flash-Q4_K_M-00001-of-00002.gguf
; New download, 2026-09-21: 127B total / 5.1B active (bailingmoe3
; architecture, MIT license), the same active-parameter class as
; gpt-oss-120b above -- downloaded specifically because of that match.
; Also real-tested on schwerz-16gb, where it was substantially slower
; (5.36-7.21 vs. 11.09-18.36 tok/s here) -- same pattern as the rest of
; this batch. Decode is non-monotonic with depth here: 11.09 tok/s @ 2K,
; 18.36 tok/s @ 16K, 11.12 tok/s @ 128K/49K -- see performance-findings.md
; for the fuller discussion of this shape. n-cpu-moe raised from 38 to 40
; to reach ctx-size=131072; needs mmap given its 77.8 GiB file size.
ctx-size = 131072
n-gpu-layers = all
load-mode = mmap
lazy-mode = on
n-cpu-moe = 40

[upstage.Solar-Open-100B.Q4_K_M]
model = /models/DevQuasar-11--upstage.Solar-Open-100B-GGUF/upstage.Solar-Open-100B.Q4_K_M-00001-of-00004.gguf
; New download, 2026-09-21: 102B total / 12B active, the same
; active-parameter class as GLM-4.5-Air above (real GLM-4.5-Air-like
; numbers, not gpt-oss-120b-like ones, as expected from that class).
; Same large-KV-cache issue as GLM-4.5-Air at 131072 (real "failed to
; allocate buffer for kv cache" OOM with n-cpu-moe alone) -- cache-type-k/v
; =q4_0 required there too. Decode: 8.76-9.64 tok/s @ 65536 (q8_0/q8_0),
; 3.48 tok/s @ 128K/49K (with the quant). Also real-tested on schwerz-16gb,
; substantially slower there (2.49-4.83 vs. 3.48-9.64 tok/s here). n-cpu-moe
; raised from 46 to 54 to reach ctx-size=131072; needs mmap (62.3 GiB file).
ctx-size = 131072
n-gpu-layers = all
load-mode = mmap
lazy-mode = on
n-cpu-moe = 54
cache-type-k = q4_0
cache-type-v = q4_0
