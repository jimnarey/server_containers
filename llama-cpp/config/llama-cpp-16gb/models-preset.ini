; headroom, comfortable); Q5_K_M for 14b projects to ~13.02 GiB (~3.3 GiB
; headroom, comfortable); Q6_K for 14b projects to ~14.52 GiB (~1.8 GiB
; headroom, tighter but plausible) -- all three projections use each
; model's own real Q4_K_M overhead (1.04 GiB for 7b, 3.23 GiB for 14b at
; ctx=32768), not a borrowed estimate. Q6_K is the largest quant that
; still fits solo for 14b -- Q8_0 (14.62 GiB file) projects to ~17.85 GiB,
; over one card's capacity, so it's dual-GPU only (see llama-cpp-32gb).
; None of these three real-load-tested yet.
[qwen2.5-coder-7b-instruct-q8_0]
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q8_0.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768

