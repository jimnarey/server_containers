; Hand-written, complete catalogue for the csantiago78/llama.cpp MoE-cache
; router. Unlike llama-cpp/llama-cpp-cpu this is not auto-discovered from
; /models: it exists only to run these three large Qwen MoE models across
; both GPUs via csantiago78's independent expert-cache implementation, as an
; alternative to generel-schwerz-llama-cpp whose own cache cannot use a
; second GPU (GenerelSchwerz/llama.cpp#90). Do not add other models here;
; anything not needing this fork's multi-GPU cache belongs on one of the
; existing services instead.
version = 1

; ctx-size and load-mode/tensor-read-lazy are model-specific, so they stay
; here rather than in config.ini's [*]. n-gpu-layers, override-tensor, and
; the moe-expert-cache* settings are shared across all three (see
; config.ini) since all three are MoE models with the same *_exps tensor
; naming.

; This 84 GiB, near-host-RAM-capacity model needs mmap + lazy tensor reads,
; as in generel-schwerz-llama-cpp's own config for it. This fork has no
; `lazy-mode` option (confirmed against `llama-server --help` on the built
; image, which crash-looped on the unrecognized key); its equivalent is
; `--tensor-read-lazy`, whose own help text names per-layer-embedding
; tensors -- i.e. Flash Next's PLE table -- as the intended use case.
[Qwen3.8-Flash-Next-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-Flash-Next--UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
ctx-size = 98304
load-mode = mmap
tensor-read-lazy = on

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
ctx-size = 65536

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
ctx-size = 65536
