;   already llama.cpp's default; it does not substitute or modify the template.
; - reasoning-format = auto overrides the deepseek default with the Harmony-aware
;   parser.
; - Sampling is the official recommendation, temperature = 1 / top-p = 1; top-k = 0,
;   min-p = 0 and repeat-penalty = 1 disable llama.cpp's extra truncation filters to
;   match the reference sampler's full-distribution temperature sampling.
