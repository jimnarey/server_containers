; Unified upstream llama.cpp router catalogue.
; Source variants: existing 16GB single-GPU, 32GB dual-GPU, and CPU catalogues.
; Section suffixes declare each model's placement: --cuda0, --cuda1,
; --cuda0-cuda1, or --cpu. The router runs with --models-max 1, so only one model
; is resident at a time; see README.md.
; Every section materializes its former [*] defaults, keeping placement fully
; per-model. Do not set --device, --split-mode, or --n-gpu-layers on the
; container command: router command-line arguments would override this file.
; CUDA names are verified at deployment with llama-server --list-devices.
;
; Settings that apply across the catalogue (carried over from the source files):
; - n-gpu-layers = all on every GPU entry is deliberate: a future VRAM non-fit
;   must fail at load rather than silently mapping layers to CPU. Entries with
;   n-cpu-moe are deliberate, explicitly-configured expert host offload and keep
;   n-gpu-layers = all too. --fit refuses to run once n-cpu-moe sets tensor
;   overrides ("tensor_buft_overrides already set by user, abort").
; - n-cpu-moe = N keeps the first N layers' expert tensors in host RAM; attention,
;   embeddings, norms and the other layers' experts stay on GPU. Each value is the
;   smallest that reaches the entry's ctx-size with real headroom -- too low fails
;   with a small late compute-buffer OOM.
; - load-mode = mmap + lazy-mode = on for models whose file is 60-84 GiB.
; - ctx-size = 65536 is the coding-use floor for a single interactive client.
; - reasoning-format = deepseek preserves the historical response shape; GPT-OSS
;   overrides it with its Harmony-aware `auto`.
; - cache-type-k/v = q8_0 by default; q4_0 only where the KV cache alone does not
;   fit otherwise (GLM-4.5-Air, Solar-Open on a single card) and on the CPU
;   Qwen3-Next entries (V only).
; - split-mode = tensor needs NCCL_CUMEM_ENABLE=0 on this build (set in the service
;   env) -- without it tensor split fails with an NCCL/GPU-generation kernel-launch
;   error, not an OOM. Layer split works but is much slower for dense models.
;   deepseek2-family models (DeepSeek-Coder-V2-Lite, GLM-4.7-Flash, GLM-4.5-Air),
;   gemma3n and nemotron_h do not support tensor split on this build -> layer.
; - Dense decode at batch=1 is memory-bandwidth-bound, so a tensor split across both
;   cards roughly doubles effective bandwidth even when the model fits on one card.
;   For MoE with n-cpu-moe the dual-GPU service is not a general win (see the
;   --cuda0-cuda1 gpt-oss-120b entries).
; - Resource sizes: one card is 16,311 MiB; --cuda0-cuda1 gives 32 GiB combined.
; - Detailed measurements: llama-cpp/docs/performance-findings.md.
;
; Models deliberately not in the catalogue:
; - Llama-3.3-70B-Instruct-Q3_K_M, Qwen2.5-72B-Instruct-Q3_K_S,
;   DeepSeek-R1-Distill-Llama-70B-Q4_K_M: dense 32-40 GiB. Even on both cards they
;   need partial CPU offload (2.1-2.75 tok/s), so every token touches host RAM/PCIe
;   -- an order of magnitude slower than MoE models of similar total size.
; - magicoder-s-ds-6.7b.Q4_0: unsupported tokenizer, unfixable by config.
; - Embedding models and the 2023-era coding models (codellama-13b,
;   wizardcoder-python-13b, starcoder2-15b): outclassed by the qwen2.5-coder /
;   Devstral / Qwen3-Coder entries; this service offers no embeddings.
; - GPU entries with n-gpu-layers = 0 (CPU pass-through) would misrepresent their
;   resource claim; CPU-only placement is expressed as the --cpu variants.
; - The CPU catalogue is curated-only. Full discovery has no exclude mechanism: it
;   once silently made an 84 GiB model selectable, and a live test of a dense 70B
;   drove host swap to 7.7/8 GiB. Add a --cpu entry only after a real documented
;   CPU test, not a size estimate. GPU-only directives (split-mode, main-gpu,
;   tensor-split, partial n-gpu-layers) do not belong in --cpu entries.
version = 1

; Materialized from llama-cpp/config/llama-cpp-16gb/models-preset.ini.

; Comments sit above the --cuda0 entry and apply to its --cuda1 twin too.
; Qwen2.5-Coder's real native context is 32768 (HF config.json:
; max_position_embeddings, no rope_scaling); the GGUF's own
; context_length=131072 metadata is not authoritative. rope-scaling = yarn +
; yarn-orig-ctx = 32768 are set explicitly rather than relying on llama.cpp's
; implicit (and worse) linear-scale default. Applies to every 7B/14B Qwen2.5-Coder
; entry that runs above 32768, including the --cuda0-cuda1 ones.
[qwen2.5-coder-7b-instruct-q4_k_m--cuda0]
ctx-size = 131072
parallel = 1
reasoning-format = deepseek
cache-type-k = q8_0
cache-type-v = q8_0
model = /models/Qwen--Qwen2.5-Coder-7B-Instruct-GGUF/qwen2.5-coder-7b-instruct-q4_k_m.gguf
n-gpu-layers = all
rope-scaling = yarn
yarn-orig-ctx = 32768
device = CUDA0
split-mode = none

