; DeepSeek-Coder-V2-Lite: real MoE (deepseek2, 27 layers, 64 experts/6
; active), 9.65 GiB. deepseek2 does not support split-mode=tensor on this
; build (same as GLM-4.7-Flash below) -- split-mode=layer set explicitly.
; ctx-size=163840 is this model's real native ceiling (GGUF metadata);
; confirmed working, ~1.5 GiB headroom per card. Q8_0 curated as its own
; entry below rather than replacing Q4_K_M outright -- DSH settings.yaml
; still points at the Q4_K_M id specifically, and both are kept until a
; decision to fully switch.
[DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M]
model = /models/bartowski--DeepSeek-Coder-V2-Lite-Instruct-GGUF/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf
ctx-size = 163840
split-mode = layer

; Real GGUF metadata confirms this quant's YaRN rope scaling is genuinely
; baked in (deepseek2.rope.scaling.type/factor=40.0/
; original_context_length=4096, 4096*40=163840 matches context_length
; exactly) -- llama.cpp applies it automatically, no override needed.
; Near-lossless vs. Q4_K_M per bartowski's own quant notes. Confirmed
; working, ~1.55 GiB headroom per card.
[DeepSeek-Coder-V2-Lite-Instruct-Q8_0]
model = /models/bartowski--DeepSeek-Coder-V2-Lite-Instruct-GGUF/DeepSeek-Coder-V2-Lite-Instruct-Q8_0.gguf
ctx-size = 163840
split-mode = layer

; split-mode=tensor forced explicitly (default is layer split). Dense
; decode at batch=1 is memory-bandwidth-bound, so a real tensor split
; roughly doubles effective bandwidth even though the model fits on one
; card. Confirmed: 7,611 + 7,696 MiB combined vs. ~13.3 GiB solo. gpt-oss's
; architecture supports split-mode=tensor on this build (unlike GLM-4.7-
; Flash's deepseek2 architecture, which does not).
[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
; Keep the embedded Harmony Jinja template enabled explicitly. This is already
; llama.cpp's default; it does not substitute or modify the model template.
jinja = true
reasoning-format = auto
reasoning-effort = high
temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
ctx-size = 131072
split-mode = tensor

; Official ggml-org native MXFP4 conversion.  It has the same 128K metadata
