; Sparse override source for llama-cpp-all-gpus (port 11436). Generate the
; deployed preset at /mnt/work/llama/llama-cpp-32gb/models-preset.ini. This
; router sees both 16 GiB cards and is the compatibility route named
; "llama-cpp" for DeepSeek and Pi.
;
; Keep multi-GPU-only placement here. The one-card catalogue is deliberately
; separate at ../llama-cpp-16gb/models-preset.ini, so its models cannot be
; accidentally selected through a service with the wrong VRAM budget.
version = 1

[*]
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

; Preserve the previous all-GPU router's model-specific context limits and
; CPU-resident fallbacks. These do not require a one-card pin and therefore
; belong in the 32GB catalogue rather than the constrained one-card file.
[Qwen3-Embedding-0.6B-Q8_0]
model = /models/Qwen--Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
ctx-size = 32768

[embeddinggemma-300M-Q8_0]
model = /models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
ctx-size = 2048

[codellama-13b-instruct.Q4_0]
model = /models/TheBloke--CodeLlama-13B-Instruct-GGUF/codellama-13b-instruct.Q4_0.gguf
ctx-size = 16384

[magicoder-s-ds-6.7b.Q4_0]
model = /models/TheBloke--Magicoder-S-DS-6.7B-GGUF/magicoder-s-ds-6.7b.Q4_0.gguf
