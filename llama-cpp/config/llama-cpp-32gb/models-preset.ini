; Sparse override source mounted directly by llama-cpp-all-gpus (port 11436).
; This router sees both 16 GiB cards and is the compatibility route named
; "llama-cpp" for DeepSeek and Pi.
;
; Keep multi-GPU-only placement here. The one-card catalogue is deliberately
; separate at ../llama-cpp-16gb/models-preset.ini, so its models cannot be
; accidentally selected through a service with the wrong VRAM budget.
version = 1

[*]
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
; Preserve the historical response shape for ordinary upstream models. GPT-OSS
; overrides this with its Harmony-aware `auto` parser below.
reasoning-format = deepseek
; GPU-resident entries inherit this guardrail. A later model/context change
; that exceeds the combined two-card budget must fail at load rather than
; silently map transformer layers to CPU. The n-cpu-moe entries below remain
; deliberate expert host offload and explicitly retain this same setting.
n-gpu-layers = all

; Llama-3.3-70B-Instruct-Q3_K_M and Qwen2.5-72B-Instruct-Q3_K_S removed,
; weight files deleted (~64 GiB freed). Real decode: 2.09-2.75 tok/s and
; 2.14-2.57 tok/s, both n-gpu-layers=auto (partial CPU offload) -- neither
; fits 32 GiB combined VRAM with real margin, so every token touches host
; RAM/PCIe, a structural bottleneck. An order of magnitude slower than the
; fleet's MoE models of similar or larger total size. See
; performance-findings.md.
;
; Qwen3-Coder-Next-Q4_K_M and Qwen3-Next-80B-A3B-Instruct-Q4_K_M also
; removed -- both carried n-gpu-layers=0 (CPU pass-through even here), so
; a curated GPU-service entry misrepresented them. Properly homed on
; llama-cpp-cpu and the 16GB schwerz service instead.

[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-draft-model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/mtp-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-type = draft-mtp
ctx-size = 262144

; Seven full-GPU-resident (no n-cpu-moe host offload) counterparts to their
; llama-cpp-16gb n-cpu-moe-offloaded siblings -- 18-21 GiB weight-only,
; comfortably split across both cards. No split-mode set (deepseek2-family
; architectures on this build don't support tensor; see DeepSeek-Coder-V2-
; Lite below). ctx-size matches each model's llama-cpp-16gb value so the
; comparison holds context constant. Confirmed working, real 1.6x-2.3x
; decode speedup over the single-GPU offloaded figure for every one of the
; seven -- see performance-findings.md for per-model numbers.
[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
