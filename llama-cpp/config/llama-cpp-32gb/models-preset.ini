; Sparse override source for llama-cpp-all-gpus (port 11436). Generate the
; deployed preset at /mnt/work/llama/llama-cpp-32gb/models-preset.ini. This
; router sees both 16 GiB cards and is the compatibility route named
; "llama-cpp" for DeepSeek and Pi.
;
; Keep multi-GPU-only placement here. The one-card catalogue is deliberately
; separate at ../llama-cpp-16gb/models-preset.ini, so its models cannot be
; accidentally selected through a service with the wrong VRAM budget.
version = 1

[*]
ctx-size = 65536
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

[Llama-3.3-70B-Instruct-Q3_K_M]
model = /models/bartowski--Llama-3.3-70B-Instruct-GGUF/Llama-3.3-70B-Instruct-Q3_K_M.gguf
ctx-size = 131072
n-gpu-layers = auto

; 2026-09-19: confirmed via GGUF metadata (qwen2.context_length=32768, no
; rope.scaling.* fields) -- this is the real, un-scaled Qwen2.5 training
; context (Llama-3.3-70B above is unaffected: its own GGUF metadata
; genuinely reports 131072, matching Llama-3.1+'s real native long-context
; training). ctx-size here is already 2x that native window with no
; rope-scaling configured -- added yarn-orig-ctx=32768 explicitly rather
; than relying on llama.cpp's implicit (and worse) default scaling
; behaviour. See llama-cpp-16gb's own comment on the qwen2.5-coder family
; for the same finding there.
[Qwen2.5-72B-Instruct-Q3_K_S]
model = /models/second-state--Qwen2.5-72B-Instruct-GGUF/Qwen2.5-72B-Instruct-Q3_K_S.gguf
ctx-size = 131072
rope-scaling = yarn
yarn-orig-ctx = 32768
n-gpu-layers = auto

; 2026-09-18: removed the Qwen3-Coder-Next-Q4_K_M and
; Qwen3-Next-80B-A3B-Instruct-Q4_K_M entries that used to live here. Both
; carried n-gpu-layers=0 -- meaning they never touched either GPU even on
; this dual-GPU-locked service, purely CPU pass-through -- so an explicit
; entry here implied a GPU-resident capability this service was never
; actually providing for them. Both are properly homed and tested
; elsewhere: CPU-only figures in llama-cpp-cpu's preset (9-13 tok/s
; decode, see the CPU-only section above), MoE host-offload figures in the
; 16GB schwerz service's table (31 tok/s decode, single GPU with
; host-offloaded experts). Full-discovery mode still surfaces both models
; here under their raw directory-based catch-all IDs -- that's fine, only
; the curated entry (and the GPU-resident claim it made) was the problem.

[NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0]
model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-draft-model = /models/ggml-org--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/mtp-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
spec-type = draft-mtp
ctx-size = 262144

; 2026-09-18: DeepSeek-R1-Distill-Llama-70B-Q4_K_M removed, weight file
; (~40 GiB) deleted from disk. Dense, redundant with Llama-3.3-70B-
; Instruct-Q3_K_M and Qwen2.5-72B-Instruct-Q3_K_S above (both also dense
; 70B-class, both also never proven to work well on this hardware), never
; real-load-tested in this deployment's entire history despite being
; curated here since the per-GPU-locked refactor, and had no real
; advantage over either of those two remaining entries. Removed at the
; user's request rather than kept as an unproven third option in the same
; size/architecture class. See performance-findings.md for the reasoning
; that led here (this document's own earlier suggestion that this model
; didn't have a clear use case, confirmed by the user's own judgement).

; 2026-09-18: DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M added -- real MoE
; (`deepseek2` architecture, confirmed via GGUF metadata: 27 layers, 64
; experts/6 active), 9.65 GiB, easily fits one card, previously only
; reachable via discovery on this service, never curated or tested
; anywhere. `deepseek2` does not support `split-mode=tensor` on this build
; (same restriction as GLM-4.7-Flash below) -- `split-mode=layer` set
; explicitly rather than left to default, so both GPUs are genuinely
; exercised (pipelined layer-split) rather than accidentally landing on
; one card. This is also this deployment's cleanest test of whether
; layer-split gives any real speedup for a small, fully-GPU-resident MoE
; model the way tensor-split does for dense ones (see
; performance-findings.md's "outstanding MoE questions" note) -- a
; single-GPU comparison run on llama-cpp-16gb is the other half of that
; test. NOT yet real-load-tested here.
[DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M]
model = /models/bartowski--DeepSeek-Coder-V2-Lite-Instruct-GGUF/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf
; 2026-09-18: raised to 163840, this model's real native context ceiling
; (confirmed via GGUF metadata) -- the llama-cpp-16gb entry that used to
; match this one at 65536 for a clean single-vs-dual comparison has been
; removed entirely (that model needs more context than one card can give
; it with real margin), so there's no longer a reason to hold this back to
; match it. Real headroom at 65536 was already large (10.6+9.1 GiB used of
; 31.85 GiB combined, 12+ GiB free), so this is a reasoned jump, not a
; blind one -- still needs a real load to confirm 163840 actually fits.
; Real higher quants exist for this model (Q5_K_M 11.85 GB, Q6_K 14.07 GB,
; Q8_0 16.70 GB, all bartowski) -- Q8_0 is near-lossless and would still
; fit this service's real headroom easily; worth a real upgrade, not yet
; done (still Q4_K_M as of this note).
;
; 2026-09-19: Q8_0 downloaded and curated as its own entry below rather than
; replacing this one outright -- keeping both until the user decides whether
; to fully switch, since other config (DSH settings.yaml) still points at
; this Q4_K_M id specifically.
ctx-size = 163840
split-mode = layer

; 2026-09-19: real GGUF metadata confirms this quant's rope scaling is
; genuinely baked in, not extrapolated like the qwen2.5-coder family:
; deepseek2.rope.scaling.type/factor=40.0/original_context_length=4096
; (4096*40=163840, matching context_length exactly) -- llama.cpp reads and
; applies this automatically, no rope-scaling/yarn-orig-ctx override needed
; here. Near-lossless vs. Q4_K_M above per bartowski's own quant notes;
; not yet real-load-tested.
[DeepSeek-Coder-V2-Lite-Instruct-Q8_0]
model = /models/bartowski--DeepSeek-Coder-V2-Lite-Instruct-GGUF/DeepSeek-Coder-V2-Lite-Instruct-Q8_0.gguf
ctx-size = 163840
split-mode = layer

; 2026-09-18: split-mode=tensor forced explicitly (previously unset, which
; falls back to llama.cpp's own default -- layer split, not tensor). Same
; reasoning as the two Qwen3.8-27B 3-bit quants below: this is a dense
; model, dense decode at batch=1 is memory-bandwidth-bound, so forcing a
; real tensor split should double effective bandwidth even though the
; model already fits on one card. Confirmed working by a real load +
; request: 7,611 + 7,696 MiB combined (vs. ~13.3 GiB solo on one card --
; see the GPU-resident single-card entry above), well under half the
; single-GPU footprint since weights are split rather than duplicated.
; gpt-oss's architecture does support split-mode=tensor on this build
; (unlike GLM-4.7-Flash's deepseek2 architecture, which does not).
[gpt-oss-20b-F16]
model = /models/unsloth--gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
ctx-size = 131072
split-mode = tensor

; These Qwen3.8-27B quants do not fit on one 16 GiB card. Tensor splitting is
; supported for this architecture and the context limits below are the prior
; two-card settings; retain Q8 K/V for long-context quality.
; 2026-09-18: split-mode=tensor started failing a real load on this host's
; rebuilt llama-cpp-all-gpus (post service-refactor image), for all three
; quants below -- NOT an OOM. Root cause: an NCCL/GPU-generation
; incompatibility (kernel launch fails with "Cuda failure 1 'invalid
; argument'" regardless of transport). Fixed in compose.ai.yml with
; NCCL_CUMEM_ENABLE=0 -- confirmed by a real load + request for both
; Q4_K_M and Q6_K_M (see that file's comment for the full trace). Kept
; split-mode=tensor rather than switching to layer, which was tried,
; works, but is confirmed much slower for this workload.
[Qwen3.8-27B-UD-Q4_K_M]
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf
reasoning-effort = medium
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
ctx-size = 131072
split-mode = tensor

