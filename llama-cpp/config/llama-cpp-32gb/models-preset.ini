; 2026-09-18: added after real single-GPU testing on llama-cpp-16gb found
; this model genuinely needs both cards on this hardware -- not a capacity
; requirement (13.35 GiB fits solo), a context one: ctx-size=32768 failed a
; real CUDA OOM on the KV buffer (weights alone left only ~2,641 MiB free
; on one 16,311 MiB card), and the working fallback (16384) was judged too
; small to be useful. split-mode=tensor forced explicitly, same reasoning
; as gpt-oss-20b-F16 and the Qwen3.8-27B quants above -- Devstral is a
; standard dense transformer (finetuned from Mistral-Small-3.1), the same
; class of architecture already confirmed to support tensor-split on this
; build (unlike GLM-4.7-Flash's deepseek2 below). ctx-size started at
; 131072, this model's published native context ceiling, matching how
; gpt-oss-20b-F16's dual-GPU entry above also targets its own practical
; max rather than an arbitrary halfway point. Confirmed working by a real
; load + request for both quants: 13,099-13,196 MiB per card, ~3.1-3.2 GiB
; real headroom each -- real tensor-split confirmed (near-equal weight
; split across both cards, not duplicated). Both quants' single-GPU
; ctx-size history (32768 failed, 16384 worked but was too small) is
; recorded on llama-cpp-16gb's own preset and performance-findings.md.
[Devstral-Small-2-24B-Instruct-2512-Q4_K_M]
model = /models/unsloth--Devstral-Small-2-24B-Instruct-2512-GGUF/Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
ctx-size = 131072
split-mode = tensor

[Devstral-Small-2505-Q4_K_M]
model = /models/unsloth--Devstral-Small-2505-GGUF/Devstral-Small-2505-Q4_K_M.gguf
ctx-size = 131072
split-mode = tensor

