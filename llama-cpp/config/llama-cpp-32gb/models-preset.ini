# 2026-09-20: gpt-oss-120b added, matching the n-cpu-moe entry on
# llama-cpp-16gb (see that file's own comment for the real single-GPU
# comparison against schwerz-16gb's expert-cache). Dual-GPU does NOT
# meaningfully help this model on this build: --fit refuses to run at all
# once n-cpu-moe sets tensor overrides ("tensor_buft_overrides already set
# by user, abort"), and without --fit's placement logic, the model's
# entire non-offloaded weight lands as one non-splittable ~27.7 GiB buffer
# targeting a single device -- confirmed unchanged across n-gpu-layers
# auto/all, explicit split-mode=layer, and an explicit even tensor-split;
# none of the three affected it. The only way to make it fit at all is the
# same lever as single-GPU: raise n-cpu-moe until the resident chunk fits
# on whichever one device it lands on. n-cpu-moe=29 (one less than the
# 16GB service needs) works here because the second card absorbs some of
# the KV-cache/workspace overhead even though the weights themselves don't
# actually spread across it (GPU0: 2.87 GiB, GPU1: 14.16 GiB at
# ctx-size=131072 -- real, confirmed asymmetric, not a config choice).
# Real cost: decode is statistically the same as the 16GB service
# (14.51-14.76 tok/s vs. 14.52-15.61 tok/s at matched depths), but prefill
# is substantially worse (194-199 tok/s vs. 455-572 tok/s at matched
# depths) -- the same layer-split cross-device prefill penalty already
# documented elsewhere in this file for dense models. Kept here for the
# marginal extra headroom, not because dual-GPU is actually a win for this
# model -- see performance-findings.md for the full comparison.
[gpt-oss-120b-Q4_K_M]
model = /models/unsloth--gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf
; GPT-OSS is trained on Harmony. Its official sampling recommendation is
; temperature=1/top-p=1; disabling llama.cpp's additional truncation filters
; matches the reference sampler's full-distribution temperature sampling.
jinja = true
reasoning-format = auto
reasoning-effort = high
temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
ctx-size = 131072
n-gpu-layers = all
n-cpu-moe = 29

; Official ggml-org native MXFP4 conversion.  This single-file GGUF is about
