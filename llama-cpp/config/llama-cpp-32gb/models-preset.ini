[gpt-oss-20b-MXFP4]
model = /models/ggml-org--gpt-oss-20b-GGUF/gpt-oss-20b-MXFP4.gguf
jinja = true
reasoning-format = auto
reasoning-effort = high
temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
ctx-size = 131072
split-mode = tensor

