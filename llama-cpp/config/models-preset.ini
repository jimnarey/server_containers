; Uncensored sibling: Qwen/Qwen3.8-27B -> abliterated by huihui-ai/Huihui-Qwen3.8-27B-
; abliterated -> GSQ/RCO IQ3_XXS quant by RentedNoodle, reusing ISTA-DASLab's published
; per-tensor allocation map (not an independently re-run budget search -- the uploader's
; own disclosure). 9.75 GiB file, smaller than the UD-IQ3_S/Q3_K_XL siblings above, so
; the same proven 65536 ctx-size/q8_0 KV envelope that works for them has real headroom
; to spare here. The uploader's own card claims a 196K resident fit with q4_0 KV on
; their fork, but says plainly "do not treat as 196K-verified" (retrieval accuracy at
; that depth is still under their own active evaluation) -- not adopted here for that
; reason; revisit only after an independent depth sweep like the one that set 65536 for
; the siblings. Ships an embedded MTP draft head, but Qwen3.x MTP speculative decoding
; is still an open feature request on upstream ggml-org/llama.cpp (issue #28051, not
; merged as of this writing) -- the uploader's headline 59-82 tok/s figures are measured
; on their own fork (RentedNoodle/den_llama.cpp), not this service's build, so the head
; sits unused here. Their own "serial / no spec" figure (~39.6 tok/s, RTX 5070 Ti) is the
; realistic expectation on this service -- still faster than UD-IQ3_S's single-GPU
; 29-30 tok/s (performance-findings.md), so worth it on quant/speed grounds alone.
; Requires the bundled froggeric-qwen3.8-tool-use.jinja template (the uploader's card:
; "local file header v22.5; upstream repo may still show v22.4") -- not the GGUF's own
; embedded template, hence chat-template-file below.
; 2026-10-03: reasoning-effort dropped from medium to low, and reasoning-preserve
; disabled, after a real session hit ctx-size's 65536 ceiling (truncated = 1 in
; llama-cpp-c's own logs) and VSCode's manual compaction barely recovered any space.
; Root cause, confirmed against froggeric's own README (Qwen-Fixed-Chat-Templates):
; this template's "medium" is explicitly "zero injected tokens" -- a deliberate no-op
; kept only to avoid being worse than the official template's hardcoded xhigh, not a
; genuine mitigation (the template has an explicit brevity instruction for `low`, none
; for `medium`). Separately, --reasoning-preserve defaults to enabled, re-rendering
; every past turn's full reasoning_content back into the prompt on every subsequent
; request -- confirmed in the live logs as the dominant growth driver (single turns
; generating 4,000-9,700+ tokens, multi-thousand-token jumps between turns). Neither
; setting is specific to the Uncensored quant; both are the template's and the
; engine's own defaults, so the same reasoning applies to the UD-IQ3_S/Q3_K_XL
; siblings above if they show the same growth pattern in practice -- not yet checked.
[Qwen3.8-27B-Uncensored-GSQ-RCO-IQ3_XXS--cuda0]
ctx-size = 65536
parallel = 1
reasoning-format = deepseek
cache-type-k = q8_0
cache-type-v = q8_0
model = /models/RentedNoodle--Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-v1.1.gguf
chat-template-file = /opt/llama-cpp/chat-templates/qwen3.8-27b-uncensored-tool-use.jinja
reasoning-effort = low
reasoning-preserve = 0
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
n-gpu-layers = all
device = CUDA0
split-mode = none

[Qwen3.8-27B-Uncensored-GSQ-RCO-IQ3_XXS--cuda1]
ctx-size = 65536
parallel = 1
reasoning-format = deepseek
cache-type-k = q8_0
