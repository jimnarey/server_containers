; MoE models too large for one 16 GiB card whole (17.3-20.5 GiB) but under the 32 GiB
; combined budget: n-cpu-moe (below) offloads experts to host RAM on the single-GPU
; variants. Each n-cpu-moe value leaves enough headroom for ctx-size = 131072 plus
; workspace. The "-Expert-Offload" ID suffix makes the offload explicit in the name;
; the --cuda0-cuda1 twins are fully GPU-resident and so use the plain ID.
; Qwen3-Coder-30B: 17.3 GiB, 48 layers, 128 experts/8 active. Weakest of the group on
; independent benchmarks, kept for completeness rather than as a first choice for
; agentic work. Tight fit at 131072 (~0.6 GiB headroom).
