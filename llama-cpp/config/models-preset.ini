; Dense Q4_K_M/Q5_K_M/Q6_K_M quants of Qwen3.8-27B do not fit solo on one 16 GiB card
; at any context (weights alone are ~15.2+ GiB) -- they exist only as
; --cuda0-cuda1. IQ3_S and Q3_K_XL are real 3-bit Unsloth Dynamic v3.0 quants (there
; is no literal "Q3_K_M" for this model; Unsloth ships IQ3_XXS/IQ3_S/Q3_K_XL in that
; tier), sized for one card.
; reasoning-budget guards against runaway reasoning -- a property of the chat
; template/sampling behaviour, not specific to one model or fork; the message
; nudges the model to take a concrete action. Same on all Qwen3.8-27B entries.
; ctx-size = 65536 is the confirmed-good single-card ceiling from a real
; decode-at-depth sweep (performance-findings.md, "Maximising performance on a
; single card"): the usable headroom runs out well before the model's limit, and a
; higher value (98304) already cost decode throughput at ordinary (8K+) depths.
; 2026-10-03: reasoning-effort set to low and reasoning-preserve disabled on every
; Qwen3.8-27B entry (previously: Q6_K_M alone had low, every other quant had medium,
; none had reasoning-preserve set). This official Qwen3.8 template's "medium" is
; "zero injected tokens" by design -- a no-op kept only to avoid being worse than
; the template's own hardcoded xhigh default, not a real mitigation (confirmed
; against the template source: an explicit brevity instruction exists for `low`,
; none for `medium`). --reasoning-preserve defaults to enabled, re-rendering every
; past turn's full reasoning_content back into the prompt on every subsequent
; request. A real DSH session on Qwen3.8-27B-UD-IQ3_S--cuda1 independently measured
; 76.9K characters of reasoning against 7.1K of visible text across one session
; (amiga-ui/docs/sessions/20260923T2238Z-...context-limit-failed.md) -- the same
; pattern found directly in llama-cpp-c's own request logs for a different model
; (Qwen3.8-27B-Uncensored-GSQ-RCO-IQ3_XXS--cuda1) the same day via VSCode. Neither
; setting is specific to one quant, placement, or consumer (DSH vs VSCode); both
; are the template's and the engine's own defaults.
[Qwen3.8-27B-UD-IQ3_S--cuda0]
ctx-size = 65536
parallel = 1
reasoning-format = deepseek
cache-type-k = q8_0
cache-type-v = q8_0
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
reasoning-effort = low
reasoning-preserve = 0
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
n-gpu-layers = all
device = CUDA0
split-mode = none

[Qwen3.8-27B-UD-IQ3_S--cuda1]
ctx-size = 65536
parallel = 1
reasoning-format = deepseek
cache-type-k = q8_0
cache-type-v = q8_0
model = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
reasoning-effort = low
reasoning-preserve = 0
reasoning-budget = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
n-gpu-layers = all
device = CUDA1
split-mode = none

