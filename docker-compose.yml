# The default full stack. Start a subset by passing only the relevant files,
# for example: docker compose -f compose.bases.yml -f compose.ai.yml up -d deepseek
include:
  - path: compose.bases.yml
  - path: compose.ai.yml
  # Preserve the current Amiga-focused harness environment as the aggregate
  # stack's default. Select projects/xbox360/compose.yml explicitly instead
  # when working on the Xbox 360 project.
  - path: projects/amiga/compose.yml
    # The project overlays are also usable with `-f` from this repository.
    # Keep their build paths rooted here in both invocation styles.
    project_directory: .
  - path: compose.emulation.yml
  - path: compose.hardware.yml
  - path: compose.nas.yml
  - path: compose.network.yml
  - path: compose.desktop.yml

# `include` retains the base service image when it merges a project build
# definition. Pin the aggregate stack's selected project tags here so an
# Amiga build never overwrites a reusable :core harness image. Explicit
# `-f ... -f projects/<name>/compose.yml` invocations retain the tags in those
# project files and are unaffected.
services:
  deepseek:
    image: deepseek-harness:amiga

  pi:
    image: pi-coding-agent:amiga
