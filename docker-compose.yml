# The default full stack. Start a subset by passing only the relevant files,
# for example: docker compose -f compose.bases.yml -f compose.ai.yml up -d deepseek
include:
  - path: compose.bases.yml
  - path: compose.ai.yml
  - path: compose.emulation.yml
  - path: compose.hardware.yml
  - path: compose.nas.yml
  - path: compose.network.yml
  - path: compose.desktop.yml
