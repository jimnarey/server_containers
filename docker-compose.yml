x-defaults: &defaults
  environment:
    USERID: "1000"
    GROUPID: "1000"
    CADDY_USER: "admin"
    CADDY_HASH: ${CADDY_HASH}

services:

  base-ubuntu-22:
    image: base-ubuntu-22:latest
    build: ./base-ubuntu-22
    profiles: ["base"]

  base-ubuntu-24:
    image: base-ubuntu-24:latest
    build: ./base-ubuntu-24
    profiles: ["base"]

  base-ubuntu-caddy-22:
    image: base-ubuntu-caddy-22:latest
    build: ./base-ubuntu-caddy-22
    profiles: ["base"]

  base-ubuntu-caddy-24:
    image: base-ubuntu-caddy-24:latest
    build: ./base-ubuntu-caddy-24
    profiles: ["base"]

  base-ubuntu-gui-22:
    image: base-ubuntu-gui-22:latest
    build: ./base-ubuntu-gui-22
    profiles: ["base"]

  base-ubuntu-gui-24:
    image: base-ubuntu-gui-24:latest
    build: ./base-ubuntu-gui-24
    profiles: ["base"]

  base-ubuntu-kde-24:
    image: base-ubuntu-kde-24:latest
    build: ./base-ubuntu-kde-24
    profiles: ["base"]

  base-ubuntu-kde-wine-24:
    image: base-ubuntu-kde-wine-24:latest
    build: ./base-ubuntu-kde-wine-24
    profiles: ["base"]

  base-ubuntu-wine-24:
    image: base-ubuntu-wine-24:latest
    build: ./base-ubuntu-wine-24
    profiles: ["base"]

  base-ubuntu-xfce-22:
    image: base-ubuntu-xfce-22:latest
    build: ./base-ubuntu-xfce-22
    profiles: ["base"]

  base-ubuntu-xfce-24:
    image: base-ubuntu-xfce-24:latest
    build: ./base-ubuntu-xfce-24
    profiles: ["base"]

  calibre:
    build: ./calibre
    image: calibre:latest
    volumes:
      - calibre-home:/home/runuser
      - ${CALIBRE_LIBRARY}:/library
      - ${CALIBRE_SOURCE}:/source
    ports:
      - "9001:8081"
      - "9002:8083"
    <<: *defaults
    container_name: calibre-c

  comfyui:
    build:
      context: ./comfy-ui
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.29.2}
        TORCH_VERSION: ${COMFYUI_TORCH_VERSION:-2.11.0}
        TORCHVISION_VERSION: ${COMFYUI_TORCHVISION_VERSION:-0.26.0}
        TORCHAUDIO_VERSION: ${COMFYUI_TORCHAUDIO_VERSION:-2.11.0}
        PYTORCH_INDEX_URL: ${COMFYUI_PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: comfyui:latest
    container_name: comfyui-c
    restart: unless-stopped
    init: true
    environment:
      USERID: "1000"
      GROUPID: "1000"
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: ${CADDY_HASH:?CADDY_HASH is required}
      COMFYUI_EXTRA_ARGS: ${COMFYUI_EXTRA_ARGS:-}
      HF_HUB_CACHE: /models/huggingface
      HF_TOKEN: ${COMFYUI_HF_TOKEN:-}
    volumes:
      - ${COMFYUI_MODELS:-/mnt/data/models/comfyui}:/models
      - ${COMFYUI_INPUT:-/mnt/data/generation/input}:/data/input
      - ${COMFYUI_OUTPUT:-/mnt/data/generation/output}:/data/output
      - ${COMFYUI_USER:-/mnt/work/comfyui/user}:/data/user
      - ${COMFYUI_CUSTOM_NODES:-/mnt/work/comfyui/custom_nodes}:/opt/ComfyUI/custom_nodes
    ports:
      - "${COMFYUI_BIND_ADDRESS:-192.168.50.136}:${COMFYUI_PORT:-9034}:8081"
    gpus: all
    shm_size: "2gb"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  clrmamepro:
    build: ./clrmamepro
    image: clrmamepro:latest
    volumes:
      - clrmamepro-home:/home/runuser
      - clrmamepro-app:/app
      - /mnt:/host_mnt
      - /media:/host_media
    ports:
      - "9003:8081"
    <<: *defaults
    container_name: clrmamepro-c

  deepseek:
    build:
      context: ./deepseek
      args:
        DEEPSEEK_VERSION: ${DEEPSEEK_VERSION:-0.1.1-rc.2}
    image: deepseek-harness:latest
    container_name: deepseek-c
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      HOME: /home/runuser
      USER: runuser
      LOGNAME: runuser
      DSH_HOME: /home/runuser/.dsh
      SSH_CONNECTION: "1 1 1 1"
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_INSTALL_DIR: /home/runuser/.local/share/uv/python
      UV_PYTHON_PREFERENCE: managed
    volumes:
      - ${DEEPSEEK_HOME:-/mnt/work/deepseek}:/home/runuser
      - ${DEEPSEEK_WORKSPACE:-/mnt/work/projects}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    ports:
      - "${DEEPSEEK_BIND_ADDRESS:-127.0.0.1}:${DEEPSEEK_PORT:-9035}:3081"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:3080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stdin_open: true
    tty: true

  desktop-kde:
    build: ./desktop-kde
    image: desktop-kde:latest
    volumes:
      - kde-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9024:8081"
    <<: *defaults
    container_name: kde-c

  desktop-xfce:
    build: ./desktop-xfce
    image: desktop-xfce:latest
    volumes:
      - desktop-xfce-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9026:8081"
    <<: *defaults
    container_name: desktop-xfce-c

  desktop-dropbox:
    build: ./desktop-dropbox
    image: desktop-dropbox:latest
    volumes:
      - desktop-dropbox-home:/home/runuser
      - ${DROPBOX_FOLDER}:/home/runuser/Dropbox
    ports:
      - "9005:8081"
    <<: *defaults
    container_name: desktop-dropbox-c

  double-commander:
    build: ./double-commander
    image: double-commander:latest
    volumes:
      - double-commander-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9004:8081"
    <<: *defaults
    container_name: double-commander-c

  # dropbox-gui:
  #   build: ./dropbox-gui
  #   image: dropbox-gui:latest
  #   volumes:
  #     - dropbox-gui-home:/home/runuser
  #     - ${DROPBOX_FOLDER}:/home/runuser/Dropbox
  #   ports:
  #     - "9005:8081"
  #   <<: *defaults
  #   container_name: dropbox-gui-c

  exodos:
    build: ./exodos
    image: exodos:latest
    volumes:
      - exodos-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9027:8081"
    privileged: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    <<: *defaults
    container_name: exodos-c

  expressvpn:
    build: ./expressvpn
    image: expressvpn:latest
    container_name: expressvpn-c
    cap_add:
      - NET_ADMIN
    devices: 
      - /dev/net/tun
    stdin_open: true
    tty: true
    command: /bin/bash
    privileged: true
    restart: unless-stopped
    ports:
      - 9092:9091

  filezilla:
    build: ./filezilla
    image: filezilla:latest
    volumes:
      - filezilla-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9006:8081"
    <<: *defaults
    container_name: filezilla-c

  gdmenu-cm:
    build: ./gdmenu-cm
    image: gdmenu-cm:latest
    volumes:
      - gdmenu-cm-home:/home/runuser
      - build-gdmenu-cm-app:/app
      - /mnt:/host_volumes
      # The following variable was populed in the Makefile using this line at the top:
      # EXT_VOLUMES_MAPPING := $(shell ./get_ext_volumes_map.sh nas runuser)
      # - ${EXT_VOLUMES_MAPPING}
    ports:
      - "9007:8081"
    <<: *defaults
    container_name: gdmenu-cm-c

  hexchat:
    build: ./hexchat
    image: hexchat:latest
    volumes:
      - hexchat-home:/home/runuser
    ports:
      - "9008:8081"
    <<: *defaults
    container_name: hexchat-c

  goose:
    build:
      context: ./goose
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-1.45.0}
    image: goose:latest
    volumes:
      - goose-home:/home/runuser
      - ${GOOSE_WORKSPACE:-/mnt}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    ports:
      - "9031:8081"
    stdin_open: true
    tty: true
    <<: *defaults
    container_name: goose-c

  inkscape:
    build: ./inkscape
    image: inkscape:latest
    volumes:
      - inkscape-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9009:8081"
    <<: *defaults
    container_name: inkscape-c

  jrom-manager:
    build: ./jrom-manager
    image: jrom-manager:latest
    volumes:
      - jrom-manager-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9011:8081"
    <<: *defaults
    container_name: jrom-manager-c

  laserweb:
    build: ./laserweb
    image: laserweb:latest
    volumes:
      - laserweb-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9010:8081"
    privileged: true
    <<: *defaults
    container_name: laserweb-c

  lasergrbl-install:
    build: ./lasergrbl-install
    image: lasergrbl-install:latest
    volumes:
      - lasergrbl-home:/home/runuser
    ports:
      - "9015:8081"
    privileged: true
    <<: *defaults
    container_name: lasergrbl-install-c

  lasergrbl:
    build: ./lasergrbl
    image: lasergrbl:latest
    volumes:
      - lasergrbl-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9016:8081"
    privileged: true
    <<: *defaults
    container_name: lasergrbl-c

  lightburn:
    build: ./lightburn
    image: lightburn:latest
    volumes:
      - lightburn-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9012:8081"
    privileged: true
    <<: *defaults
    container_name: lightburn-c

  lightburn-win-install:
    build: ./lightburn-win-install
    image: lightburn-win-install:latest
    volumes:
      - lightburn-win-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9013:8081"
    privileged: true
    <<: *defaults
    container_name: lightburn-win-install-c

  lightburn-win:
    build: ./lightburn-win
    image: lightburn-win:latest
    volumes:
      - lightburn-win-home:/home/runuser
      - ${LASER_CUTTING_ROOT}:/lasercutting
    ports:
      - "9014:8081"
    privileged: true
    <<: *defaults
    container_name: lightburn-win-c

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_TAG:-server-cuda13}
    container_name: llama-cpp-c
    restart: unless-stopped
    gpus: all
    volumes:
      - ${LLAMA_CPP_MODELS:-/mnt/data/models/gguf/unsloth/Qwen3.8-27B-GGUF}:/models:ro
      - ./llama-cpp/models-preset.ini:/models-preset.ini:ro
    command:
      - --models-dir
      - /models
      - --models-preset
      - /models-preset.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - ${LLAMA_CPP_PARALLEL:-1}
      - --n-gpu-layers
      - all
      - --split-mode
      - layer
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - on
      - --fit
      - on
      - --fit-target
      - ${LLAMA_CPP_FIT_TARGET:-1024}
      - --no-webui
      - --metrics
    ports:
      - "${LLAMA_CPP_BIND_ADDRESS:-192.168.50.136}:${LLAMA_CPP_PORT:-11436}:8080"

  meganz:
    build: ./meganz
    image: meganz:latest
    env_file:
      - .env
    volumes:
      - meganz-home:/home/runuser
      - ${MEGANZ_LOCAL}:/meganz_local
    ports:
      - "9017:8081"
    container_name: meganz-c

  nkit:
    build: ./nkit
    image: nkit:latest
    volumes:
      - nkit-home:/home/runuser
      - nkit-app:/app
      - /mnt:/host_mnt
      - /media:/host_media
    ports:
      - "9018:8081"
    <<: *defaults
    container_name: nkit-c

  octoprint:
    build: ./octoprint
    image: octoprint:latest
    volumes:
      - octoprint-app:/octoprint
      - octoprint-home:/home-runuser
      - /dev:/dev
    ports:
      - "9019:80"
    environment:
      ENABLE_MJPG_STREAMER: "true"
    privileged: true
    container_name: octoprint-c

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    volumes:
      - ollama-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models
      - /mnt/data/models/gguf:/models/gguf:ro
      - /mnt/work/ollama-nvidia-cache:/root/.nv
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "192.168.50.136:11434:11434"
    restart: unless-stopped
    container_name: ollama-c
    gpus: all

  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ollama-cpu-c
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    ports:
      - "192.168.50.136:11435:11434"
    restart: unless-stopped
    volumes:
      - ollama-cpu-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models:ro

  openhands:
    build: ./openhands
    image: openhands-agent-canvas:1.7.0
    container_name: openhands-c
    user: "1000:1000"
    restart: unless-stopped
    environment:
      LOCAL_BACKEND_API_KEY: "${OPENHANDS_API_KEY:?OPENHANDS_API_KEY is required}"
      OH_SECRET_KEY: "${OPENHANDS_SECRET_KEY:?OPENHANDS_SECRET_KEY is required}"
      GIT_CONFIG_GLOBAL: /home/openhands/.openhands/gitconfig
    volumes:
      - /mnt/work/openhands:/home/openhands/.openhands
      - /mnt/work/projects:/projects
    ports:
      - "192.168.50.136:9030:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  opencode:
    build:
      context: ./opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.9}
    image: opencode:latest
    container_name: opencode-c
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
    volumes:
      - opencode-home:/home/runuser
      - ${OPENCODE_WORKSPACE:-/mnt/work/projects}:/workspace
    ports:
      - "192.168.50.136:9032:4096"
    stdin_open: true
    tty: true

  retroarch-web:
    build: ./retroarch-web
    image: retroarch-web:latest
    volumes:
      - retroarch-web-home:/home/runuser
    ports:
      - "9020:8081"
    <<: *defaults
    container_name: retroarch-web-c

  simple-arcade-multifilter:
    build: ./simple-arcade-multifilter
    image: simple-arcade-multifilter:latest
    volumes:
      - simple-arcade-multifilter-home:/home/runuser
      - simple-arcade-multifilter-app:/app
      - /mnt:/host_mnt
      - /media:/host_media
    ports:
      - "9021:8081"
    <<: *defaults
    container_name: simple-arcade-multifilter-c

  transmission:
    build:
      context: ./transmission
      args:
        TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD}
    image: transmission:latest
    volumes:
      - transmission-home:/home/runuser
      - /mnt:/host_volumes
    ports:
      - "9091:9091"
      - "51413:51413"
    <<: *defaults
    container_name: transmission-c

  vscode:
    build:
      context: ./vscode
      args:
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.132.0}
    image: vscode:latest
    volumes:
      - vscode-home:/home/runuser
      - ${VSCODE_WORKSPACE:-/mnt/work}:/workspace
    ports:
      - "9033:8081"
    <<: *defaults
    container_name: vscode-c

  webdav-apache:
    build:
      context: ./webdav-apache
      args:
        - WEBDAV_USERNAME=${WEBDAV_USERNAME:-webdav}
        - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-password}
    image: webdav-apcahe:latest
    ports:
      - "9023:80"
    volumes:
      - webdav-apache-home:/home/runuser
      - "${WEBDAV_ROOT}:/var/www/html/webdav"
    container_name: webdav-apache-c

  webdav:
    build: ./webdav
    image: webdav:latest
    volumes:
      - webdav-home:/home/runuser
      - "${WEBDAV_ROOT}:/webdav"
    ports:
      - "9022:8081"
    <<: *defaults
    container_name: webdav-c

volumes:
  calibre-home:
  clrmamepro-home:
  clrmamepro-app:
  desktop-xfce-home:
  desktop-dropbox-home:
  double-commander-home:
  # dropbox-gui-home:
  exodos-home:
  filezilla-home:
  gdmenu-cm-home:
  build-gdmenu-cm-app:
  hexchat-home:
  goose-home:
  jrom-manager-home:
  kde-home:
  inkscape-home:
  laserweb-home:
  lightburn-home:
  lightburn-win-home:
  lasergrbl-home:
  meganz-home:
  nkit-home:
  nkit-app:
  octoprint-app:
  octoprint-home:
  ollama-cpu-home:
  ollama-home:
  opencode-home:
  retroarch-web-home:
  simple-arcade-multifilter-home:
  simple-arcade-multifilter-app:
  transmission-home:
  vscode-home:
  webdav-apache-home:
  webdav-home:
  xfce-vpn-home:


  
