; Canonical catalogue for the GenerelSchwerz MoE-cache routers. These are the
; downloaded large sparse models only. The services intentionally omit
; --models-dir, so no raw publisher/directory IDs are visible or selectable.
; The 16 GiB and 32 GiB services each bind-mount their own copy under /mnt/work.
version = 1

[*]
; Model settings live here rather than in /etc/llama.cpp/config.ini, whose
; service-level options take precedence over model-specific settings.
ctx-size = 65536
parallel = 1
load-mode = none

[gemma-4-26B-A4B-it-Q4_0]
model = /models/ggml-org--gemma-4-26B-A4B-it--Q4_0/gemma-4-26B-A4B-it-Q4_0.gguf

[granite-4.0-h-small-Q4_K_M]
