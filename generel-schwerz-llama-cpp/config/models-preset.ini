; Canonical catalogue for the GenerelSchwerz MoE-cache routers. Every listed
; GGUF has an expert_count/expert_used_count in its metadata and its weights
; exceed one 16 GiB GPU, so the fork's CUDA expert cache can potentially
; improve decode. Do not add dense models or MoEs which fit on one GPU: they
; have no reason to occupy these specialist services. The services intentionally
; omit --models-dir, so no raw publisher/directory IDs are visible or selectable.
; The 16 GiB and 32 GiB services each bind-mount their own copy under /mnt/work.
version = 1

[*]
; Model settings live here rather than in /etc/llama.cpp/config.ini, whose
; service-level options take precedence over model-specific settings. The
; normal MoE baseline keeps ordinary layers on the host; Flash Next overrides
; this below to put its reusable dense core on CUDA.
ctx-size = 65536
parallel = 1
load-mode = none
n-gpu-layers = 0

[granite-4.0-h-small-Q4_K_M]
model = /models/ibm-granite--granite-4.0-h-small-GGUF/granite-4.0-h-small-Q4_K_M.gguf

[Qwen3.6-35B-A3B-Q4_K_M]
model = /models/infatoshi--Qwen3.6-35B-A3B--Q4_K_M/Qwen3.6-35B-A3B-Q4_K_M.gguf

[Ornith-1.5-35B-Q4_K_M]
model = /models/ornith-ai--Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf

[Laguna-XS-2.1-Q4_K_M]
model = /models/poolside--Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
; The router's CUDA expert cache still keeps routed experts host-backed; put
; the small, every-token shared/dense core on CUDA instead of making it a CPU
; decode bottleneck.  Do not use Flash Next's PLE override: this model has no
; corresponding per_layer_token_embd tensor.
n-gpu-layers = all
fit = off

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
; As above, experts remain governed by --moe-expert-cache-size while the
; always-used non-expert layers are resident on CUDA.
n-gpu-layers = all
fit = off

[GLM-4.7-Flash-Q4_K_M]
model = /models/unsloth--GLM-4.7-Flash-GGUF/GLM-4.7-Flash-Q4_K_M.gguf

[Qwen3-Coder-30B-A3B-Instruct-Q4_K_M]
model = /models/unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf

[Qwen3.5-35B-A3B-Q4_K_M]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-Q4_K_M.gguf

[Qwen3.5-35B-A3B-UD-Q6_K_XL]
model = /models/unsloth--Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-Q6_K_XL.gguf

[Qwen3.8-Flash-Next-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-Flash-Next--UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
; Keep only the phrase/PLE table on the host. The CUDA expert-cache override
; retains routed experts on the host with its own GPU LRU, while `all` puts
; Flash Next's dense, every-token core on the selected GPU(s).
n-gpu-layers = all
override-tensor = per_layer_token_embd=CPU
fit = off
; First long-context step for this near-host-RAM-capacity model.  Keep all
; other specialist presets at 64K until this has been exercised under load.
ctx-size = 98304
load-mode = mmap
lazy-mode = on
