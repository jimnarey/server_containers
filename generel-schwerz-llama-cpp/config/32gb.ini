# Copy to /mnt/work/generel-schwerz-llama-cpp/32gb/config/config.ini.
# This is a system-level llama.cpp configuration for every model in the
# explicit models-preset.ini catalogue. Per-model context/load settings belong
# in that preset because system settings take precedence in router mode.
[*]
threads               = 8
threads-batch         = 8
batch-size            = 8192
ubatch-size           = 512
# The MoE cache itself uses CUDA.  Keep the model's ordinary tensors on the
# host: `all` tries to place Qwen3.8 Flash Next's ~29 GiB non-expert tensor
# on one 16 GiB card before the cache can be used.
n-gpu-layers          = 0
split-mode            = layer
tensor-split          = 1,1
kv-offload            = true
cache-type-k          = q8_0
cache-type-v          = q8_0
flash-attn            = on
moe-expert-cache-size = 64
