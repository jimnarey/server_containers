# Copy to /mnt/work/generel-schwerz-llama-cpp/16gb/config/config.ini.
# This is a system-level llama.cpp configuration: settings apply to any model
# selected from the service's /models router directory.
[*]
threads               = 8
threads-batch         = 8
ctx-size              = 65536
parallel              = 1
batch-size            = 8192
ubatch-size           = 512
load-mode             = none
n-gpu-layers          = all
split-mode            = none
main-gpu              = 0
kv-offload            = true
cache-type-k          = q8_0
cache-type-v          = q8_0
flash-attn            = on
moe-expert-cache-size = 32
