# Copy to /mnt/work/generel-schwerz-llama-cpp/16gb/config/config.ini.
# This system-level file is deliberately limited to settings which are shared by
# every model on the one-GPU service. Per-model placement, context, and load
# settings belong in models-preset.ini, because system settings take precedence
# over model settings in router mode.
[*]
threads               = 8
threads-batch         = 8
# 2026-09-15: raised from 512 to improve prompt-processing throughput after
# the dual-GPU forks (generel-schwerz 32gb, csantiago78) were abandoned as
# not working; the two-GPU service's own 8192 was never itself proven on
# real hardware, so this is a deliberate incremental step, not a jump to
# that number. Watch VRAM headroom (nvidia-smi) and confirm a real request
# still serves correctly before raising further.
batch-size            = 2048
ubatch-size           = 1024
split-mode            = none
main-gpu              = 0
kv-offload            = true
cache-type-k          = q8_0
cache-type-v          = q8_0
flash-attn            = on
# 2026-09-15: raised from 32 towards the ~5.3 GiB of VRAM headroom measured
# during normal operation on this card, to reduce host<->GPU expert-swap
# traffic. Incremental step, not a proven ceiling -- confirm the model still
# loads and serves before raising further.
moe-expert-cache-size = 48
# The 2026-09-15 host-menu-strip session ran one turn for 5h41m, 246,060
# reasoning characters against 606 characters of actual answer text, and
# ended on max-tokens having written no code -- the model kept re-deriving
# the same ABI question rather than committing to a concrete check. This
# forces a stop: once thinking exceeds the budget, the server ends the
# <think> block and injects the message below, pushing the model toward an
# action instead of letting it run to the much larger maxTokens ceiling.
# See docs/sessions/20260915T0057Z-session-log-host-menu-strip-failed.md.
reasoning-budget         = 8000
reasoning-budget-message = You have exceeded your reasoning budget. Take a concrete action before proceeding. Note the tools available to you, including via bash.
