# Copy to /mnt/work/generel-schwerz-llama-cpp/16gb/config/config.ini.
# This system-level file is deliberately limited to settings which are shared by
# every model on the one-GPU service. Per-model context/load settings belong in
# models-preset.ini, because system settings take precedence in router mode.
[*]
threads               = 8
threads-batch         = 8
batch-size            = 512
ubatch-size           = 256
n-gpu-layers          = 0
split-mode            = none
main-gpu              = 0
kv-offload            = true
cache-type-k          = q8_0
cache-type-v          = q8_0
flash-attn            = on
moe-expert-cache-size = 32
