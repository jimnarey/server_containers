; Canonical catalogue for the GenerelSchwerz MoE-cache 16GB (single-GPU)
; router. This service is a LAST RESORT for MoE models that do not fit
; within this host's combined 32 GiB of VRAM at all -- not a general-purpose
; MoE catalogue. A model belongs here only if BOTH:
;   1. it is a genuine MoE (expert_count/expert_used_count in its metadata),
;      AND its weights exceed 32 GiB, so it cannot run via an ordinary
;      dual-GPU split on the plain llama-cpp service; and
;   2. it actually supports this fork's hybrid host/GPU expert-cache
;      approach (an architecture the fork can place experts for).
; Anything that fits within 32 GiB combined -- MoE or dense -- belongs on
; the plain llama-cpp service instead, using an ordinary GPU split, where it
; will run faster with no host-RAM dependency; declaring it here instead
; would only make it run on CPU for no reason, which defeats the point of a
; GPU-cache specialist service. Every model declared below MUST actually run
; on GPU (`n-gpu-layers = all`, not the `[*]` CPU-only default) -- if a
; model can't be made to use the GPU here, it doesn't belong in this file
; either. The service intentionally omits --models-dir, so no raw
; publisher/directory IDs are visible or selectable -- only what's declared
; below is reachable at all.
;
; 2026-09-17: trimmed to this rule. Eight models that fit comfortably within
; 32 GiB (17-30 GiB each: granite-4.0-h-small, Qwen3.6-35B-A3B,
; Ornith-1.5-35B, Laguna-XS-2.1, GLM-4.7-Flash, Qwen3-Coder-30B-A3B-Instruct,
; both Qwen3.5-35B-A3B quants) were removed -- they had been sitting here
; running on the `[*]` CPU-only default the whole time, gaining nothing from
; this service's GPU. They remain downloaded and available for the plain
; llama-cpp service to pick up with an ordinary GPU split.
;
; This is the 16GB-specific template (see models-preset-32gb.ini for the
; two-GPU one). The two diverged 2026-09-16: the 32GB service now builds from
; a different fork commit (codex/moe-grouped-multigpu) with real constraints
; this file's models don't have to satisfy -- see that file's header before
; assuming a model belongs equally in both.
version = 1

[*]
; Model settings live here rather than in /etc/llama.cpp/config.ini, whose
; service-level options take precedence over model-specific settings. The
; normal MoE baseline keeps ordinary layers on the host; models with a large
; always-resident dense/shared core override this below to put it on CUDA.
ctx-size = 65536
parallel = 1
load-mode = none
n-gpu-layers = 0

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
; The router's CUDA expert cache still keeps routed experts host-backed; put
; the small, every-token shared/dense core on CUDA instead of making it a CPU
; decode bottleneck.  Do not use Flash Next's PLE override: this model has no
; corresponding per_layer_token_embd tensor.
n-gpu-layers = all
fit = off

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
; As above, experts remain governed by --moe-expert-cache-size while the
; always-used non-expert layers are resident on CUDA.
n-gpu-layers = all
fit = off

[Qwen3.8-Flash-Next-UD-Q3_K_XL]
model = /models/unsloth--Qwen3.8-Flash-Next--UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
; Keep only the phrase/PLE table on the host. The CUDA expert-cache override
; retains routed experts on the host with its own GPU LRU, while `all` puts
; Flash Next's dense, every-token core on the selected GPU(s).
n-gpu-layers = all
override-tensor = per_layer_token_embd=CPU
fit = off
; First long-context step for this near-host-RAM-capacity model.  Keep all
; other specialist presets at 64K until this has been exercised under load.
ctx-size = 98304
load-mode = mmap
lazy-mode = on

; 2026-09-16: added following the model-broker research pass in this same
; session. moe-expert-cache-size is a genuine guess, not a measurement: sized
; to roughly 2x each model's real expert_used_count (the ratio the multi-GPU
; fork's own conservative example used for Gemma-4-26B-A4B: 16 slots for 8
; active), nothing more. Verify VRAM headroom with a real load before
; trusting these, per this directory's README section "Verifying a
; config.ini change actually took effect".
;
; 2026-09-17 correction: all three are LARGER on disk (62.8-67.7 GiB) than
; this host's actual RAM (confirmed 60 GiB via `free -h`, not the 64 GiB
; earlier planning assumed). The 32GB service's codex/moe-grouped-multigpu
; pin forced `load-mode = none` on gpt-oss-120b and GLM-4.5-Air there and
; both went into full swap thrashing (RAM and the entire 8 GiB swapfile
; maxed, 0% GPU utilization, ~1-3 tok/s decode) -- direct evidence that
; anything this size needs mmap's lazy-fault elasticity to be viable on this
; host at all, exactly like Flash Next, PLE tensor or not. The [*] default
; here is `load-mode = none`; all three now override it to mmap, matching
; Flash Next's own pattern, instead of silently inheriting the setting that
; just caused that failure on the other service.

[gpt-oss-120b-Q4_K_M]
model = /models/unsloth--gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf
; 128 experts, 4 active (confirmed via gguf metadata, same active ratio as
; the already-benchmarked gpt-oss-20b sibling). No PLE-equivalent tensor, but
; still bigger than host RAM -- needs mmap for the same reason Flash Next
; does, not because of a giant single tensor.
n-gpu-layers = all
fit = off
load-mode = mmap
lazy-mode = on
moe-expert-cache-size = 8

[Llama-4-Scout-17B-16E-Instruct-Q4_K_M]
model = /models/unsloth--Llama-4-Scout-17B-16E-Instruct-GGUF/Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf
; Only 16 total experts, 1 routed + 1 shared active per token -- a very
; different shape from every other model here (few, large experts rather
; than many small ones). Each expert is estimated at ~3.7 GiB (parameter-
; count derived, not measured -- see the broker-research conversation this
; session). Cache size kept low and conservative given that per-expert cost;
; raise only after confirming actual VRAM headroom. mmap required -- see
; 2026-09-17 note above; this is the largest of the three (65.4 GiB).
n-gpu-layers = all
fit = off
load-mode = mmap
lazy-mode = on
moe-expert-cache-size = 3

[GLM-4.5-Air-UD-Q4_K_XL]
model = /models/unsloth--GLM-4.5-Air-GGUF/UD-Q4_K_XL/GLM-4.5-Air-UD-Q4_K_XL-00001-of-00002.gguf
; 128 experts, 8 routed + 1 shared active (confirmed via published model
; config, not local gguf metadata -- verify once fully downloaded). mmap
; required -- see 2026-09-17 note above; this is the one that hit 0% GPU
; utilization on both cards under load-mode=none on the 32GB service.
;
; 2026-09-17: real load test failed with a genuine CUDA OOM, not a swap/mmap
; issue -- "moe-cache: cudaMalloc(51904512 bytes) failed: out of memory"
; during warmup decode, ~49.5 MiB short. cache-size=16 (2x the 9 active
; experts, the fork's own conservative default ratio) was simply too large
; for this card alongside the dense/shared core + 65536 ctx KV cache.
; Trimmed to 12 (still ~33% above the 9 active) to close that small gap --
; verify with a real load before trusting; raise again only after confirming
; headroom.
n-gpu-layers = all
fit = off
load-mode = mmap
lazy-mode = on
moe-expert-cache-size = 12
