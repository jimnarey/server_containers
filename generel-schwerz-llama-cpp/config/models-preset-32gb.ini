; Canonical catalogue for the GenerelSchwerz MoE-cache 32GB (two-GPU) router.
; Same last-resort rule as models-preset-16gb.ini: a model belongs here only
; if it's a genuine MoE that does NOT fit within this host's combined 32 GiB
; of VRAM (so an ordinary dual-GPU split on the plain llama-cpp service
; can't hold it), and only if this fork can actually place its experts.
; Anything that fits within 32 GiB belongs on the plain llama-cpp service
; with an ordinary GPU split instead -- declaring it here just because it's
; an MoE gains nothing (`n-gpu-layers = all` is already forced globally in
; 32gb.ini, so unlike the 16GB file there's no CPU-only-by-accident failure
; mode here, but a model that fits in 32 GiB has no reason to depend on this
; fork's host-RAM/expert-cache machinery at all when a plain split is
; simpler and has no host-RAM dependency).
;
; 2026-09-17: trimmed to this rule, mirroring models-preset-16gb.ini: the
; same eight models that fit within 32 GiB (granite-4.0-h-small,
; Qwen3.6-35B-A3B, Ornith-1.5-35B, Laguna-XS-2.1, GLM-4.7-Flash,
; Qwen3-Coder-30B-A3B-Instruct, both Qwen3.5-35B-A3B quants) were removed.
;
; 2026-09-16: this service now builds from codex/moe-grouped-multigpu
; (0ed73d1c9), NOT the 16GB service's qwen4exp-mtp pin -- see the docker-
; compose.yml comment on llama-cpp-generel-schwerz-32gb for why (issue #90,
; and this branch's real, physically-validated two-GPU expert cache).
;
; Real constraints that commit imposes, reflected below:
;
; 1. `load-mode = none` is REQUIRED, not mmap. The fork's own doc
;    (docs/moe-grouped-multigpu.md in that source tree): "Bounded pinning
;    with the default mmap load was rejected before inference because
;    read-only auxiliary registration is unsupported." Every model here uses
;    the [*] default of `load-mode = none`; none may override to mmap.
; 2. Because of (1), Qwen3.8-Flash-Next is NOT in this catalogue. Its PLE
;    table depends on mmap + lazy-mode to stay off host RAM entirely (see
;    models-preset-16gb.ini) -- without mmap it would need to eagerly load
;    its full ~84 GiB, which this branch does not support and which this
;    host cannot absorb regardless of the multi-GPU cache. Use the 16GB
;    service for Flash Next; it gets nothing from this one anyway (its
;    expert cache would still only run on whichever single device the
;    grouped-layer split happens to land its hottest layers on -- this
;    branch's benefit is layer-split placement, not a shared cross-GPU pool).
; 3. Decode-only benefit at this stage ("Stage A"): prefill still runs the
;    fork's older single-device path regardless of this config. Do not
;    expect the prefill speedups seen on the 16GB service's tuning work to
;    repeat here.
; 4. moe-expert-cache-size below is NOT tuned -- this whole profile has never
;    been run successfully before today. Each value is ~2x the model's real
;    expert_used_count (confirmed via gguf metadata unless noted), mirroring
;    the ratio the fork's own conservative reference example used (16 slots
;    for Gemma-4-26B-A4B's 8 active experts). Treat every number here as a
;    starting point to verify with a real load, per this directory's README
;    ("Verifying a config.ini change actually took effect") -- doubly so
;    here, since even the fork author's own doc calls their example
;    "a conservative starting configuration, not a measured optimum or a fit
;    guarantee."
;
; Unlike models-preset-16gb.ini, n-gpu-layers/fit/cpu-moe are NOT set per
; model here -- they're global in config.ini, because grouped layer-split
; placement needs every layer eligible for GPU placement (the whole point of
; assigning layers to two devices), not the mixed host/GPU split the 16GB
; single-device cache uses.
version = 1

[*]
ctx-size = 65536
parallel = 1

[Qwen3-Coder-Next-Q4_K_M]
model = /models/qwen--Qwen3-Coder-Next--Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
; 512 experts, 10 active.
moe-expert-cache-size = 20

[Qwen3-Next-80B-A3B-Instruct-Q4_K_M]
model = /models/qwen--Qwen3-Next-80B-A3B-Instruct--Q4_K_M/Qwen3-Next-80B-A3B-Instruct-Q4_K_M.gguf
; Same base architecture as Coder-Next: 512 experts, 10 active.
moe-expert-cache-size = 20

; 2026-09-16: added following the model-broker research pass in this same
; session, same caveats as models-preset-16gb.ini's equivalent entries.

[gpt-oss-120b-Q4_K_M]
model = /models/unsloth--gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf
; 128 experts, 4 active (confirmed via gguf metadata).
moe-expert-cache-size = 8

[Llama-4-Scout-17B-16E-Instruct-Q4_K_M]
model = /models/unsloth--Llama-4-Scout-17B-16E-Instruct-GGUF/Q4_K_M/Llama-4-Scout-17B-16E-Instruct-Q4_K_M-00001-of-00002.gguf
; Only 16 total experts, 1 routed + 1 shared active -- large experts
; (~3.7 GiB each, estimated). This is also the model the fork's doc names
; explicitly as unvalidated for real multi-GPU throughput ("no throughput
; improvement or optimal split ratio is claimed without measurement") --
; treat this entry as the most speculative one in this file.
moe-expert-cache-size = 3

[GLM-4.5-Air-UD-Q4_K_XL]
model = /models/unsloth--GLM-4.5-Air-GGUF/UD-Q4_K_XL/GLM-4.5-Air-UD-Q4_K_XL-00001-of-00002.gguf
; 128 experts, 8 active + 1 shared (published config; verify once fully
; downloaded -- file path here is the standard unsloth two-shard naming
; convention, not yet confirmed against the actual downloaded files).
moe-expert-cache-size = 16
