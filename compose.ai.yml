x-defaults: &defaults
  environment:
    USERID: "1000"
    GROUPID: "1000"
    CADDY_USER: "admin"
    CADDY_HASH: ${CADDY_HASH}

# The one-card services share the 16GB catalogue; the all-GPU service uses a
# separate 32GB catalogue. The image entrypoint takes non-blocking locks in
# the named volume below.
# GPU-profile services are deliberately started/stopped explicitly, so a lock
# conflict remains an exited error instead of an automatic restart loop.
x-llama-cpp-common: &llama-cpp-common
  image: llama-cpp:upstream-eafe15a5-cuda
  restart: "no"
  volumes:
    - ${LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
    - ${LLAMA_CPP_32GB_CONFIG:-/mnt/work/llama/llama-cpp-32gb/models-preset.ini}:/models-preset.ini:ro
    - llama-gpu-locks:/var/lock/llama-gpu
  command:
    - --models-preset
    - /models-preset.ini
    - --reasoning-format
    - deepseek
    - --models-max
    - "1"
    - --models-autoload
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    - --parallel
    - ${LLAMA_CPP_PARALLEL:-1}
    - --n-gpu-layers
    - all
    - --flash-attn
    - on
    - --fit
    - on
    - --fit-target
    - ${LLAMA_CPP_FIT_TARGET:-1024}
    - --no-webui
    - --metrics

services:

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    volumes:
      - ollama-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models
      - /mnt/data/models/gguf:/models/gguf:ro
      - /mnt/work/ollama-nvidia-cache:/root/.nv
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "192.168.50.136:11434:11434"
    restart: unless-stopped
    container_name: ollama-c
    gpus: all

  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ollama-cpu-c
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    ports:
      - "192.168.50.136:11435:11434"
    restart: unless-stopped
    volumes:
      - ollama-cpu-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models:ro

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_TAG:-latest}
    container_name: searxng-c
    restart: unless-stopped
    depends_on:
      - searxng-valkey
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-CHANGEME_SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://${SEARXNG_BIND_ADDRESS:-192.168.50.136}:${SEARXNG_PORT:-9036}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "${SEARXNG_BIND_ADDRESS:-192.168.50.136}:${SEARXNG_PORT:-9036}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey-c
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - searxng-valkey-data:/data

  # This preserves the former single-GPU service's catalogue and image, while
  # restricting device visibility to physical GPU 0.
  llama-cpp-gpu-0:
    <<: *llama-cpp-common
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
        LLAMA_SOURCE_NAME: ggml-org-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-gpu-0
        LLAMA_BRANCH: master
        LLAMA_COMMIT: eafe15a5e3d87dd68ae33acf6a7cbd9415a0ac5e
        LLAMA_CUDA: "ON"
    container_name: llama-cpp-gpu-0-c
    environment:
      LLAMA_GPU_LOCK_IDS: ${LLAMA_CPP_GPU_0_DEVICE_ID:-0}
    volumes:
      - ${LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - ${LLAMA_CPP_16GB_CONFIG:-/mnt/work/llama/llama-cpp-16gb/models-preset.ini}:/models-preset.ini:ro
      - llama-gpu-locks:/var/lock/llama-gpu
    gpus:
      - driver: nvidia
        device_ids: ["${LLAMA_CPP_GPU_0_DEVICE_ID:-0}"]
        capabilities: [gpu]
    ports:
      - "${LLAMA_CPP_GPU_0_BIND_ADDRESS:-192.168.50.136}:${LLAMA_CPP_GPU_0_PORT:-11441}:8080"

  # Identical to gpu-0 except for its exclusive physical-GPU assignment.
  llama-cpp-gpu-1:
    <<: *llama-cpp-common
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
        LLAMA_SOURCE_NAME: ggml-org-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-gpu-1
        LLAMA_BRANCH: master
        LLAMA_COMMIT: eafe15a5e3d87dd68ae33acf6a7cbd9415a0ac5e
        LLAMA_CUDA: "ON"
    container_name: llama-cpp-gpu-1-c
    environment:
      LLAMA_GPU_LOCK_IDS: ${LLAMA_CPP_GPU_1_DEVICE_ID:-1}
    volumes:
      - ${LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - ${LLAMA_CPP_16GB_CONFIG:-/mnt/work/llama/llama-cpp-16gb/models-preset.ini}:/models-preset.ini:ro
      - llama-gpu-locks:/var/lock/llama-gpu
    gpus:
      - driver: nvidia
        device_ids: ["${LLAMA_CPP_GPU_1_DEVICE_ID:-1}"]
        capabilities: [gpu]
    ports:
      - "${LLAMA_CPP_GPU_1_BIND_ADDRESS:-192.168.50.136}:${LLAMA_CPP_GPU_1_PORT:-11442}:8080"

  # The compatibility/default route for DeepSeek and Pi. Its network alias
  # retains http://llama-cpp:8080/v1 without making it another service name.
  llama-cpp-all-gpus:
    <<: *llama-cpp-common
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
        LLAMA_SOURCE_NAME: ggml-org-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-all-gpus
        LLAMA_BRANCH: master
        LLAMA_COMMIT: eafe15a5e3d87dd68ae33acf6a7cbd9415a0ac5e
        LLAMA_CUDA: "ON"
    container_name: llama-cpp-all-gpus-c
    environment:
      LLAMA_GPU_LOCK_IDS: ${LLAMA_CPP_ALL_GPU_LOCK_IDS:-0,1}
      # 2026-09-18: split-mode=tensor (Qwen3.8-27B x3) started failing a
      # real load post service-refactor: NCCL fails a kernel launch with
      # "Cuda failure 1 'invalid argument'" (enqueue.cc:1500) regardless of
      # transport (confirmed with NCCL_P2P_DISABLE=1 and NCCL_SHM_DISABLE=1,
      # neither fixed it -- removed, they're not the real lever). Fixed by
      # NCCL_CUMEM_ENABLE=0 -- confirmed by a real load + request for both
      # Q4_K_M and Q6_K_M (HTTP 200, real completions). It does NOT make
      # NCCL itself succeed: the log still shows "NCCL init failed
      # (unhandled system error); falling back to internal AllReduce" --
      # this variable's real effect is letting llama.cpp catch that failure
      # and use its own non-NCCL AllReduce instead of crashing. Decode speed
      # on the fallback path (8-token samples, not a clean benchmark: 34.97
      # tok/s Q4_K_M, 29.15 tok/s Q6_K_M) is close to the original NCCL-based
      # tensor-split figures in performance-findings.md (~39-40 / ~30-31
      # tok/s) -- close enough that tensor-split remains the right choice
      # over layer-split, which was tried and confirmed much slower.
      NCCL_CUMEM_ENABLE: "0"
    gpus: all
    networks:
      default:
        aliases:
          - llama-cpp
    ports:
      - "${LLAMA_CPP_BIND_ADDRESS:-192.168.50.136}:${LLAMA_CPP_PORT:-11436}:8080"

  llama-cpp-cpu:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
        LLAMA_SOURCE_NAME: ggml-org-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-cpu
        LLAMA_BRANCH: master
        LLAMA_COMMIT: eafe15a5e3d87dd68ae33acf6a7cbd9415a0ac5e
        LLAMA_CUDA: "OFF"
    image: llama-cpp:upstream-eafe15a5-cpu
    container_name: llama-cpp-cpu-c
    restart: unless-stopped
    volumes:
      - ${LLAMA_CPP_CPU_MODELS:-/mnt/data/models/gguf}:/models:ro
      - ${LLAMA_CPP_CPU_CONFIG:-/mnt/work/llama/llama-cpp-cpu/models-preset.ini}:/models-preset.ini:ro
    command:
      - --models-preset
      - /models-preset.ini
      - --reasoning-format
      - deepseek
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - ${LLAMA_CPP_CPU_PARALLEL:-1}
      - --n-gpu-layers
      - "0"
      - --fit
      - on
      - --fit-target
      - ${LLAMA_CPP_CPU_FIT_TARGET:-1024}
      - --no-webui
      - --metrics
    ports:
      - "${LLAMA_CPP_CPU_BIND_ADDRESS:-192.168.50.136}:${LLAMA_CPP_CPU_PORT:-11437}:8080"

  # Experimental GenerelSchwerz/llama.cpp build for MoE expert caching.
  # It uses only physical GPU 0, leaving GPU 1 available to another workload.
  # Pinned to qwen4exp-mtp (unchanged) -- this is the proven, working profile.
  # See llama-cpp-generel-schwerz-32gb below for the newer, two-GPU pin; the
  # two services deliberately build from different commits now.

  opencode:
    build:
      context: ./opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.9}
    image: opencode:latest
    container_name: opencode-c
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-CHANGEME_OPENCODE_PASSWORD}
    volumes:
      - opencode-home:/home/runuser
      - ${OPENCODE_WORKSPACE:-/mnt/work/projects}:/workspace
    ports:
      - "192.168.50.136:9032:4096"
    stdin_open: true
    tty: true

  openhands:
    build: ./openhands
    image: openhands-agent-canvas:1.7.0
    container_name: openhands-c
    user: "1000:1000"
    restart: unless-stopped
    environment:
      LOCAL_BACKEND_API_KEY: "${OPENHANDS_API_KEY:-CHANGEME_OPENHANDS_API_KEY}"
      OH_SECRET_KEY: "${OPENHANDS_SECRET_KEY:-CHANGEME_OPENHANDS_SECRET_KEY}"
      GIT_CONFIG_GLOBAL: /home/openhands/.openhands/gitconfig
    volumes:
      - /mnt/work/openhands:/home/openhands/.openhands
      - /mnt/work/projects:/projects
    ports:
      - "192.168.50.136:9030:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  llama-cpp-generel-schwerz-16gb:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/GenerelSchwerz/llama.cpp.git
        LLAMA_SOURCE_NAME: generel-schwerz-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-generel-schwerz-16gb
        LLAMA_BRANCH: qwen4exp-mtp
        LLAMA_COMMIT: e69a1d0be5f8ae0080593865b38b175223059199
        LLAMA_CUDA: "ON"
    image: llama-cpp:generel-schwerz-qwen4exp-mtp-e69a1d0
    container_name: llama-cpp-generel-schwerz-16gb-c
    restart: "no"
    gpus: all
    environment:
      # This established service is the GPU-1 instance.  CUDA renumbers its
      # one visible device to 0, which is what config.ini's main-gpu uses.
      CUDA_VISIBLE_DEVICES: "${GS_LLAMA_CPP_16GB_CUDA_VISIBLE_DEVICES:-1}"
      LLAMA_GPU_LOCK_IDS: "${GS_LLAMA_CPP_16GB_CUDA_VISIBLE_DEVICES:-1}"
    volumes:
      - ${GS_LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - llama-gpu-locks:/var/lock/llama-gpu
      - ${GS_LLAMA_CPP_16GB_CONFIG:-/mnt/work/llama/llama-cpp-generel-schwerz-16gb/config.ini}:/etc/llama.cpp/config.ini:ro
      - ${GS_LLAMA_CPP_16GB_MODELS_PRESET:-/mnt/work/llama/llama-cpp-generel-schwerz-16gb/models-preset.ini}:/etc/llama.cpp/models-preset.ini:ro
    command:
      - --models-preset
      - /etc/llama.cpp/models-preset.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
      - --metrics
    ports:
      - "${GS_LLAMA_CPP_16GB_BIND_ADDRESS:-192.168.50.136}:${GS_LLAMA_CPP_16GB_PORT:-11438}:8080"

  # Same pinned one-GPU MoE-cache build and catalogue as the established
  # 16GB service, but constrained to physical GPU 0.  Both services mount the
  # same read-only runtime files: CUDA renumbers their respective sole visible
  # device to 0, so no card-specific config.ini is required.
  llama-cpp-generel-schwerz-16gb-gpu-0:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/GenerelSchwerz/llama.cpp.git
        LLAMA_SOURCE_NAME: generel-schwerz-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-generel-schwerz-16gb-gpu-0
        LLAMA_BRANCH: qwen4exp-mtp
        LLAMA_COMMIT: e69a1d0be5f8ae0080593865b38b175223059199
        LLAMA_CUDA: "ON"
    image: llama-cpp:generel-schwerz-qwen4exp-mtp-e69a1d0
    container_name: llama-cpp-generel-schwerz-16gb-gpu-0-c
    restart: "no"
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: "${GS_LLAMA_CPP_16GB_GPU_0_CUDA_VISIBLE_DEVICES:-0}"
      LLAMA_GPU_LOCK_IDS: "${GS_LLAMA_CPP_16GB_GPU_0_CUDA_VISIBLE_DEVICES:-0}"
    volumes:
      - ${GS_LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - llama-gpu-locks:/var/lock/llama-gpu
      - ${GS_LLAMA_CPP_16GB_CONFIG:-/mnt/work/llama/llama-cpp-generel-schwerz-16gb/config.ini}:/etc/llama.cpp/config.ini:ro
      - ${GS_LLAMA_CPP_16GB_MODELS_PRESET:-/mnt/work/llama/llama-cpp-generel-schwerz-16gb/models-preset.ini}:/etc/llama.cpp/models-preset.ini:ro
    command:
      - --models-preset
      - /etc/llama.cpp/models-preset.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
      - --metrics
    ports:
      - "${GS_LLAMA_CPP_16GB_GPU_0_BIND_ADDRESS:-192.168.50.136}:${GS_LLAMA_CPP_16GB_GPU_0_PORT:-11443}:8080"

  # Experimental GenerelSchwerz/llama.cpp build using both physical GPUs.
  # 2026-09-16: pinned to codex/moe-grouped-multigpu, NOT qwen4exp-mtp (that's
  # the 16GB service's pin, unchanged). qwen4exp-mtp's MoE cache is hardcoded
  # to CUDA device 0 (GenerelSchwerz/llama.cpp#90) and cannot use a second
  # GPU -- confirmed still true, 0 commits of drift on that branch as of this
  # pin. codex/moe-grouped-multigpu branches directly off our exact
  # qwen4exp-mtp pin (e69a1d0be) and adds a real, physically-validated
  # two-GPU expert cache (docs/moe-grouped-multigpu.md in that tree): layer-
  # split ("Stage A... does not add tensor or expert parallelism"), tested on
  # two distinct physical GPUs with no peer access (PHB, same no-NVLink shape
  # as this host), and run against two models already in our own catalog
  # (Gemma-4-26B-A4B, Ornith-1.5-35B-A3B) with coherent output and zero
  # unexpected fallback. Not merged upstream into qwen4exp-mtp as of this pin.
  # Real constraints this pin imposes on every model below: requires
  # `load-mode = none` (mmap-based pinning is explicitly rejected by this
  # branch), and decode-only benefit for now (prefill still runs the old
  # single-device path). See models-preset-32gb.ini for the per-model
  # fallout, in particular why Flash Next is NOT in that catalogue.

  llama-cpp-generel-schwerz-32gb:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/GenerelSchwerz/llama.cpp.git
        LLAMA_SOURCE_NAME: generel-schwerz-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-generel-schwerz-32gb
        LLAMA_BRANCH: codex/moe-grouped-multigpu
        LLAMA_COMMIT: 0ed73d1c9e26587cc41b73f77e9e058a0da55368
        LLAMA_CUDA: "ON"
    image: llama-cpp:generel-schwerz-codex-moe-grouped-multigpu-0ed73d1
    container_name: llama-cpp-generel-schwerz-32gb-c
    restart: "no"
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: "${GS_LLAMA_CPP_32GB_CUDA_VISIBLE_DEVICES:-0,1}"
      LLAMA_GPU_LOCK_IDS: "${GS_LLAMA_CPP_32GB_CUDA_VISIBLE_DEVICES:-0,1}"
    volumes:
      - ${GS_LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - llama-gpu-locks:/var/lock/llama-gpu
      - ${GS_LLAMA_CPP_32GB_CONFIG:-/mnt/work/llama/llama-cpp-generel-schwerz-32gb/config.ini}:/etc/llama.cpp/config.ini:ro
      - ${GS_LLAMA_CPP_32GB_MODELS_PRESET:-/mnt/work/llama/llama-cpp-generel-schwerz-32gb/models-preset.ini}:/etc/llama.cpp/models-preset.ini:ro
    command:
      - --models-preset
      - /etc/llama.cpp/models-preset.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
      - --metrics
    ports:
      - "${GS_LLAMA_CPP_32GB_BIND_ADDRESS:-192.168.50.136}:${GS_LLAMA_CPP_32GB_PORT:-11439}:8080"

  # Independent csantiago78/llama.cpp MoE expert cache (draft PR #27861 against
  # ggml-org/llama.cpp, branch moe-expert-cache), using both physical GPUs.
  # 2026-09-16: llama-cpp-generel-schwerz-32gb no longer has the CUDA-device-0
  # limitation this comment used to describe -- it now builds from
  # codex/moe-grouped-multigpu, a real two-GPU expert cache (see that
  # service's own comment). This csantiago78 branch has had zero commits
  # since it was pinned (checked 2026-09-16) and remains untested in this
  # deployment; it's no longer the only lead on multi-GPU MoE caching, just
  # an unverified one that predates finding the working alternative.

  deepseek:
    build:
      context: ./deepseek
      args:
        DEEPSEEK_VERSION: ${DEEPSEEK_VERSION:-0.1.1-rc.2}
    image: deepseek-harness:latest
    container_name: deepseek-c
    restart: unless-stopped
    # depends_on:
    #   guarded-fetch:
    #     condition: service_healthy
    #   searxng:
    #     condition: service_healthy
    environment:
      USERID: "1000"
      GROUPID: "1000"
      HOME: /home/runuser
      USER: runuser
      LOGNAME: runuser
      DSH_HOME: /home/runuser/.dsh
      SSH_CONNECTION: "1 1 1 1"
      UV_CACHE_DIR: /tmp/uv-cache
      # 2026-09-16: pre-commit defaults to $HOME/.cache/pre-commit, which is
      # outside the workspace-write sandbox boundary (HOME is the persisted
      # /home/runuser volume, not the session workspace or a platform temp
      # area). Every 27B session avoided this by setting PRE_COMMIT_HOME on
      # the command line by hand (the escape hatch docs/prompts/dsh-
      # autonomous-dev.md already documents); one Flash Next session didn't,
      # and its pre-commit run sat blocked on a danger-full-access approval
      # for ~8 hours. Setting it here, matching UV_CACHE_DIR above, makes the
      # escape hatch unconditional instead of relying on the model to type it
      # every time.
      PRE_COMMIT_HOME: /tmp/pre-commit-home
      UV_PYTHON_INSTALL_DIR: /home/runuser/.local/share/uv/python
      UV_PYTHON_PREFERENCE: managed
      # DeepSeek's in-container Caddy owns its Basic Auth, matching the
      # browser/VNC containers rather than delegating authentication upstream.
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: ${CADDY_HASH:?CADDY_HASH is required}
      # DSH's built-in browser-trust fence must explicitly recognize the
      # HTTPS hostname which Caddy publishes. This is not an auth setting.
      DEEPSEEK_GATEWAY_HOSTNAME: ${DEEPSEEK_GATEWAY_HOSTNAME:-deepseek.ai.home.arpa}
    volumes:
      - ${DEEPSEEK_HOME:-/mnt/work/deepseek}:/home/runuser
      - ${DEEPSEEK_WORKSPACE:-/mnt/work/projects}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
      # These overlays select local SearXNG search and the guarded fetch
      # provider without replacing persisted models, credentials, sessions, or
      # agent presets under DEEPSEEK_HOME. They are configuration, not state.
      - ./deepseek/profile-patches/web.cordis.patch.yml:/home/runuser/.dsh/profiles/web/cordis.patch.yml:ro
      - ./deepseek/profile-patches/headless.cordis.patch.yml:/home/runuser/.dsh/profiles/headless/cordis.patch.yml:ro
      # Retains Standard as one capability mode while making compaction policy
      # exact-provider/model aware. This file follows DEEPSEEK_VERSION.
      - ./deepseek/agent-preset-overrides/standard/agent.cordis.yml:/usr/local/lib/node_modules/@deepseek-ai/dsh/config/agent-presets/standard/agent.cordis.yml:ro
    # The service's own Caddy listens on 8081 and stays private to the Compose
    # gateway network. Do not publish it on a host port.
    networks:
      - default
      - https-gateway
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:3080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stdin_open: true
    tty: true

  comfyui:
    build:
      context: ./comfy-ui
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.29.2}
        TORCH_VERSION: ${COMFYUI_TORCH_VERSION:-2.11.0}
        TORCHVISION_VERSION: ${COMFYUI_TORCHVISION_VERSION:-0.26.0}
        TORCHAUDIO_VERSION: ${COMFYUI_TORCHAUDIO_VERSION:-2.11.0}
        PYTORCH_INDEX_URL: ${COMFYUI_PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: comfyui:latest
    container_name: comfyui-c
    restart: unless-stopped
    init: true
    environment:
      USERID: "1000"
      GROUPID: "1000"
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: ${CADDY_HASH:?CADDY_HASH is required}
      COMFYUI_EXTRA_ARGS: ${COMFYUI_EXTRA_ARGS:-}
      HF_HUB_CACHE: /models/huggingface
      HF_TOKEN: ${COMFYUI_HF_TOKEN:-}
    volumes:
      - ${COMFYUI_MODELS:-/mnt/data/models/comfyui}:/models
      - ${COMFYUI_INPUT:-/mnt/data/generation/input}:/data/input
      - ${COMFYUI_OUTPUT:-/mnt/data/generation/output}:/data/output
      - ${COMFYUI_USER:-/mnt/work/comfyui/user}:/data/user
      - ${COMFYUI_CUSTOM_NODES:-/mnt/work/comfyui/custom_nodes}:/opt/ComfyUI/custom_nodes
    ports:
      - "${COMFYUI_BIND_ADDRESS:-192.168.50.136}:${COMFYUI_PORT:-9034}:8081"
    gpus: all
    shm_size: "2gb"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  goose:
    build:
      context: ./goose
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-1.45.0}
    image: goose:latest
    volumes:
      - goose-home:/home/runuser
      - ${GOOSE_WORKSPACE:-/mnt}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    ports:
      - "9031:8081"
    stdin_open: true
    tty: true
    <<: *defaults
    container_name: goose-c

  guarded-fetch:
    build:
      context: ./guarded-fetch
      args:
        GUARDED_FETCH_VERSION: ${GUARDED_FETCH_VERSION:-0.1.4}
    image: guarded-fetch:latest
    container_name: guarded-fetch-c
    restart: unless-stopped
    init: true
    environment:
      GUARDED_FETCH_PORT: "8080"
      GUARDED_FETCH_TIMEOUT_MS: ${GUARDED_FETCH_TIMEOUT_MS:-15000}
      GUARDED_FETCH_MAX_REDIRECTS: ${GUARDED_FETCH_MAX_REDIRECTS:-5}
      GUARDED_FETCH_MAX_RESPONSE_BYTES: ${GUARDED_FETCH_MAX_RESPONSE_BYTES:-1048576}
      GUARDED_FETCH_MAX_BODY_CHARS: ${GUARDED_FETCH_MAX_BODY_CHARS:-100000}
      # Leave empty to permit public hosts. A comma-separated allowlist narrows
      # the gateway without disabling guarded-fetch's IP-range checks.
      GUARDED_FETCH_ALLOWED_HOSTS: ${GUARDED_FETCH_ALLOWED_HOSTS:-}
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  llama-cpp-csantiago78:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/csantiago78/llama.cpp.git
        LLAMA_SOURCE_NAME: csantiago78-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp-csantiago78
        LLAMA_BRANCH: moe-expert-cache
        LLAMA_COMMIT: bccbacdb8945680f1cfc7e6bffd1e59014705750
        LLAMA_CUDA: "ON"
    image: llama-cpp:csantiago78-moe-expert-cache-bccbacd
    container_name: llama-cpp-csantiago78-c
    restart: "no"
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: "${CSANTIAGO78_LLAMA_CPP_CUDA_VISIBLE_DEVICES:-0,1}"
      LLAMA_GPU_LOCK_IDS: "${CSANTIAGO78_LLAMA_CPP_CUDA_VISIBLE_DEVICES:-0,1}"
    volumes:
      - ${GS_LLAMA_CPP_MODELS:-/mnt/data/models/gguf}:/models:ro
      - llama-gpu-locks:/var/lock/llama-gpu
      - ${CSANTIAGO78_LLAMA_CPP_CONFIG:-/mnt/work/llama/llama-cpp-csantiago78/config.ini}:/etc/llama.cpp/config.ini:ro
      - ${CSANTIAGO78_LLAMA_CPP_MODELS_PRESET:-/mnt/work/llama/llama-cpp-csantiago78/models-preset.ini}:/etc/llama.cpp/models-preset.ini:ro
    command:
      - --models-preset
      - /etc/llama.cpp/models-preset.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
      - --metrics
    ports:
      - "${CSANTIAGO78_LLAMA_CPP_BIND_ADDRESS:-192.168.50.136}:${CSANTIAGO78_LLAMA_CPP_PORT:-11440}:8080"

  pi:
    build:
      context: ./pi
      args:
        PI_VERSION: ${PI_VERSION:-0.85.1}
    image: pi-coding-agent:latest
    container_name: pi-c
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      HOME: /home/runuser
      USER: runuser
      LOGNAME: runuser
      PI_CODING_AGENT_DIR: /home/runuser/.pi/agent
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      # Temporarily disable Pi's local web_search and guarded web_fetch tools.
      # Set to 1 in .env when they should be loaded again.
      PI_WEB_EXTENSIONS_ENABLED: ${PI_WEB_EXTENSIONS_ENABLED:-0}
      GUARDED_FETCH_URL: http://guarded-fetch:8080/v1/fetch
      SEARXNG_URL: http://searxng:8080
    # depends_on:
    #   guarded-fetch:
    #     condition: service_healthy
    #   searxng:
    #     condition: service_healthy
    volumes:
      - ${PI_HOME:-/mnt/work/pi}:/home/runuser
      - ${PI_WORKSPACE:-/mnt/work/projects}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    stdin_open: true
    tty: true

  # A Compose-local, read-only HTTPS text-fetch gateway for Pi's web_fetch
  # extension and other explicit callers.
  # It is deliberately not published on the host: callers use
  # http://guarded-fetch:8080/v1/fetch from the default Compose network.

volumes:
  llama-gpu-locks:
  ollama-home:
  ollama-cpu-home:
  searxng-cache:
  searxng-valkey-data:
  opencode-home:
  goose-home:

networks:
  # Duplicated in compose.network.yml so either group remains a valid Compose
  # file. The service attachment above is the explicit gateway opt-in.
  https-gateway:
    internal: true
