x-defaults: &defaults
  environment:
    USERID: "1000"
    GROUPID: "1000"
    CADDY_USER: "admin"
    CADDY_HASH: ${CADDY_HASH}

# llama-cpp overlays rendered from llama-cpp/config/*/*.env use host ports
# 11436-11443. The llama services below run with their former .env defaults
# and are also the common templates copied into generated profile services.

services:

  # Build-only parents for the agent images. They are hidden behind a profile,
  # so `up` never starts helper containers. Build them in parent-to-child
  # order before a project overlay; the runtime remains one `deepseek` and one
  # `pi` service.
  agent-base:
    image: agent-base:latest
    build: ./agent-base
    profiles: ["harness-build"]

  agent-base-caddy:
    image: agent-base-caddy:latest
    build:
      context: ./agent-base-caddy
    profiles: ["harness-build"]

  deepseek-core:
    image: deepseek-harness:core
    build:
      context: ./deepseek
      args:
        DEEPSEEK_VERSION: ${DEEPSEEK_VERSION:-0.2.0-rc.2}
    profiles: ["harness-build"]

  pi-core:
    image: pi-coding-agent:core
    build:
      context: ./pi
      args:
        PI_VERSION: ${PI_VERSION:-0.85.1}
    profiles: ["harness-build"]

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    volumes:
      - ollama-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models
      - /mnt/data/models/gguf:/models/gguf:ro
      - /mnt/work/ollama-nvidia-cache:/root/.nv
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "192.168.50.136:11434:11434"
    restart: unless-stopped
    container_name: ollama-c
    gpus: all

  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ollama-cpu-c
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    ports:
      - "192.168.50.136:11435:11434"
    restart: unless-stopped
    volumes:
      - ollama-cpu-home:/root/.ollama
      - /mnt/data/models/ollama:/root/.ollama/models:ro

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_TAG:-latest}
    container_name: searxng-c
    restart: unless-stopped
    depends_on:
      - searxng-valkey
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-CHANGEME_SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://${SEARXNG_BIND_ADDRESS:-192.168.50.136}:${SEARXNG_PORT:-9036}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "${SEARXNG_BIND_ADDRESS:-192.168.50.136}:${SEARXNG_PORT:-9036}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey-c
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - searxng-valkey-data:/data

  llama-cpp:
    build:
      context: ./llama-cpp
      target: server
      args:
        LLAMA_REPOSITORY: https://github.com/ggml-org/llama.cpp.git
        LLAMA_SOURCE_NAME: ggml-org-llama-cpp
        LLAMA_SERVICE_NAME: llama-cpp
        LLAMA_BRANCH: master
        LLAMA_COMMIT: e6ab7c1a41054a888ada952eab4c886444c2f5ad
        LLAMA_CUDA: "ON"
    image: llama-cpp:upstream-e6ab7c1-cuda
    container_name: llama-cpp-c
    restart: "no"
    environment:
      CUDA_VISIBLE_DEVICES: "0,1"
      NCCL_CUMEM_ENABLE: "0"
    volumes:
      - /mnt/data/models/gguf:/models:ro
      - ./llama-cpp/config/models-preset.ini:/models-preset.ini:ro
      - ./llama-cpp/config/chat-templates:/opt/llama-cpp/chat-templates:ro
    command:
      - --models-preset
      - /models-preset.ini
      # The model broker decides what is loaded and loads it explicitly, so the router
      # must not autoload, and --models-max must be at least the most models that can be
      # loaded together without competing for a GPU or RAM (a GPU0 model, a GPU1 model
      # and a CPU model), so that it never has to choose a model to unload itself. The
      # broker refuses to schedule if either is wrong. The unified preset assigns each
      # model's exact CPU/GPU placement.
      - --models-max
      - "3"
      - --no-models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "1"
      - --flash-attn
      - on
      - --fit
      - on
      - --fit-target
      - "1024"
      - --no-webui
      - --metrics
    gpus:
      - driver: nvidia
        device_ids: ["0", "1"]
        capabilities: [gpu]
    networks:
      default:
        aliases:
          - llama-cpp
    ports:
      - "192.168.50.136:11450:8080"

  strata:
    build:
      context: ./strata
      args:
        STRATA_REPOSITORY: https://github.com/Niko1221/Strata.git
        STRATA_COMMIT: ${STRATA_COMMIT:-d6708a4aae15b4860000d54c8af9e84d684bce09}
    image: strata:latest
    container_name: strata-c
    restart: unless-stopped
    # Strata's setup.py starts the model with subprocess.call(), so the
    # actual server is a grandchild of PID 1, not PID 1 itself; init (tini)
    # forwards docker stop's SIGTERM to the whole process group instead of
    # just the outer setup.py process.
    init: true
    environment:
      STRATA_FAMILY: ${STRATA_FAMILY:-qwen}
      STRATA_MODEL: ${STRATA_MODEL:-IQ2_XS}
      STRATA_CONTEXT: ${STRATA_CONTEXT:-131072}
      # KV-cache precision and vision. The model broker sets every variable named in
      # strata/config/models-preset.ini and recognises the running model by finding all of
      # them in the container's environment, so each must be passed through here.
      STRATA_KV: ${STRATA_KV:-int8}
      STRATA_VISION: ${STRATA_VISION:-no}
      # auto: Strata only drops experts to NVMe-backed file-cache reads when
      # RAM is clearly short (its own threshold is a model's arena_gb + 10 GB
      # headroom); "on" forces it even when RAM would technically fit the
      # model resident, trading speed for headroom. See strata/README.md.
      STRATA_LOW_RAM: ${STRATA_LOW_RAM:-auto}
      # Only takes effect for qwen/coder (setup.py ignores it for swift).
      # Default points at alesha-pro/Qwen3.8-Flash-Next-abliterated-GSQ-RCO-
      # Strata-GGUF's control vector (SHA256-verified against the repo's own
      # SHA256SUMS before use) - a refusal-direction projection applied at
      # runtime via llama.cpp's --control-vector-scaled, layers 4-44. The
      # underlying model weights are untouched (same ISTA-DASLab GSQ-RCO
      # files already used for the non-uncensored qwen models); this changes
      # *behavior*, not *weights*. Empty disables it entirely (no flag
      # passed) rather than passing "off", matching the file at
      # /mnt/work/strata/vectors/ (already reachable at /data/vectors/ via
      # the existing STRATA_HOME mount - no extra volume needed). See
      # strata/README.md.
      STRATA_SPEED_PROJECTION: ${STRATA_SPEED_PROJECTION:-}
      # and refuses to start if it's merely present-but-empty (#213, a
      # deliberate guard against silently running with no auth). Compose's
      # ${VAR:-} always defines the container var even when empty, so this
      # is passed under a different name and entrypoint.sh reads it as
      # STRATA_API_KEY_HOST. See strata/README.md.
      STRATA_API_KEY_HOST: ${STRATA_API_KEY:-}
    volumes:
      - ${STRATA_HOME:-/mnt/work/strata}:/data
      - ${STRATA_MODELS:-/mnt/data/models/strata}:/models
      # The compiled engine (setup.py's build_engine()) is keyed on a hash of
      # its own source plus target GPU archs, stored in engine/BUILD.json, so
      # it is self-healing: recompiles only when the pinned commit actually
      # changes the engine source or a new GPU arch is needed. Sharing it
      # across this service and one-off `docker compose run` invocations
      # (strata/README.md) avoids repeating a 10-20 minute compile in every
      # separate container.
      - strata-engine:/app/engine
    gpus:
      - driver: nvidia
        device_ids: ["${STRATA_GPU_DEVICE_ID:-1}"]
        capabilities: [gpu]
    ports:
      - "${STRATA_BIND_ADDRESS:-192.168.50.136}:${STRATA_PORT:-11441}:8080"

  # Schedules llama.cpp and Strata models onto the GPUs and RAM, and proxies chat requests
  # to them. It is built from its own repository (MODEL_BROKER_CONTEXT) and shares nothing
  # with this one except the two preset files below, which it reads. It has no Docker
  # access: to start or stop Strata's container it asks the model-broker-service-control
  # host service over a Unix socket (install-model-broker-service-control.sh in the broker
  # repository). Until the host service is installed this service cannot start, because
  # the socket's directory does not exist.
  model-broker:
    build:
      context: ${MODEL_BROKER_CONTEXT:-/mnt/work/projects/model-broker}
    image: model-broker:latest
    container_name: model-broker-c
    restart: unless-stopped
    environment:
      MODEL_BROKER_LLAMA_URL: http://llama-cpp:8080
      MODEL_BROKER_PRESET_PATH: /config/llama-models-preset.ini
      MODEL_BROKER_SERVICE_PRESET_PATH: /config/strata-models-preset.ini
      MODEL_BROKER_SERVICE_CONTROL_SOCKET: /run/model-broker-service-control/control.sock
      MODEL_BROKER_STRATA_URL: http://strata:8080
      MODEL_BROKER_STRATA_API_KEY: ${STRATA_API_KEY:-}
      MODEL_BROKER_IDLE_PROTECT_SECONDS: ${MODEL_BROKER_IDLE_PROTECT_SECONDS:-300}
      MODEL_BROKER_MAX_WAIT_SECONDS: ${MODEL_BROKER_MAX_WAIT_SECONDS:-30}
      MODEL_BROKER_LOG_LEVEL: ${MODEL_BROKER_LOG_LEVEL:-INFO}
    volumes:
      - ./llama-cpp/config/models-preset.ini:/config/llama-models-preset.ini:ro
      - ./strata/config/models-preset.ini:/config/strata-models-preset.ini:ro
      # The directory, not the socket file: the host service replaces the socket when it
      # restarts. create_host_path is off so that Docker does not make the directory
      # itself, as root, if the host service is not installed.
      - type: bind
        source: /run/model-broker-service-control
        target: /run/model-broker-service-control
        bind:
          create_host_path: false
    # The numeric ID of the host group model-broker-control-client, which owns the socket.
    # The installer prints it. The default is a group nothing uses, so the broker starts
    # but cannot reach the host service until this is set in .env.
    group_add:
      - "${MODEL_BROKER_CONTROL_GID:-65534}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${MODEL_BROKER_BIND_ADDRESS:-192.168.50.136}:${MODEL_BROKER_PORT:-11460}:8000"

  opencode:
    build:
      context: ./opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.9}
    image: opencode:latest
    container_name: opencode-c
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-CHANGEME_OPENCODE_PASSWORD}
    volumes:
      - opencode-home:/home/runuser
      - ${OPENCODE_WORKSPACE:-/mnt/work/projects}:/workspace
    ports:
      - "192.168.50.136:9032:4096"
    stdin_open: true
    tty: true

  deepseek:
    # This is a harness template. Project overlays derive separately named
    # services (for example deepseek-amiga) from it, so multiple project
    # harnesses can coexist. It is deliberately not started by an unqualified
    # `docker compose up`; activate the harness-template profile or name it
    # explicitly only when testing the core image itself.
    image: deepseek-harness:core
    container_name: deepseek-c
    profiles: [harness-template]
    restart: unless-stopped
    # depends_on:
    #   guarded-fetch:
    #     condition: service_healthy
    #   searxng:
    #     condition: service_healthy
    environment:
      USERID: "1000"
      GROUPID: "1000"
      HOME: /home/runuser
      USER: runuser
      LOGNAME: runuser
      DSH_HOME: /home/runuser/.dsh
      SSH_CONNECTION: "1 1 1 1"
      UV_CACHE_DIR: /tmp/uv-cache
      # 2026-09-16: pre-commit defaults to $HOME/.cache/pre-commit, which is
      # outside the workspace-write sandbox boundary (HOME is the persisted
      # /home/runuser volume, not the session workspace or a platform temp
      # area). Every 27B session avoided this by setting PRE_COMMIT_HOME on
      # the command line by hand (the escape hatch docs/prompts/dsh-
      # autonomous-dev.md already documents); one Flash Next session didn't,
      # and its pre-commit run sat blocked on a danger-full-access approval
      # for ~8 hours. Setting it here, matching UV_CACHE_DIR above, makes the
      # escape hatch unconditional instead of relying on the model to type it
      # every time.
      PRE_COMMIT_HOME: /tmp/pre-commit-home
      UV_PYTHON_INSTALL_DIR: /home/runuser/.local/share/uv/python
      UV_PYTHON_PREFERENCE: managed
      # 2026-09-24: /workspace is a bind mount of the host's project tree, and a
      # uv venv records absolute interpreter and project paths (the container
      # uses /usr/bin/python3.12 and /workspace/..., the host a uv-managed
      # Python and /mnt/work/projects/...). With the default .venv, host and
      # container `uv run` each saw the other's venv as broken ("linked to
      # non-existent Python interpreter"), deleted it and rebuilt it (~250 MB
      # download). A relative value resolves per project root, so every
      # project under /workspace gets its own .venv-container here and the
      # host's .venv is never touched. Projects should gitignore .venv-container/.
      UV_PROJECT_ENVIRONMENT: .venv-container
      # DeepSeek's in-container Caddy owns its Basic Auth, matching the
      # browser/VNC containers rather than delegating authentication upstream.
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: ${CADDY_HASH:?CADDY_HASH is required}
      # The model broker does not authenticate yet, but DSH's configured pi-ai route
      # requires a non-empty credential to activate. This is an identifier, not a
      # secret; if the broker is given API keys, set the client's key here.
      MODEL_BROKER_API_KEY: ${MODEL_BROKER_API_KEY:-local}
      # DSH's built-in browser-trust fence must explicitly recognize the
      # HTTPS hostname which Caddy publishes. This is not an auth setting.
      DEEPSEEK_GATEWAY_HOSTNAME: ${DEEPSEEK_GATEWAY_HOSTNAME:-deepseek.ai.home.arpa}
    volumes:
      - ${DEEPSEEK_HOME:-/mnt/work/deepseek}:/home/runuser
      - ${DEEPSEEK_WORKSPACE:-/mnt/work/projects}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
      # The web profile's providers, models and default model come from one generated
      # file in this repository (deepseek/generate-web-profile.sh), mounted read-only
      # over the profile's cordis.patch.yml, so every DeepSeek service has the same ones
      # whatever its home holds. DSH does not write that file. The repository-owned web
      # capability overlay is applied separately from the image with DSH's --patch option.
      # The headless overlay is a read-only explicit profile override.
      - ./deepseek/profile-patches/web.profile.cordis.patch.yml:/home/runuser/.dsh/profiles/web/cordis.patch.yml:ro
      - ./deepseek/profile-patches/headless.cordis.patch.yml:/home/runuser/.dsh/profiles/headless/cordis.patch.yml:ro
      # Retains Standard as one capability mode while making compaction policy
      # exact-provider/model aware. This file follows DEEPSEEK_VERSION.
      - ./deepseek/agent-preset-overrides/standard/agent.cordis.yml:/usr/local/lib/node_modules/@deepseek-ai/dsh/config/agent-presets/standard/agent.cordis.yml:ro
    # The service's own Caddy listens on 8081 and stays private to the Compose
    # gateway network. Do not publish it on a host port.
    networks:
      - default
      - https-gateway
    labels:
      # DeepSeek is deliberately explicit: DSH must trust exactly this
      # browser origin, so the label and DEEPSEEK_GATEWAY_HOSTNAME share one
      # value. Project-specific copies can choose another hostname here.
      caddy: ${DEEPSEEK_GATEWAY_HOSTNAME:-deepseek.ai.home.arpa}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8081}}"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:3080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stdin_open: true
    tty: true

  comfyui:
    build:
      context: ./comfy-ui
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.37.0}
        TORCH_VERSION: ${COMFYUI_TORCH_VERSION:-2.11.0}
        TORCHVISION_VERSION: ${COMFYUI_TORCHVISION_VERSION:-0.26.0}
        TORCHAUDIO_VERSION: ${COMFYUI_TORCHAUDIO_VERSION:-2.11.0}
        PYTORCH_INDEX_URL: ${COMFYUI_PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    image: comfyui:latest
    container_name: comfyui-c
    restart: unless-stopped
    init: true
    environment:
      USERID: "1000"
      GROUPID: "1000"
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: ${CADDY_HASH:?CADDY_HASH is required}
      COMFYUI_EXTRA_ARGS: ${COMFYUI_EXTRA_ARGS:-}
      HF_HUB_CACHE: /models/huggingface
      HF_TOKEN: ${COMFYUI_HF_TOKEN:-}
    volumes:
      - ${COMFYUI_MODELS:-/mnt/data/models/comfyui}:/models
      - ${COMFYUI_INPUT:-/mnt/data/generation/input}:/data/input
      - ${COMFYUI_OUTPUT:-/mnt/data/generation/output}:/data/output
      - ${COMFYUI_USER:-/mnt/work/comfyui/user}:/data/user
      - ${COMFYUI_CUSTOM_NODES:-/mnt/work/comfyui/custom_nodes}:/opt/ComfyUI/custom_nodes
    # ComfyUI's authenticated Caddy proxy is reachable only through the
    # internal HTTPS gateway network; do not publish it on a host port.
    networks:
      - default
      - https-gateway
    labels:
      # The hostname follows the Compose service key, e.g.
      # comfyui.ai.home.arpa. The gateway only processes containers on its
      # private opt-in network.
      caddy: '{{ index .Labels "com.docker.compose.service" }}.ai.home.arpa'
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8081}}"
    gpus:
      - driver: nvidia
        device_ids: ["0"]
        capabilities: [gpu]
    shm_size: "2gb"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  goose:
    build:
      context: ./goose
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-1.45.0}
    image: goose:latest
    volumes:
      - goose-home:/home/runuser
      - ${GOOSE_WORKSPACE:-/mnt}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    ports:
      - "9031:8081"
    stdin_open: true
    tty: true
    <<: *defaults
    container_name: goose-c

  guarded-fetch:
    build:
      context: ./guarded-fetch
      args:
        GUARDED_FETCH_VERSION: ${GUARDED_FETCH_VERSION:-0.1.4}
    image: guarded-fetch:latest
    container_name: guarded-fetch-c
    restart: unless-stopped
    init: true
    environment:
      GUARDED_FETCH_PORT: "8080"
      GUARDED_FETCH_TIMEOUT_MS: ${GUARDED_FETCH_TIMEOUT_MS:-15000}
      GUARDED_FETCH_MAX_REDIRECTS: ${GUARDED_FETCH_MAX_REDIRECTS:-5}
      GUARDED_FETCH_MAX_RESPONSE_BYTES: ${GUARDED_FETCH_MAX_RESPONSE_BYTES:-1048576}
      GUARDED_FETCH_MAX_BODY_CHARS: ${GUARDED_FETCH_MAX_BODY_CHARS:-100000}
      # Leave empty to permit public hosts. A comma-separated allowlist narrows
      # the gateway without disabling guarded-fetch's IP-range checks.
      GUARDED_FETCH_ALLOWED_HOSTS: ${GUARDED_FETCH_ALLOWED_HOSTS:-}
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pi:
    # See deepseek above. Project overlays derive separately named Pi services
    # and opt out of this template-only profile.
    image: pi-coding-agent:core
    container_name: pi-c
    profiles: [harness-template]
    restart: unless-stopped
    environment:
      USERID: "1000"
      GROUPID: "1000"
      HOME: /home/runuser
      USER: runuser
      LOGNAME: runuser
      PI_CODING_AGENT_DIR: /home/runuser/.pi/agent
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      # Temporarily disable Pi's local web_search and guarded web_fetch tools.
      # Set to 1 in .env when they should be loaded again.
      PI_WEB_EXTENSIONS_ENABLED: ${PI_WEB_EXTENSIONS_ENABLED:-0}
      GUARDED_FETCH_URL: http://guarded-fetch:8080/v1/fetch
      SEARXNG_URL: http://searxng:8080
    # depends_on:
    #   guarded-fetch:
    #     condition: service_healthy
    #   searxng:
    #     condition: service_healthy
    volumes:
      - ${PI_HOME:-/mnt/work/pi}:/home/runuser
      - ${PI_WORKSPACE:-/mnt/work/projects}:/workspace
      - /container-ssh:/home/runuser/.ssh:ro
    stdin_open: true
    tty: true

  # A Compose-local, read-only HTTPS text-fetch gateway for Pi's web_fetch
  # extension and other explicit callers.
  # It is deliberately not published on the host: callers use
  # http://guarded-fetch:8080/v1/fetch from the default Compose network.

volumes:
  strata-engine:
  ollama-home:
  ollama-cpu-home:
  searxng-cache:
  searxng-valkey-data:
  opencode-home:
  goose-home:

networks:
  # Duplicated in compose.network.yml so either group remains a valid Compose
  # file. The service attachment above is the explicit gateway opt-in.
  https-gateway:
    name: server_containers_https-gateway
    internal: true
