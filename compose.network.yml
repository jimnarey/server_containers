services:

  https-gateway:
    # Watches opted-in containers and turns their caddy.* labels into Caddy
    # routes. It has no host Docker-socket mount; the narrowly scoped proxy
    # below is its only Docker API path.
    build: ./https-gateway
    image: https-gateway:dynamic
    container_name: https-gateway-c
    depends_on:
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    ports:
      # Default to loopback so a missing machine-specific setting cannot
      # accidentally publish HTTPS on every host interface.
      - "${HTTPS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${HTTPS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:443:443"
    environment:
      HTTPS_GATEWAY_HOSTNAME: ${HTTPS_GATEWAY_HOSTNAME:-gateway.ai.home.arpa}
      # Load the fixed gateway landing-page configuration before merging
      # routes discovered from service labels.
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
      # Restrict discovery and upstream selection to this Compose project's
      # private application network. This intentionally does not discover
      # containers from other Compose projects.
      CADDY_INGRESS_NETWORKS: server_containers_https-gateway
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./https-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/hostname:/run/host-hostname:ro
      # Caddy's internal CA and issued certificates live in this volume.
      - https-gateway-data:/data
      - https-gateway-config:/config
    networks:
      - https-gateway
      # Docker does not activate published host ports for this deployment when
      # Caddy is attached only to an internal network. This network has no
      # application upstreams; the private network below remains the only path
      # from Caddy to DeepSeek.
      - https-gateway-ingress
      - gateway-docker-api

  # Restricts the gateway's read-only Docker API access to the endpoints it
  # needs for container/network discovery and change events. Do not publish
  # this port or attach application services to this network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy-c
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway-docker-api

  # Local resolver for the HTTPS gateway namespace. It is intentionally not
  # connected to application networks: DNS requests enter only through the
  # explicit LAN port bindings below and other names go to its upstream DNS.
  lan-dns:
    build: ./lan-dns
    image: lan-dns:latest
    container_name: lan-dns-c
    restart: unless-stopped
    environment:
      LAN_DNS_AI_GATEWAY_ADDRESS: ${LAN_DNS_AI_GATEWAY_ADDRESS:?LAN_DNS_AI_GATEWAY_ADDRESS is required}
      LAN_DNS_NAS_GATEWAY_ADDRESS: ${LAN_DNS_NAS_GATEWAY_ADDRESS:?LAN_DNS_NAS_GATEWAY_ADDRESS is required}
      LAN_DNS_HARDWARE_GATEWAY_ADDRESS: ${LAN_DNS_HARDWARE_GATEWAY_ADDRESS:?LAN_DNS_HARDWARE_GATEWAY_ADDRESS is required}
      LAN_DNS_UPSTREAM_SERVER: ${LAN_DNS_UPSTREAM_SERVER:-192.168.50.1}
    ports:
      # Safe by default: publish DNS only after the server's LAN address is
      # configured explicitly in .env.
      - "${LAN_DNS_BIND_ADDRESS:-127.0.0.1}:53:5353/udp"
      - "${LAN_DNS_BIND_ADDRESS:-127.0.0.1}:53:5353/tcp"
    networks:
      - lan-dns-ingress

  # HTTP proxy whose traffic leaves through ExpressVPN (OpenVPN via gluetun).
  # gluetun's firewall blocks every other route out, so if the tunnel drops,
  # proxied requests fail instead of leaking through the host's connection.
  # Behind a profile because it cannot start without ExpressVPN credentials;
  # naming the service (docker compose up -d expressvpn) also starts it.
  expressvpn:
    image: qmcgaw/gluetun:${GLUETUN_VERSION:-v3.41.3}
    container_name: expressvpn-c
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
    # Looks up the server's current IP before starting gluetun.
    entrypoint: ["/bin/sh", "/expressvpn/resolve-endpoint.sh"]
    volumes:
      - ./expressvpn/resolve-endpoint.sh:/expressvpn/resolve-endpoint.sh:ro
    environment:
      VPN_SERVICE_PROVIDER: expressvpn
      VPN_TYPE: openvpn
      # The manual-configuration credentials from the ExpressVPN account page,
      # not the activation code.
      OPENVPN_USER: ${EXPRESSVPN_OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${EXPRESSVPN_OPENVPN_PASSWORD:-}
      # e.g. ireland-ca-version-2.expressnetw.com; see expressvpn/README.md.
      SERVER_HOSTNAMES: ${EXPRESSVPN_SERVER_HOSTNAME:-}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      # Don't add Via/X-Forwarded-For headers revealing the client address.
      HTTPPROXY_STEALTH: "on"
      HTTPPROXY_USER: ${EXPRESSVPN_PROXY_USER:-}
      HTTPPROXY_PASSWORD: ${EXPRESSVPN_PROXY_PASSWORD:-}
    ports:
      # Loopback by default; set the host's LAN address to serve other machines.
      - "${EXPRESSVPN_PROXY_BIND_ADDRESS:-127.0.0.1}:${EXPRESSVPN_PROXY_PORT:-8888}:8888/tcp"
    networks:
      - expressvpn-egress
      - expressvpn-proxy

volumes:
  https-gateway-data:
  https-gateway-config:

networks:
  # Future upstream services must opt in explicitly. Caddy is not attached to
  # the default Compose network, so it cannot reach other application services.
  https-gateway:
    # The aggregate project's existing conventional Compose name is explicit
    # so Caddy can restrict discovery without making the network external.
    name: server_containers_https-gateway
    internal: true
  # Allows Docker to publish Caddy's host ports without giving it access to
  # application containers. Only https-gateway joins this network.
  https-gateway-ingress:
  # Docker API traffic is isolated from both public ingress and applications.
  gateway-docker-api:
    internal: true
  # The DNS resolver needs an egress path to its configured upstream resolver,
  # but no other service joins this network.
  lan-dns-ingress:
  # Carries the VPN tunnel itself. Only expressvpn joins this network.
  expressvpn-egress:
  # Services that must reach the internet only through the VPN join this
  # network alone and use http://expressvpn:8888 as their proxy. It has no
  # route out, so a missing or ignored proxy setting fails rather than leaks.
  expressvpn-proxy:
    internal: true
