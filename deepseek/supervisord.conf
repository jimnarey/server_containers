[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:deepseek]
command=/usr/local/bin/dsh web --port 3080 --no-open
directory=/workspace
environment=HOME="/home/runuser",USER="runuser",LOGNAME="runuser",DSH_HOME="/home/runuser/.dsh",SSH_CONNECTION="container 0 container 0"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# dsh intentionally binds its authenticated web UI to container loopback.
# This relay makes it reachable through Docker networking while the published
# host port remains restricted to loopback.
[program:deepseek-web-relay]
command=/usr/bin/socat TCP-LISTEN:3081,reuseaddr,fork TCP:127.0.0.1:3080
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
