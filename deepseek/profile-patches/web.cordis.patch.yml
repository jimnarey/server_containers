# Host-plane web capabilities for the browser profile.  Keep provider selection
# explicit: it avoids silently returning to DeepSeek's paid cloud search if a
# second provider is installed in a later Harness release.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: guarded-fetch

- id: web-search-deepseek
  disabled: true

# Temporarily remove both model-visible web_search and web_fetch tools. Keep
# the provider definitions below so re-enabling is a small profile change.
- id: tool-web
  disabled: true

- insert:
    - id: web-search-searxng
      name: '@local/dsh-web-search-searxng'
      config:
        baseURL: http://searxng:8080/

    - id: web-fetch-guarded
      name: '@local/dsh-web-fetch-guarded'
      config:
        baseURL: http://guarded-fetch:8080/v1/fetch
