# Match the browser profile: local SearXNG search and the Harness HTTP(S)
# fetch provider are available to headless DeepSeek sessions too.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: guarded-fetch

- id: web-search-deepseek
  disabled: true

- insert:
    - id: web-search-searxng
      name: '@local/dsh-web-search-searxng'
      config:
        baseURL: http://searxng:8080/

    - id: web-fetch-guarded
      name: '@local/dsh-web-fetch-guarded'
      config:
        baseURL: http://guarded-fetch:8080/v1/fetch
