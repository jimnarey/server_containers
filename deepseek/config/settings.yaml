# Repository-owned DeepSeek Harness settings for the local Qwen workflow.
# `sync-config.py` mirrors this file to $DEEPSEEK_HOME/.dsh/settings.yaml.
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    llama-cpp:
      apiKeyEnv: LLAMA_CPP_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp:8080/v1
      # 2026-09-15 reliability review: this provider never had the
      # streamIdleTimeoutMs fix applied when it was added to the
      # llama-cpp-moe-* providers. session_analysis.py found 19 stream-idle-
      # timeout retries against this exact provider during the 27B model's
      # "medium-committed" era, the same failure class the 16gb/32gb/
      # csantiago78 fix addressed -- this was a real, evidenced gap, not a
      # precaution. Applied here for consistency.
      streamIdleTimeoutMs: 1800000
      models:
        # 2026-09-18: removed Qwen3-Embedding-0.6B-Q8_0, embeddinggemma-300M-
        # Q8_0, codellama-13b-instruct.Q4_0, wizardcoder-python-13b-v1.0 (both
        # quants) and starcoder2-15b-instruct.Q4_0 -- weight files deleted
        # from disk at the user's request (see llama-cpp-16gb's preset).
        # magicoder-s-ds-6.7b.Q4_0 also removed here for the same reason it
        # was already removed from the preset earlier the same day
        # (unsupported tokenizer, real load failure) -- this entry was
        # already dead before today's cleanup, just not yet caught here.
        - id: Llama-3.3-70B-Instruct-Q3_K_M
          contextWindow: 8192
        - id: Qwen2.5-72B-Instruct-Q3_K_S
          contextWindow: 8192
        - id: qwen2.5-coder-7b-instruct-q4_k_m
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q4_k_m
          contextWindow: 32768
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 8192
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 8192
        # 2026-09-17: contextWindow corrected from 65536 (stale, predates the
        # model even being tested) to 262144, the real dual-GPU ctx-size
        # confirmed by a real load + request (GPU0 10495/16311 MiB, GPU1
        # 13538/16311 MiB -- see performance-findings.md). The stale 65536
        # value would have made DSH compact at roughly a quarter of the
        # window this model actually has.
        - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0
          contextWindow: 262144
        # 2026-09-18: DeepSeek-R1-Distill-Llama-70B-Q4_K_M removed --
        # weight file deleted, dense and redundant with the two 70B-class
        # entries above, never real-load-tested. See llama-cpp-32gb's
        # preset comment.
        # 2026-09-18: added -- real MoE (deepseek2, 27 layers, 64/6
        # active), fits one card, not yet load-tested.
        - id: DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M
          contextWindow: 65536
        - id: Qwen3.8-27B-UD-Q4_K_M
          contextWindow: 131072
        - id: Qwen3.8-27B-UD-Q5_K_M
          contextWindow: 131072
        - id: Qwen3.8-27B-UD-Q6_K_M
          contextWindow: 163840
          maxTokens: 24576
        # 2026-09-18: same two 3-bit quants as the gpu-0/gpu-1 providers
        # below, but forced onto dual-GPU split-mode=tensor here despite
        # fitting on one card -- real measurement showed dense decode is
        # memory-bandwidth-bound, so splitting nearly doubles decode speed
        # (IQ3_S: 30.7 -> 39.5 tok/s; Q3_K_XL: 28.9 -> 38.4 tok/s) at the
        # cost of occupying both physical GPUs instead of leaving one free.
        # contextWindow=163840 matches the real deployed/tested ctx-size
        # (see performance-findings.md) -- different from, and not to be
        # confused with, the single-GPU entries of the same model ID under
        # llama-cpp-gpu-0/llama-cpp-gpu-1, which use a smaller ctx-size.
        - id: Qwen3.8-27B-UD-IQ3_S
          contextWindow: 163840
        - id: Qwen3.8-27B-UD-Q3_K_XL
          contextWindow: 163840
        - id: gpt-oss-20b-F16
          contextWindow: 131072
        # 2026-09-17: added for amiga-ui coding-agent use. Runs split-mode=layer
        # across both GPUs (NOT tensor -- confirmed via a real failed load that
        # this stock build's tensor-split doesn't support the deepseek2
        # architecture GLM-4.7-Flash uses; see models-preset.ini's comment).
        # contextWindow is the model's own native max (202752), confirmed by a
        # real load + request with real headroom to spare (~3.2-3.9 GiB free
        # per card), not assumed.
        #
        # No reasoning/thinkingLevelMap block here, deliberately, and for a
        # different reason than Qwen3.8-27B-UD-Q6_K_M above (which also has
        # none): direct A/B testing showed this model's reasoning_effort
        # parameter has NO observable effect at all -- "none"/"low"/"high"
        # requests produced statistically identical reasoning length
        # (3681/3715/3715 chars on the same debugging prompt). Q6_K_M omits
        # this block because its server-side default is correctly honoured;
        # GLM-4.7-Flash omits it because the parameter appears to be a no-op
        # regardless of source, so wiring DSH to send it would accomplish
        # nothing. The real safeguard against runaway reasoning for this model
        # is the hard `reasoning-budget = 8000` cap in models-preset.ini, not
        # a reasoning-effort level -- treat that budget as load-bearing here,
        # not just consistency with other models.
        - id: GLM-4.7-Flash-Q4_K_M
          contextWindow: 202752
          maxTokens: 24576
        # 2026-09-18: moved here from llama-cpp-gpu-0/llama-cpp-gpu-1 --
        # real single-GPU testing found this model needs both cards to
        # reach a useful context (16384 works solo but was judged too
        # small; 32768 fails a real CUDA OOM), not to fit at all. Now
        # split-mode=tensor across both GPUs, contextWindow=131072 not yet
        # load-tested (see the preset's own comment) -- verify before
        # trusting this value.
        - id: Devstral-Small-2-24B-Instruct-2512-Q4_K_M
          contextWindow: 131072
        - id: Devstral-Small-2505-Q4_K_M
          contextWindow: 131072
        # 2026-09-18: higher quants added same day, contextWindow matches
        # the Q4_K_M entries (131072) -- see the preset's own comment for
        # the real headroom projections. Not yet load-tested.
        - id: Devstral-Small-2-24B-Instruct-2512-Q5_K_M
          contextWindow: 131072
        - id: Devstral-Small-2-24B-Instruct-2512-Q6_K
          contextWindow: 131072
        - id: Devstral-Small-2505-Q5_K_M
          contextWindow: 131072
        - id: Devstral-Small-2505-Q6_K
          contextWindow: 131072
        # 2026-09-18: higher quants of the two Qwen2.5-Coder models, forced
        # dual-GPU tensor-split, contextWindow matches the existing 16GB
        # entries (32768). Not yet load-tested.
        - id: qwen2.5-coder-7b-instruct-q8_0
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q5_k_m
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q6_k
          contextWindow: 32768
        # 2026-09-18: new model, Qwen3.6-generation dense 27B (distinct
        # from the existing Qwen3.6-35B-A3B MoE entry on llama-cpp-16gb).
        # contextWindow=163840 is an estimate carried over from the
        # Qwen3.8-27B family's real overhead at this context, not measured
        # for this specific model -- see the preset's own comment. Not yet
        # load-tested.
        - id: Qwen3.6-27B-Q6_K
          contextWindow: 163840
    # These services mount the shared 16GB catalogue. It contains only models
    # whose one-card placement and context settings are selected for a 16 GiB
    # GPU. The all-GPU `llama-cpp` provider uses a separate 32GB catalogue for
    # tensor/layer-split models; choose gpu-0 or gpu-1 for one physical card,
    # or llama-cpp when a route genuinely needs both.
    llama-cpp-gpu-0:
      apiKeyEnv: LLAMA_CPP_GPU_0_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-gpu-0:8080/v1
      streamIdleTimeoutMs: 1800000
      models:
        - id: gpt-oss-20b-F16
          contextWindow: 131072
        - id: Qwen3.8-27B-UD-IQ3_S
          contextWindow: 98304
        - id: Qwen3.8-27B-UD-Q3_K_XL
          contextWindow: 65536
        - id: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M
          contextWindow: 16384
        - id: Qwen3.6-35B-A3B-Q4_K_M
          contextWindow: 16384
        - id: Qwen3.5-35B-A3B-Q4_K_M
          contextWindow: 16384
        - id: Ornith-1.5-35B-Q4_K_M
          contextWindow: 16384
        # 2026-09-18: added with the preset entries, real GGUF metadata
        # (block_count/expert_count) but n-cpu-moe values computed, not yet
        # load-tested -- see the preset's own comment.
        - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0-Expert-Offload
          contextWindow: 16384
        - id: Laguna-XS-2.1-Q4_K_M-Expert-Offload
          contextWindow: 16384
        - id: North-Mini-Code-1.0-UD-Q4_K_M-Expert-Offload
          contextWindow: 16384
        - id: granite-4.0-h-small-Q4_K_M-Expert-Offload
          contextWindow: 16384
        # 2026-09-18: added with the preset entry, contextWindow matches
        # the llama-cpp entry (65536) for a clean single-vs-dual
        # comparison -- see performance-findings.md. Not yet load-tested.
        - id: DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M
          contextWindow: 65536
        # 2026-09-18: higher quants of the two Qwen2.5-Coder models,
        # contextWindow matches the existing Q4_K_M entries (32768). Not
        # yet load-tested.
        - id: qwen2.5-coder-7b-instruct-q8_0
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q5_k_m
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q6_k
          contextWindow: 32768
    llama-cpp-gpu-1:
      apiKeyEnv: LLAMA_CPP_GPU_1_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-gpu-1:8080/v1
      streamIdleTimeoutMs: 1800000
      models:
        - id: gpt-oss-20b-F16
          contextWindow: 131072
        - id: Qwen3.8-27B-UD-IQ3_S
          contextWindow: 98304
        - id: Qwen3.8-27B-UD-Q3_K_XL
          contextWindow: 65536
        - id: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M
          contextWindow: 16384
        - id: Qwen3.6-35B-A3B-Q4_K_M
          contextWindow: 16384
        - id: Qwen3.5-35B-A3B-Q4_K_M
          contextWindow: 16384
        - id: Ornith-1.5-35B-Q4_K_M
          contextWindow: 16384
        # 2026-09-18: added with the preset entries, real GGUF metadata
        # (block_count/expert_count) but n-cpu-moe values computed, not yet
        # load-tested -- see the preset's own comment.
        - id: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0-Expert-Offload
          contextWindow: 16384
        - id: Laguna-XS-2.1-Q4_K_M-Expert-Offload
          contextWindow: 16384
        - id: North-Mini-Code-1.0-UD-Q4_K_M-Expert-Offload
          contextWindow: 16384
        - id: granite-4.0-h-small-Q4_K_M-Expert-Offload
          contextWindow: 16384
        # 2026-09-18: added with the preset entry, contextWindow matches
        # the llama-cpp entry (65536) for a clean single-vs-dual
        # comparison -- see performance-findings.md. Not yet load-tested.
        - id: DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M
          contextWindow: 65536
        # 2026-09-18: higher quants of the two Qwen2.5-Coder models,
        # contextWindow matches the existing Q4_K_M entries (32768). Not
        # yet load-tested.
        - id: qwen2.5-coder-7b-instruct-q8_0
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q5_k_m
          contextWindow: 32768
        - id: qwen2.5-coder-14b-instruct-q6_k
          contextWindow: 32768
    # CPU-only experimentation: these are the >32 GiB MoEs that gave usable
    # decode rates in prior testing. Their router presets intentionally use 8K.
    llama-cpp-cpu:
      apiKeyEnv: LLAMA_CPP_CPU_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-cpu:8080/v1
      # 2026-09-17: same fix already applied to llama-cpp/llama-cpp-moe-*/
      # csantiago78 for consistency -- this provider is CPU-only (~6.1x
      # slower decode than GPU-resident, measured on gpt-oss-20b, plus a real
      # cold-load first-touch mmap penalty on larger models; see
      # performance-findings.md), so the default 300000ms is, if anything,
      # more likely to be too short here than on the GPU providers where the
      # original gap was found.
      streamIdleTimeoutMs: 1800000
      models:
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 65536
          maxTokens: 4096
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 65536
          maxTokens: 4096
        # 2026-09-18: added with the preset entry -- dense, not MoE, so this
        # is plain CPU inference. contextWindow=65536 not yet load-tested on
        # this service.
        - id: Devstral-Small-2-24B-Instruct-2512-Q4_K_M
          contextWindow: 65536
        - id: Devstral-Small-2505-Q4_K_M
          contextWindow: 65536
    # The one-GPU MoE-cache router has a deliberately explicit catalogue.
    # Its friendly IDs are defined by its service preset, not directory
    # names under /models. 2026-09-17: this service is a last resort for
    # MoE models too large for a plain 32 GiB dual-GPU split -- its preset
    # was trimmed to just those models (see llama-cpp-generel-schwerz-16gb's
    # models-preset.ini), so this list is trimmed to match. GLM-4.5-Air/
    # gpt-oss-120b/Llama-4-Scout were already declared on the router but had
    # never been added here.
    llama-cpp-moe-16gb:
      apiKeyEnv: LLAMA_CPP_MOE_16GB_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-generel-schwerz-16gb:8080/v1
      # The pi-ai adapter's default streamIdleTimeoutMs (300000 = 5 minutes) is
      # too short for this service: a 2026-09-14 session showed compaction on
      # Flash Next reliably taking just over 5 minutes end-to-end (six
      # consecutive compaction attempts, each failing with "pi-ai stream idle
      # timeout after 300000ms" at exactly the 5-minute mark), which stalled
      # the session in a compact-fail/retry loop for over two hours before the
      # user aborted it. 30 minutes gives real headroom for a cold prefill on
      # this card's CPU-cached-expert architecture.
      streamIdleTimeoutMs: 1800000
      models:
        - id: Qwen3.8-Flash-Next-UD-Q3_K_XL
          contextWindow: 98304
          maxTokens: 12288
          # This model's own chat template defaults reasoning_effort to
          # "xhigh" whenever a request omits it, which on a debugging-style
          # prompt was observed to consume an entire multi-hundred-token
          # budget on <think> content before any answer was produced. `off`
          # is pi-ai's fallback key when no session-level effort is
          # requested, so this makes "low" the effective default. `minimal`
          # and `max` are pi-ai levels the model's template does not accept
          # (it only understands low/medium/xhigh and errors on anything
          # else), so they are clamped rather than left to pass through.
          reasoning: true
          thinkingLevelMap:
            off: low
            minimal: low
            max: xhigh
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: GLM-4.5-Air-UD-Q4_K_XL
          contextWindow: 65536
        - id: gpt-oss-120b-Q4_K_M
          contextWindow: 65536
        - id: Llama-4-Scout-17B-16E-Instruct-Q4_K_M
          contextWindow: 65536
    # 2026-09-18: added for the new llama-cpp-generel-schwerz-16gb-gpu-0
    # service -- a second instance of the same 16GB MoE-cache fork, pinned to
    # GPU 0 instead of GPU 1, sharing the exact same models-preset.ini/
    # config.ini as llama-cpp-moe-16gb above (see llama-cpp/README.md), so
    # the catalogue here is an exact copy of that provider's. Exists so a
    # schwerz-style session can run on GPU 0 while GPU 1 is occupied (by the
    # original 16gb instance, or anything else), or vice versa -- the two are
    # mutually exclusive on the *same* physical GPU only if both happen to
    # target it; the shared lock volume (see performance-findings.md) rejects
    # that specific conflict rather than colliding silently.
    llama-cpp-moe-16gb-gpu-0:
      apiKeyEnv: LLAMA_CPP_MOE_16GB_GPU_0_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-generel-schwerz-16gb-gpu-0:8080/v1
      streamIdleTimeoutMs: 1800000
      models:
        - id: Qwen3.8-Flash-Next-UD-Q3_K_XL
          contextWindow: 98304
          maxTokens: 12288
          reasoning: true
          thinkingLevelMap:
            off: low
            minimal: low
            max: xhigh
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: GLM-4.5-Air-UD-Q4_K_XL
          contextWindow: 65536
        - id: gpt-oss-120b-Q4_K_M
          contextWindow: 65536
        - id: Llama-4-Scout-17B-16E-Instruct-Q4_K_M
          contextWindow: 65536
    # The two-GPU service exposes the same explicit MoE catalogue, minus
    # Flash Next -- that service's own preset deliberately excludes it (its
    # PLE table needs mmap, which the codex/moe-grouped-multigpu pin here
    # does not support; see llama-cpp-generel-schwerz-32gb's models-preset.ini).
    # It stays separate from the 16GB service(s) so choosing it is an
    # intentional decision to occupy both cards. 2026-09-17: trimmed to match
    # that preset for the same reason as llama-cpp-moe-16gb above; the
    # dangling Flash Next entry that was listed here despite never being
    # declared on this router (a pre-existing gap, unrelated to today's trim)
    # is also removed.
    llama-cpp-moe-32gb:
      apiKeyEnv: LLAMA_CPP_MOE_32GB_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-generel-schwerz-32gb:8080/v1
      streamIdleTimeoutMs: 1800000
      models:
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: GLM-4.5-Air-UD-Q4_K_XL
          contextWindow: 65536
        - id: gpt-oss-120b-Q4_K_M
          contextWindow: 65536
        - id: Llama-4-Scout-17B-16E-Instruct-Q4_K_M
          contextWindow: 65536
    # Independent csantiago78/llama.cpp MoE expert cache: an alternative to
    # llama-cpp-moe-32gb for the same two GPUs, using a different fork's
    # expert-cache implementation (see compose.ai.yml and
    # llama-cpp/config/llama-cpp-csantiago78/config.ini). Not yet build- or run-tested
    # in this deployment. Its Flash Next settings below mirror the established
    # one-GPU Flash Next route, not llama-cpp-moe-32gb: that two-GPU service
    # deliberately excludes Flash Next because its preset cannot use mmap.
    llama-cpp-csantiago78:
      apiKeyEnv: LLAMA_CPP_CSANTIAGO78_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp-csantiago78:8080/v1
      streamIdleTimeoutMs: 1800000
      models:
        - id: Qwen3.8-Flash-Next-UD-Q3_K_XL
          contextWindow: 98304
          maxTokens: 12288
          reasoning: true
          thinkingLevelMap:
            off: low
            minimal: low
            max: xhigh
        - id: Qwen3-Coder-Next-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
        - id: Qwen3-Next-80B-A3B-Instruct-Q4_K_M
          contextWindow: 65536
          maxTokens: 16384
# 2026-09-15 reliability review: the deployed runtime settings.yaml had
# already been changed to this (Flash Next is what every recent session has
# actually used) but this source template was never updated to match, so the
# next `sync-config.py` run would have silently reverted the default back to
# a model/provider that isn't even running. Updated to match reality.
agent-default-model:
  provider: llama-cpp-moe-16gb
  model: Qwen3.8-Flash-Next-UD-Q3_K_XL
agent-presets:
  # Presets are capability/tool compositions, not model routes. Keep the
  # shipped Standard composition as the default; agent-default-model above
  # independently selects the Qwen route for newly created sessions.
  default: standard
