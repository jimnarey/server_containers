# Repository-owned DeepSeek Harness settings for the local Qwen workflow.
# Compose mounts this file read-only at $DSH_HOME/settings.yaml.
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    # 2026-09-23: replaced the eight upstream/gpu-0/gpu-1/cpu/moe-16gb/
    # moe-16gb-gpu-0/moe-32gb/csantiago78 providers below with this single
    # provider for the new llama-cpp-unified service (see
    # llama-cpp/config/llama-cpp-unified/), which runs every model from every
    # former service on one router with an explicit per-model resource claim
    # (see models-preset.ini and its README.md). Every id here is the exact
    # unified-preset section name, including its `--cuda0` / `--cuda1` /
    # `--cuda0-cuda1` / `--cpu` resource suffix -- the router exposes each
    # section as a separate model, so the suffix is part of the real id, not
    # decoration.
    #
    # Where a model+resource combination existed on more than one former
    # provider, the upstream (non-fork) provider's settings were kept and the
    # generel-schwerz/csantiago78 fork's settings were kept only for
    # combinations the upstream side never had (this is the user's stated
    # precedence: upstream wins over a fork for the same model on the same
    # card combination). The one case where this produces different settings
    # per suffix for the *same* model is Qwen3.8-Flash-Next-UD-Q3_K_XL: cuda0
    # keeps upstream llama-cpp-gpu-0's 262144/12288 (no reasoning workaround),
    # while cuda1 and cuda0-cuda1 have no upstream equivalent and keep the
    # fork's 98304/12288 plus the reasoning/thinkingLevelMap workaround below
    # (that workaround compensates for this model's chat template defaulting
    # reasoning_effort to "xhigh"; it is unrelated to, and kept separate from,
    # the streamIdleTimeoutMs compaction fix applied at the provider level).
    #
    # Models that never had any DSH entry on any former provider (gemma-3n
    # E2B/E4B, NVIDIA-Nemotron-3-Nano-4B, Ornith-1.5-9B, Qwen3.5-9B,
    # gpt-oss-20b-MXFP4, gpt-oss-120b-MXFP4, Ling-3.0-flash,
    # upstage.Solar-Open-100B, and the dual-GPU-only gpt-oss-20b-F16 and
    # DeepSeek-Coder-V2-Lite-Instruct-Q8_0) get a fresh contextWindow copied
    # from their own models-preset.ini `ctx-size`, since there is no prior
    # deepseek setting to translate.
    #
    # Ornith-1.5-35B-A3B-Q4_K_M was carried over under its real preset
    # section name: every former provider's `id:` for it (`Ornith-1.5-35B-
    # Q4_K_M`, missing "-A3B") did not match the section name the router
    # actually serves, a pre-existing naming bug now fixed rather than
    # repeated.
    llama-cpp-unified:
      apiKeyEnv: LLAMA_CPP_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp:8080/v1
      # Carried over from the former llama-cpp/llama-cpp-moe-*/csantiago78
      # providers: the pi-ai adapter's default (300000ms = 5 minutes) is too
      # short for compaction on this fleet -- a 2026-09-14 session showed
      # compaction on Flash Next reliably taking just over 5 minutes
      # end-to-end, failing with "pi-ai stream idle timeout after 300000ms"
      # six times in a row before the user aborted. 30 minutes gives real
      # headroom for a cold prefill.
      streamIdleTimeoutMs: 1800000
      models:
        - id: qwen2.5-coder-7b-instruct-q4_k_m--cuda0
          contextWindow: 131072
        - id: qwen2.5-coder-7b-instruct-q4_k_m--cuda1
          contextWindow: 131072
        - id: qwen2.5-coder-14b-instruct-q4_k_m--cuda0
          contextWindow: 131072
        - id: qwen2.5-coder-14b-instruct-q4_k_m--cuda1
          contextWindow: 131072
        - id: qwen2.5-coder-7b-instruct-q8_0--cuda0
          contextWindow: 131072
        - id: qwen2.5-coder-7b-instruct-q8_0--cuda1
