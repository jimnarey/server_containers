# Repository-owned DeepSeek Harness settings for the local Qwen workflow.
# Compose mounts this file read-only at $DSH_HOME/settings.yaml.
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    # One upstream router serves every declared CPU and GPU placement.
    # Each ID below matches a section in the unified models preset; its resource
    # suffix is part of the model ID and selects the declared placement.
    llama-cpp:
      apiKeyEnv: LLAMA_CPP_API_KEY
      api: openai-completions
      baseURL: http://llama-cpp:8080/v1
      # Carried over from the former former separate llama.cpp routes
      # providers: the pi-ai adapter's default (300000ms = 5 minutes) is too
      # short for compaction on this fleet -- a 2026-09-14 session showed
      # compaction on Flash Next reliably taking just over 5 minutes
      # end-to-end, failing with "pi-ai stream idle timeout after 300000ms"
      # six times in a row before the user aborted. 30 minutes gives real
      # headroom for a cold prefill.
      streamIdleTimeoutMs: 1800000
      models:
