# Copy to /mnt/work/csantiago78-llama-cpp/config/config.ini.
# System-level settings shared by every model on this service. Per-model
# placement, context, and load settings belong in models-preset.ini, because
# system settings take precedence over model settings in router mode.
#
# This service exists because generel-schwerz-llama-cpp's MoE expert cache is
# pinned to CUDA device 0 (GenerelSchwerz/llama.cpp#90) and cannot actually
# use a second GPU. csantiago78/llama.cpp's independent `moe-expert-cache`
# implementation (see the Dockerfile for the pinned commit) has been reported
# working across multiple GPUs elsewhere — cache slots distributed per
# device under --split-mode layer. It has not been build- or run-tested in
# this deployment yet.
[*]
# Unlike llama-cpp/models-preset.ini and generel-schwerz-llama-cpp/config's
# own [*] sections, this file never set `parallel`, so the router defaulted
# to n_slots = 4 (confirmed in this service's own startup log). A single
# interactive client should get the full configured context on one slot, as
# the sibling services already do; leaving this unset splits the router's
# scheduling across four idle slots for no benefit here and is a likely
# contributor to the slower-than-expected decode speed measured against
# this fork's own moe-expert-cache.
parallel                  = 1
threads                  = 8
threads-batch             = 8
batch-size                = 8192
ubatch-size               = 512
split-mode                = layer
tensor-split              = 1,1
kv-offload                = true
cache-type-k               = q8_0
cache-type-v               = q8_0
flash-attn                = on
# All three catalogued models are MoE with the standard `*_exps` tensor
# names, so expert routing placement applies uniformly here rather than
# per-model as in generel-schwerz-llama-cpp's config. Flash Next additionally
# carries a per_layer_token_embd (PLE) tensor -- the "phrase book" lookup
# table described in the source material for this fork -- that the `exps`
# pattern does not match. Forcing it to CPU too is a no-op for the other two
# catalogued models, which have no such tensor (see
# generel-schwerz-llama-cpp/config/models-preset.ini's warning against
# reusing this override on a model without one). Without it, `n-gpu-layers =
# all` would place Flash Next's ~51B-parameter PLE table on GPU alongside
# its dense core, which this service's 2x16GB VRAM budget cannot hold.
# System settings take precedence over model settings in this fork's router
# mode (see top of file), so this must live here rather than per-model in
# models-preset.ini.
n-gpu-layers              = all
override-tensor            = exps=CPU,per_layer_token_embd=CPU
# Starting point only, scaled down from the one reported Flash-Next
# measurement found for this fork (48 cache slots on 2x24GB RTX 3090 = 48GB
# combined VRAM) to this service's 2x16GB = 32GB combined budget. Verify
# against nvidia-smi and actual decode/prefill throughput before trusting
# this number — csantiago78's cache is a different implementation from
# generel-schwerz's, so slot cost per model is not assumed equivalent.
moe-expert-cache           = 32
moe-expert-cache-inserts   = 2
fit                       = off
