; Models for services the model broker starts and stops by restarting their
; container (here, Strata). Mounted read-only into the broker, which reads it as
; it does llama-cpp/config/models-preset.ini: `version = 1`, `;` comments, one
; self-contained section per model.
;
; Strata serves exactly one model per process, chosen when its container starts,
; and cannot change it while running. To change model the broker asks its host
; service (model-broker-service-control) to start the container with the
; section's `env.` settings. Those names are what compose.ai.yml passes on to
; entrypoint.sh; each must also be listed in `allowed-env` for strata in the host
; service's configuration, or the request is refused.
;
; The section name is the public model ID. It ends in --cuda<N>, and `device`
; names the same card: N is the physical GPU, the one STRATA_GPU_DEVICE_ID gives
; the container.
;
; Settings:
; - service: the compose service, which the broker needs a client for (strata).
; - device: CUDA<N>, matching the name's suffix.
; - exclusive: resources besides the GPU that no other model may hold while this
;   one is loaded. Strata copies its experts into RAM, so it holds RAM:weights,
;   which conflicts with llama.cpp's CPU-weight and expert-offload models.
; - env.<NAME>: an environment variable for the container. List all of them in
;   every section, empty ones too: the container is recreated with exactly these,
;   so an empty value overrides whatever .env sets.
;     STRATA_FAMILY, STRATA_MODEL: the family (qwen, swift or coder) and quant.
;     STRATA_CONTEXT: tokens, fixed for the life of the process. Strata has no
;       compaction: a request over this is a hard error.
;     STRATA_KV: int8, q4_0 or k8v4. STRATA_VISION: yes/gpu/cpu or no/none.
;     STRATA_LOW_RAM: auto, on or off (see strata/README.md).
;     STRATA_SPEED_PROJECTION: path, in the container, of a refusal-direction
;       control vector (qwen and coder only; see "Uncensored mode" in
;       strata/README.md). Empty for none.
;
; A model whose files are not installed fails to start: the container would
; download it (60-85 GB). Install a quant first with the `--setup --no-start`
; commands in strata/README.md, then add its section here.
version = 1

[Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS--cuda1]
service = strata
device = CUDA1
exclusive = RAM:weights
env.STRATA_FAMILY = qwen
env.STRATA_MODEL = IQ2_XS
env.STRATA_CONTEXT = 131072
env.STRATA_KV = int8
env.STRATA_VISION = no
env.STRATA_LOW_RAM = auto
env.STRATA_SPEED_PROJECTION =

; The same weights as above with the control vector applied.
; Source: alesha-pro/Qwen3.8-Flash-Next-abliterated-GSQ-RCO-Strata-GGUF.
[Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-uncensored--cuda1]
service = strata
device = CUDA1
exclusive = RAM:weights
env.STRATA_FAMILY = qwen
env.STRATA_MODEL = IQ2_XS
env.STRATA_CONTEXT = 131072
env.STRATA_KV = int8
env.STRATA_VISION = no
env.STRATA_LOW_RAM = auto
env.STRATA_SPEED_PROJECTION = /data/vectors/Huihui-Qwen3.8-Flash-Next-refusal-direction-r.gguf

[Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS--cuda1]
service = strata
device = CUDA1
exclusive = RAM:weights
env.STRATA_FAMILY = swift
env.STRATA_MODEL = IQ2_XS
env.STRATA_CONTEXT = 131072
env.STRATA_KV = int8
env.STRATA_VISION = no
env.STRATA_LOW_RAM = auto
env.STRATA_SPEED_PROJECTION =
